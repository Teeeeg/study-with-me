# The learning backlog: topics queued up for future notes.
#
# To add a topic, drop a new item under the right group. Each item is:
#   - status: todo | doing | done   (defaults to todo)
#     en:     English title
#     zh:     Chinese title
#     ref:    optional, the `ref` of the page once it is written
#     note:   optional, an en/zh pair with a one-line reminder to yourself
#
# A group either points at an existing cluster with `dir:` (the title is then
# taken from `_data/clusters.yml`) or carries its own `title:` for a section
# that does not exist yet.

