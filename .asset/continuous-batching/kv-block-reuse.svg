<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"
    aria-labelledby="title desc">
    <title id="title">请求退出后，KV 物理块可以被新请求复用</title>
    <desc id="desc">块池有八个物理块。A 持有块 1 和 6，B 持有 0、4、5，C 持有 2、7，块 3 空闲。A 完成并安全释放私有块后，D 取得 1 和 6，B 与 C
        的位置不变。D 的逻辑块表是 1、6；它写入自己的 KV，不继承 A 的数据。图不含共享前缀和保留缓存。</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto">
            <path d="M0 0 L10 5 L0 10 Z" fill="#111111" />
        </marker>
        <style>
      text { font-family: Helvetica Neue, Segoe UI, sans-serif; letter-spacing: 0; }
      .title { font-size: 30px; font-weight: 800; fill: #111111; }
      .subtitle { font-size: 16px; fill: #333333; }
      .heading { font-size: 20px; font-weight: 800; fill: #111111; }
      .body { font-size: 17px; fill: #333333; }
      .label { font-size: 23px; font-weight: 700; fill: #111111; }
      .small { font-size: 15px; fill: #444444; }
      .inverse { font-size: 16px; font-weight: 700; fill: #FFFFFF; }
      .panel { fill: #F4F4F4; stroke: #111111; stroke-width: 3; }
      .a { fill: #F2D9D8; stroke: #111111; stroke-width: 2.5; }
      .b { fill: #DDE0F1; stroke: #111111; stroke-width: 2.5; }
      .c { fill: #F2E6D8; stroke: #111111; stroke-width: 2.5; }
      .d { fill: #DCEBDF; stroke: #111111; stroke-width: 3; }
      .free { fill: #FFFFFF; stroke: #999999; stroke-width: 2; stroke-dasharray: 5 4; }
      .arrow { fill: none; stroke: #111111; stroke-width: 3; marker-end: url(#arrow); }
    </style>
    </defs>
    <rect width="1200" height="650" fill="#FFFFFF" />
    <text x="600" y="45" text-anchor="middle" class="title">补入 D，不需要搬走 B 和 C 的历史 KV</text>
    <text x="600" y="77" text-anchor="middle" class="subtitle">同一物理块池的两个快照：方块内是当前请求，编号是物理块地址</text>

    <rect x="40" y="110" width="1120" height="165" rx="3" class="panel" />
    <text x="65" y="145" class="heading">1. A 即将完成：私有块位于 1 和 6</text>
    <rect x="70" y="166" width="115" height="49" rx="3" class="b" />
    <rect x="205" y="166" width="115" height="49" rx="3" class="a" />
    <rect x="340" y="166" width="115" height="49" rx="3" class="c" />
    <rect x="475" y="166" width="115" height="49" rx="3" class="free" />
    <rect x="610" y="166" width="115" height="49" rx="3" class="b" />
    <rect x="745" y="166" width="115" height="49" rx="3" class="b" />
    <rect x="880" y="166" width="115" height="49" rx="3" class="a" />
    <rect x="1015" y="166" width="115" height="49" rx="3" class="c" />
    <text x="128" y="199" text-anchor="middle" class="label">B</text>
    <text x="263" y="199" text-anchor="middle" class="label">A</text>
    <text x="398" y="199" text-anchor="middle" class="label">C</text>
    <text x="533" y="198" text-anchor="middle" class="body">空闲</text>
    <text x="668" y="199" text-anchor="middle" class="label">B</text>
    <text x="803" y="199" text-anchor="middle" class="label">B</text>
    <text x="938" y="199" text-anchor="middle" class="label">A</text>
    <text x="1073" y="199" text-anchor="middle" class="label">C</text>
    <text x="128" y="246" text-anchor="middle" class="small">块 0</text>
    <text x="263" y="246" text-anchor="middle" class="small">块 1</text>
    <text x="398" y="246" text-anchor="middle" class="small">块 2</text>
    <text x="533" y="246" text-anchor="middle" class="small">块 3</text>
    <text x="668" y="246" text-anchor="middle" class="small">块 4</text>
    <text x="803" y="246" text-anchor="middle" class="small">块 5</text>
    <text x="938" y="246" text-anchor="middle" class="small">块 6</text>
    <text x="1073" y="246" text-anchor="middle" class="small">块 7</text>

    <path d="M263 280 V339" class="arrow" />
    <path d="M938 280 V339" class="arrow" />
    <text x="600" y="300" text-anchor="middle" class="body">A 安全释放 → 可用块为 {1, 3, 6}</text>
    <text x="600" y="326" text-anchor="middle" class="body">D 取得其中的 1 和 6，写入自己的 KV</text>

    <rect x="40" y="348" width="1120" height="165" rx="3" class="panel" />
    <text x="65" y="383" class="heading">2. D 接入之后：B / C 不搬动，块 3 仍空闲</text>
    <rect x="70" y="403" width="115" height="49" rx="3" class="b" />
    <rect x="205" y="403" width="115" height="49" rx="3" class="d" />
    <rect x="340" y="403" width="115" height="49" rx="3" class="c" />
    <rect x="475" y="403" width="115" height="49" rx="3" class="free" />
    <rect x="610" y="403" width="115" height="49" rx="3" class="b" />
    <rect x="745" y="403" width="115" height="49" rx="3" class="b" />
    <rect x="880" y="403" width="115" height="49" rx="3" class="d" />
    <rect x="1015" y="403" width="115" height="49" rx="3" class="c" />
    <text x="128" y="436" text-anchor="middle" class="label">B</text>
    <text x="263" y="436" text-anchor="middle" class="label">D</text>
    <text x="398" y="436" text-anchor="middle" class="label">C</text>
    <text x="533" y="435" text-anchor="middle" class="body">空闲</text>
    <text x="668" y="436" text-anchor="middle" class="label">B</text>
    <text x="803" y="436" text-anchor="middle" class="label">B</text>
    <text x="938" y="436" text-anchor="middle" class="label">D</text>
    <text x="1073" y="436" text-anchor="middle" class="label">C</text>
    <text x="128" y="483" text-anchor="middle" class="small">块 0</text>
    <text x="263" y="483" text-anchor="middle" class="small">块 1</text>
    <text x="398" y="483" text-anchor="middle" class="small">块 2</text>
    <text x="533" y="483" text-anchor="middle" class="small">块 3</text>
    <text x="668" y="483" text-anchor="middle" class="small">块 4</text>
    <text x="803" y="483" text-anchor="middle" class="small">块 5</text>
    <text x="938" y="483" text-anchor="middle" class="small">块 6</text>
    <text x="1073" y="483" text-anchor="middle" class="small">块 7</text>

    <text x="600" y="550" text-anchor="middle" class="heading">D 的逻辑块 0 → 物理块 1；逻辑块 1 → 物理块 6</text>
    <text x="600" y="580" text-anchor="middle" class="small">示意仅含私有块；共享前缀与缓存保留时，需要先检查引用和淘汰条件。</text>
    <rect x="40" y="608" width="1120" height="30" rx="3" fill="#111111" />
    <text x="600" y="629" text-anchor="middle" class="inverse">调度器决定谁参与，块管理器决定 KV
        放在哪里；复用空间不等于复用别人的上下文</text>
</svg>