<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">NVIDIA Grace Blackwell Architecture</title>
  <desc id="desc">Detailed architecture of GB200 Superchip and GB200 NVL72 rack-scale system showing CPU-GPU integration and NVLink interconnect.</desc>
  <rect width="1200" height="1000" fill="#F5F5F7"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <text x="50" y="58" fill="#1D1D1F" font-size="32" font-weight="600">NVIDIA Grace Blackwell Architecture</text>
    <text x="50" y="88" fill="#6E6E73" font-size="16">From superchip to rack-scale AI computer</text>

    <!-- GB200 Superchip -->
    <rect x="60" y="130" width="540" height="400" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="330" y="165" fill="#1D1D1F" font-size="22" font-weight="600" text-anchor="middle">GB200 Grace Blackwell Superchip</text>

    <!-- Grace CPU -->
    <rect x="90" y="190" width="180" height="320" rx="8" fill="#34C759"/>
    <text x="180" y="220" fill="#FFFFFF" font-size="18" font-weight="600" text-anchor="middle">Grace CPU</text>
    <text x="180" y="245" fill="#D5F5DE" font-size="13" text-anchor="middle">ARM Neoverse V2</text>
    <text x="100" y="270" fill="#FFFFFF" font-size="12">• 72 cores</text>
    <text x="100" y="290" fill="#FFFFFF" font-size="12">• LPDDR5X memory</text>
    <text x="100" y="310" fill="#FFFFFF" font-size="12">• 512GB capacity</text>
    <text x="100" y="330" fill="#FFFFFF" font-size="12">• 546 GB/s bandwidth</text>
    <text x="100" y="350" fill="#FFFFFF" font-size="12">• Coherent memory</text>
    <text x="100" y="370" fill="#FFFFFF" font-size="12">• Optimized for AI/HPC</text>

    <rect x="100" y="390" width="160" height="30" rx="4" fill="#FFFFFF"/>
    <text x="180" y="410" fill="#34C759" font-size="11" font-weight="600" text-anchor="middle">NVLink-C2C</text>
    <text x="180" y="425" fill="#6E6E73" font-size="9" text-anchor="middle">900 GB/s per direction</text>

    <!-- Blackwell GPU 1 -->
    <rect x="300" y="190" width="130" height="150" rx="8" fill="#5E5CE6"/>
    <text x="365" y="215" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">Blackwell</text>
    <text x="365" y="232" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">GPU 1</text>
    <text x="310" y="255" fill="#E0DFFF" font-size="11">• 208B transistors</text>
    <text x="310" y="272" fill="#E0DFFF" font-size="11">• TSMC 4NP</text>
    <text x="310" y="289" fill="#E0DFFF" font-size="11">• Dual-die design</text>
    <text x="310" y="306" fill="#E0DFFF" font-size="11">• 96GB HBM3e</text>
    <text x="310" y="323" fill="#E0DFFF" font-size="11">• 8 TB/s mem BW</text>

    <!-- Chip-to-Chip Interconnect -->
    <rect x="310" y="350" width="110" height="25" rx="4" fill="#FF9500"/>
    <text x="365" y="367" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">10 TB/s C2C</text>

    <!-- Blackwell GPU 2 -->
    <rect x="300" y="385" width="130" height="125" rx="8" fill="#5E5CE6"/>
    <text x="365" y="410" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">Blackwell</text>
    <text x="365" y="427" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">GPU 2</text>
    <text x="310" y="450" fill="#E0DFFF" font-size="11">• Gen 5 Tensor Core</text>
    <text x="310" y="467" fill="#E0DFFF" font-size="11">• FP4/FP8 support</text>
    <text x="310" y="484" fill="#E0DFFF" font-size="11">• NVLink 5.0</text>
    <text x="310" y="501" fill="#E0DFFF" font-size="11">• 1.8 TB/s per GPU</text>

    <!-- Specifications -->
    <rect x="450" y="190" width="130" height="320" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
    <text x="515" y="215" fill="#1D1D1F" font-size="14" font-weight="600" text-anchor="middle">Key Features</text>

    <text x="460" y="240" fill="#1D1D1F" font-size="11" font-weight="600">Unified Memory:</text>
    <text x="460" y="255" fill="#6E6E73" font-size="10">CPU + GPU coherent</text>

    <text x="460" y="280" fill="#1D1D1F" font-size="11" font-weight="600">Total Memory:</text>
    <text x="460" y="295" fill="#6E6E73" font-size="10">192GB GPU HBM3e</text>
    <text x="460" y="308" fill="#6E6E73" font-size="10">512GB CPU LPDDR5X</text>

    <text x="460" y="330" fill="#1D1D1F" font-size="11" font-weight="600">Compute:</text>
    <text x="460" y="345" fill="#6E6E73" font-size="10">20 PetaFLOPS FP4</text>
    <text x="460" y="358" fill="#6E6E73" font-size="10">10 PetaFLOPS FP8</text>

    <text x="460" y="380" fill="#1D1D1F" font-size="11" font-weight="600">Interconnect:</text>
    <text x="460" y="395" fill="#6E6E73" font-size="10">1.8 TB/s NVLink 5</text>
    <text x="460" y="408" fill="#6E6E73" font-size="10">900 GB/s CPU-GPU</text>

    <text x="460" y="430" fill="#1D1D1F" font-size="11" font-weight="600">Power:</text>
    <text x="460" y="445" fill="#6E6E73" font-size="10">~1400W TDP</text>

    <text x="460" y="467" fill="#1D1D1F" font-size="11" font-weight="600">Use Case:</text>
    <text x="460" y="482" fill="#6E6E73" font-size="10">Trillion-param LLM</text>
    <text x="460" y="495" fill="#6E6E73" font-size="10">training &amp; inference</text>

    <!-- GB200 NVL72 Rack System -->
    <rect x="60" y="560" width="1080" height="400" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="600" y="595" fill="#1D1D1F" font-size="22" font-weight="600" text-anchor="middle">GB200 NVL72: Rack-Scale AI Computer</text>
    <text x="600" y="620" fill="#6E6E73" font-size="14" text-anchor="middle">36 Grace CPUs + 72 Blackwell GPUs in single liquid-cooled rack</text>

    <!-- Rack visualization -->
    <rect x="90" y="650" width="320" height="280" rx="8" fill="#1D1D1F"/>
    <text x="250" y="680" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">Liquid-Cooled Rack</text>

    <!-- GB200 Superchips in rack -->
    <g transform="translate(110, 700)">
      <rect x="0" y="0" width="280" height="15" rx="3" fill="#34C759"/>
      <text x="140" y="11" fill="#FFFFFF" font-size="8" text-anchor="middle">GB200 × 36 Superchips</text>
    </g>

    <rect x="110" y="725" width="280" height="80" rx="4" fill="#5E5CE6"/>
    <text x="250" y="750" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">72 Blackwell GPUs</text>
    <text x="250" y="770" fill="#E0DFFF" font-size="11" text-anchor="middle">Connected via NVLink 5.0</text>
    <text x="250" y="788" fill="#E0DFFF" font-size="11" text-anchor="middle">Acts as single massive GPU</text>

    <rect x="110" y="815" width="280" height="50" rx="4" fill="#FF9500"/>
    <text x="250" y="835" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">9× NVLink Switch Boards</text>
    <text x="250" y="853" fill="#FFE5CC" font-size="10" text-anchor="middle">130 TB/s aggregate bandwidth</text>

    <rect x="110" y="875" width="280" height="40" rx="4" fill="#34C759"/>
    <text x="250" y="895" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">36 Grace CPUs</text>
    <text x="250" y="910" fill="#D5F5DE" font-size="10" text-anchor="middle">Unified memory architecture</text>

    <!-- System Specifications -->
    <rect x="440" y="650" width="320" height="280" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
    <text x="600" y="680" fill="#1D1D1F" font-size="18" font-weight="600" text-anchor="middle">System Specifications</text>

    <rect x="460" y="700" width="280" height="210" rx="6" fill="#FFFFFF"/>

    <text x="470" y="725" fill="#1D1D1F" font-size="13" font-weight="600">Total Memory:</text>
    <text x="470" y="743" fill="#6E6E73" font-size="12">• 13.5 TB unified HBM3e (GPU)</text>
    <text x="470" y="760" fill="#6E6E73" font-size="12">• 18.4 TB LPDDR5X (CPU)</text>

    <text x="470" y="785" fill="#1D1D1F" font-size="13" font-weight="600">Compute Performance:</text>
    <text x="470" y="803" fill="#6E6E73" font-size="12">• 130 PetaFLOPS FP4</text>
    <text x="470" y="820" fill="#6E6E73" font-size="12">• 65 PetaFLOPS FP8</text>

    <text x="470" y="845" fill="#1D1D1F" font-size="13" font-weight="600">Interconnect:</text>
    <text x="470" y="863" fill="#6E6E73" font-size="12">• 130 TB/s NVLink fabric</text>
    <text x="470" y="880" fill="#6E6E73" font-size="12">• 1.8 TB/s per GPU bidirectional</text>
    <text x="470" y="897" fill="#6E6E73" font-size="12">• Full GPU-GPU connectivity</text>

    <!-- Performance Comparison -->
    <rect x="780" y="650" width="340" height="280" rx="8" fill="#E8F2FF" stroke="#0071E3"/>
    <text x="950" y="680" fill="#1D1D1F" font-size="18" font-weight="600" text-anchor="middle">Performance vs H100</text>

    <rect x="800" y="700" width="300" height="210" rx="6" fill="#FFFFFF"/>

    <g transform="translate(810, 720)">
      <circle cx="7" cy="7" r="5" fill="#34C759"/>
      <text x="20" y="12" fill="#1D1D1F" font-size="12">30× faster LLM inference (trillion-param)</text>
    </g>

    <g transform="translate(810, 745)">
      <circle cx="7" cy="7" r="5" fill="#34C759"/>
      <text x="20" y="12" fill="#1D1D1F" font-size="12">4× more HBM3e memory capacity</text>
    </g>

    <g transform="translate(810, 770)">
      <circle cx="7" cy="7" r="5" fill="#34C759"/>
      <text x="20" y="12" fill="#1D1D1F" font-size="12">25× more NVLink bandwidth</text>
    </g>

    <g transform="translate(810, 795)">
      <circle cx="7" cy="7" r="5" fill="#0071E3"/>
      <text x="20" y="12" fill="#1D1D1F" font-size="12">Single rack = exascale computer</text>
    </g>

    <g transform="translate(810, 820)">
      <circle cx="7" cy="7" r="5" fill="#0071E3"/>
      <text x="20" y="12" fill="#1D1D1F" font-size="12">72-GPU unified domain</text>
    </g>

    <g transform="translate(810, 845)">
      <circle cx="7" cy="7" r="5" fill="#FF9500"/>
      <text x="20" y="12" fill="#1D1D1F" font-size="12">Requires liquid cooling (~120kW)</text>
    </g>

    <g transform="translate(810, 870)">
      <circle cx="7" cy="7" r="5" fill="#FF9500"/>
      <text x="20" y="12" fill="#1D1D1F" font-size="12">Premium pricing &amp; availability</text>
    </g>

    <text x="950" y="905" fill="#6E6E73" font-size="11" text-anchor="middle" font-style="italic">Target: GPT-4 scale and beyond</text>
  </g>
</svg>