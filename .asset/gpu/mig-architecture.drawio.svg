<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">MIG Multi-Instance GPU architecture</title>
  <desc id="desc">NVIDIA Multi-Instance GPU showing hardware partitioning, isolation, and resource allocation for multi-tenant workloads.</desc>
  <rect width="1200" height="900" fill="#F5F5F7"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <text x="50" y="58" fill="#1D1D1F" font-size="32" font-weight="600">MIG: Multi-Instance GPU</text>
    <text x="50" y="88" fill="#6E6E73" font-size="16">Hardware-level partitioning for isolation and QoS</text>

    <!-- Traditional GPU vs MIG Comparison -->
    <rect x="60" y="130" width="540" height="340" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="330" y="165" fill="#1D1D1F" font-size="22" font-weight="600" text-anchor="middle">Traditional Shared GPU</text>
    <text x="330" y="190" fill="#6E6E73" font-size="14" text-anchor="middle">No hardware isolation</text>

    <!-- Single GPU with shared resources -->
    <rect x="90" y="220" width="480" height="230" rx="8" fill="#1D1D1F"/>
    <text x="330" y="245" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">A100 GPU (Full)</text>
    <text x="330" y="262" fill="#AEAEB2" font-size="12" text-anchor="middle">108 SMs • 80GB HBM2e • Shared Memory Controllers</text>

    <!-- Workload boxes -->
    <rect x="110" y="280" width="140" height="80" rx="6" fill="#FF9500"/>
    <text x="180" y="310" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">Tenant A</text>
    <text x="180" y="328" fill="#FFE5CC" font-size="11" text-anchor="middle">Inference</text>
    <text x="180" y="343" fill="#FFE5CC" font-size="10" text-anchor="middle">Uses 10GB</text>
    <text x="180" y="355" fill="#FFE5CC" font-size="9" text-anchor="middle">Can see all memory</text>

    <rect x="270" y="280" width="140" height="80" rx="6" fill="#0071E3"/>
    <text x="340" y="310" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">Tenant B</text>
    <text x="340" y="328" fill="#CCE5FF" font-size="11" text-anchor="middle">Training</text>
    <text x="340" y="343" fill="#CCE5FF" font-size="10" text-anchor="middle">Uses 40GB</text>
    <text x="340" y="355" fill="#CCE5FF" font-size="9" text-anchor="middle">Can OOM others</text>

    <rect x="430" y="280" width="140" height="80" rx="6" fill="#34C759"/>
    <text x="500" y="310" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">Tenant C</text>
    <text x="500" y="328" fill="#D5F5DE" font-size="11" text-anchor="middle">Dev/Test</text>
    <text x="500" y="343" fill="#D5F5DE" font-size="10" text-anchor="middle">Uses 5GB</text>
    <text x="500" y="355" fill="#D5F5DE" font-size="9" text-anchor="middle">Error affects all</text>

    <!-- Problems -->
    <rect x="110" y="375" width="460" height="60" rx="6" fill="#FFF3E0" stroke="#FF9500"/>
    <text x="120" y="395" fill="#FF3B30" font-size="12" font-weight="600">✗ No isolation:</text>
    <text x="140" y="412" fill="#1D1D1F" font-size="11">• Memory visible across tenants</text>
    <text x="140" y="426" fill="#1D1D1F" font-size="11">• One tenant's OOM or error affects others</text>

    <!-- MIG Model -->
    <rect x="640" y="130" width="510" height="340" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="895" y="165" fill="#1D1D1F" font-size="22" font-weight="600" text-anchor="middle">MIG-Enabled GPU</text>
    <text x="895" y="190" fill="#6E6E73" font-size="14" text-anchor="middle">Hardware partitioning with isolation</text>

    <!-- MIG Instances -->
    <rect x="670" y="220" width="460" height="230" rx="8" fill="#1D1D1F"/>
    <text x="900" y="245" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">A100 GPU (MIG Mode)</text>
    <text x="900" y="262" fill="#AEAEB2" font-size="12" text-anchor="middle">Partitioned into isolated GPU Instances</text>

    <!-- GI 0: Large instance -->
    <rect x="690" y="280" width="200" height="75" rx="6" fill="#FF9500" stroke="#FFFFFF" stroke-width="2"/>
    <text x="790" y="305" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">GI 0: 3g.20gb</text>
    <text x="790" y="323" fill="#FFE5CC" font-size="11" text-anchor="middle">42 SMs • 20GB Memory</text>
    <text x="790" y="337" fill="#FFE5CC" font-size="10" text-anchor="middle">Tenant A (Training)</text>
    <text x="790" y="350" fill="#FFE5CC" font-size="9" text-anchor="middle">Isolated memory controllers</text>

    <!-- GI 1 and GI 2: Small instances -->
    <rect x="910" y="280" width="200" height="75" rx="6" fill="#0071E3" stroke="#FFFFFF" stroke-width="2"/>
    <text x="1010" y="305" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">GI 1: 2g.10gb</text>
    <text x="1010" y="323" fill="#CCE5FF" font-size="11" text-anchor="middle">28 SMs • 10GB Memory</text>
    <text x="1010" y="337" fill="#CCE5FF" font-size="10" text-anchor="middle">Tenant B (Inference)</text>
    <text x="1010" y="350" fill="#CCE5FF" font-size="9" text-anchor="middle">Independent cache</text>

    <!-- GI 3 and GI 4 -->
    <rect x="690" y="365" width="95" height="55" rx="6" fill="#34C759" stroke="#FFFFFF" stroke-width="2"/>
    <text x="737" y="388" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">GI 2</text>
    <text x="737" y="403" fill="#D5F5DE" font-size="9" text-anchor="middle">1g.5gb</text>
    <text x="737" y="414" fill="#D5F5DE" font-size="8" text-anchor="middle">Tenant C</text>

    <rect x="795" y="365" width="95" height="55" rx="6" fill="#5E5CE6" stroke="#FFFFFF" stroke-width="2"/>
    <text x="842" y="388" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">GI 3</text>
    <text x="842" y="403" fill="#E0DFFF" font-size="9" text-anchor="middle">1g.5gb</text>
    <text x="842" y="414" fill="#E0DFFF" font-size="8" text-anchor="middle">Tenant D</text>

    <!-- Unused capacity -->
    <rect x="910" y="365" width="200" height="55" rx="6" fill="#E5E5EA"/>
    <text x="1010" y="397" fill="#86868B" font-size="11" text-anchor="middle">Unused Capacity</text>
    <text x="1010" y="411" fill="#86868B" font-size="9" text-anchor="middle">Can create more instances</text>

    <!-- Benefits -->
    <rect x="670" y="435" width="200" height="15" rx="3" fill="#E8F2FF"/>
    <text x="770" y="447" fill="#0071E3" font-size="10" font-weight="600" text-anchor="middle">✓ Hardware Isolation</text>

    <rect x="880" y="435" width="250" height="15" rx="3" fill="#E8F2FF"/>
    <text x="1005" y="447" fill="#0071E3" font-size="10" font-weight="600" text-anchor="middle">✓ Error containment per instance</text>

    <!-- MIG Architecture Detail -->
    <rect x="60" y="500" width="1080" height="180" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="600" y="535" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="middle">MIG Instance Components</text>

    <!-- Components diagram -->
    <rect x="90" y="560" width="320" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
    <text x="250" y="585" fill="#1D1D1F" font-size="15" font-weight="600" text-anchor="middle">GPU Instance (GI)</text>

    <rect x="110" y="600" width="80" height="45" rx="6" fill="#FF9500"/>
    <text x="150" y="618" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle">SM Slice</text>
    <text x="150" y="632" fill="#FFE5CC" font-size="9" text-anchor="middle">14-42 SMs</text>

    <rect x="205" y="600" width="80" height="45" rx="6" fill="#0071E3"/>
    <text x="245" y="618" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle">Memory</text>
    <text x="245" y="632" fill="#CCE5FF" font-size="9" text-anchor="middle">5-40 GB</text>

    <rect x="300" y="600" width="90" height="45" rx="6" fill="#34C759"/>
    <text x="345" y="618" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle">Controllers</text>
    <text x="345" y="632" fill="#D5F5DE" font-size="9" text-anchor="middle">Isolated</text>

    <!-- Partition configurations -->
    <rect x="440" y="560" width="320" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
    <text x="600" y="585" fill="#1D1D1F" font-size="15" font-weight="600" text-anchor="middle">Common Partitions (A100)</text>

    <text x="460" y="608" fill="#1D1D1F" font-size="12" font-weight="600">1g.5gb:</text>
    <text x="520" y="608" fill="#6E6E73" font-size="11">14 SMs, 5GB (7 instances max)</text>

    <text x="460" y="628" fill="#1D1D1F" font-size="12" font-weight="600">2g.10gb:</text>
    <text x="520" y="628" fill="#6E6E73" font-size="11">28 SMs, 10GB (3 instances max)</text>

    <text x="460" y="648" fill="#1D1D1F" font-size="12" font-weight="600">3g.20gb:</text>
    <text x="520" y="648" fill="#6E6E73" font-size="11">42 SMs, 20GB (2 instances max)</text>

    <!-- Isolation features -->
    <rect x="790" y="560" width="320" height="100" rx="8" fill="#E8F2FF" stroke="#0071E3"/>
    <text x="950" y="585" fill="#1D1D1F" font-size="15" font-weight="600" text-anchor="middle">Isolation Features</text>

    <g transform="translate(810, 600)">
      <circle cx="7" cy="7" r="5" fill="#34C759"/>
      <text x="20" y="12" fill="#1D1D1F" font-size="11">Separate memory address space</text>
    </g>
    <g transform="translate(810, 620)">
      <circle cx="7" cy="7" r="5" fill="#34C759"/>
      <text x="20" y="12" fill="#1D1D1F" font-size="11">Independent error handling</text>
    </g>
    <g transform="translate(810, 640)">
      <circle cx="7" cy="7" r="5" fill="#34C759"/>
      <text x="20" y="12" fill="#1D1D1F" font-size="11">Guaranteed compute &amp; memory</text>
    </g>

    <!-- Comparison Table -->
    <rect x="60" y="710" width="1080" height="160" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="600" y="745" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="middle">MIG vs Traditional Sharing</text>

    <!-- Headers -->
    <text x="150" y="775" fill="#6E6E73" font-size="13" font-weight="600" text-anchor="middle">Feature</text>
    <text x="400" y="775" fill="#6E6E73" font-size="13" font-weight="600" text-anchor="middle">Traditional (MPS/Time-Slicing)</text>
    <text x="850" y="775" fill="#6E6E73" font-size="13" font-weight="600" text-anchor="middle">MIG</text>

    <line x1="90" y1="785" x2="1110" y2="785" stroke="#E5E5EA" stroke-width="2"/>

    <!-- Row 1: Isolation -->
    <text x="150" y="808" fill="#1D1D1F" font-size="12" font-weight="600" text-anchor="middle">Isolation</text>
    <text x="400" y="808" fill="#FF3B30" font-size="12" text-anchor="middle">Software (processes can interfere)</text>
    <text x="850" y="808" fill="#34C759" font-size="12" text-anchor="middle">Hardware (complete isolation)</text>

    <!-- Row 2: QoS -->
    <text x="150" y="833" fill="#1D1D1F" font-size="12" font-weight="600" text-anchor="middle">QoS Guarantee</text>
    <text x="400" y="833" fill="#FF9500" font-size="12" text-anchor="middle">Best-effort (no guarantees)</text>
    <text x="850" y="833" fill="#34C759" font-size="12" text-anchor="middle">Guaranteed resources per GI</text>

    <!-- Row 3: Flexibility -->
    <text x="150" y="858" fill="#1D1D1F" font-size="12" font-weight="600" text-anchor="middle">Flexibility</text>
    <text x="400" y="858" fill="#34C759" font-size="12" text-anchor="middle">Any GPU, dynamic allocation</text>
    <text x="850" y="858" fill="#FF9500" font-size="12" text-anchor="middle">A100/H100 only, fixed partitions</text>

  </g>
</svg>