<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">GPU Execution Model: SM, Warp, and SIMT</title>
  <desc id="desc">Hierarchical execution model showing the relationship between Grid, Block, Warp, Thread, and SM</desc>
  <rect width="1200" height="1000" fill="#F5F5F7"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <text x="50" y="58" fill="#1D1D1F" font-size="32" font-weight="600">GPU Execution Model: SM, Warp &amp; SIMT</text>
    <text x="50" y="88" fill="#6E6E73" font-size="16">From software abstraction (Grid/Block/Thread) to hardware execution (SM/Warp/SIMT)</text>

    <!-- Software View -->
    <rect x="60" y="130" width="520" height="400" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="320" y="165" fill="#1D1D1F" font-size="22" font-weight="600" text-anchor="middle">Software View (CUDA Programming)</text>

    <!-- Grid -->
    <rect x="90" y="190" width="460" height="320" rx="8" fill="#E8F2FF" stroke="#0071E3" stroke-width="2"/>
    <text x="320" y="220" fill="#1D1D1F" font-size="18" font-weight="600" text-anchor="middle">Grid (Kernel Launch)</text>

    <!-- Thread Blocks -->
    <g transform="translate(110, 240)">
      <!-- Block 0 (detailed) -->
      <rect x="0" y="0" width="200" height="240" rx="6" fill="#FFF3E0" stroke="#FF9500" stroke-width="2"/>
      <text x="100" y="25" fill="#1D1D1F" font-size="16" font-weight="600" text-anchor="middle">Thread Block 0</text>
      <text x="100" y="43" fill="#6E6E73" font-size="11" text-anchor="middle">e.g., 256 threads</text>

      <!-- Warps in Block -->
      <rect x="10" y="55" width="180" height="50" rx="4" fill="#FF9500"/>
      <text x="100" y="75" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">Warp 0 (Threads 0-31)</text>
      <text x="100" y="92" fill="#FFE5CC" font-size="10" text-anchor="middle">32 threads execute together</text>

      <rect x="10" y="115" width="180" height="50" rx="4" fill="#FF9500"/>
      <text x="100" y="135" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">Warp 1 (Threads 32-63)</text>
      <text x="100" y="152" fill="#FFE5CC" font-size="10" text-anchor="middle">32 threads execute together</text>

      <rect x="10" y="175" width="180" height="50" rx="4" fill="#E5E5EA"/>
      <text x="100" y="203" fill="#6E6E73" font-size="12" text-anchor="middle">... (Warps 2-7)</text>

      <text x="100" y="235" fill="#6E6E73" font-size="11" text-anchor="middle">256 threads = 8 warps</text>
    </g>

    <!-- Block 1 (simplified) -->
    <g transform="translate(330, 240)">
      <rect x="0" y="0" width="90" height="240" rx="6" fill="#FFF3E0" stroke="#FF9500" stroke-width="2"/>
      <text x="45" y="25" fill="#1D1D1F" font-size="14" font-weight="600" text-anchor="middle">Block 1</text>
      <text x="45" y="130" fill="#6E6E73" font-size="12" text-anchor="middle">...</text>
    </g>

    <!-- Block N (simplified) -->
    <g transform="translate(440, 240)">
      <rect x="0" y="0" width="90" height="240" rx="6" fill="#FFF3E0" stroke="#FF9500" stroke-width="2"/>
      <text x="45" y="25" fill="#1D1D1F" font-size="14" font-weight="600" text-anchor="middle">Block N</text>
      <text x="45" y="130" fill="#6E6E73" font-size="12" text-anchor="middle">...</text>
    </g>

    <!-- Hardware View -->
    <rect x="620" y="130" width="520" height="400" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="880" y="165" fill="#1D1D1F" font-size="22" font-weight="600" text-anchor="middle">Hardware View (GPU Execution)</text>

    <!-- SM -->
    <rect x="650" y="190" width="460" height="320" rx="8" fill="#E8FFE8" stroke="#34C759" stroke-width="2"/>
    <text x="880" y="220" fill="#1D1D1F" font-size="18" font-weight="600" text-anchor="middle">Streaming Multiprocessor (SM)</text>

    <!-- Warp Scheduler -->
    <rect x="670" y="240" width="420" height="60" rx="6" fill="#5E5CE6"/>
    <text x="880" y="265" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">Warp Scheduler</text>
    <text x="880" y="285" fill="#E0DFFF" font-size="12" text-anchor="middle">Picks ready warps for execution (hides latency)</text>

    <!-- Active Warps -->
    <g transform="translate(670, 320)">
      <rect x="0" y="0" width="200" height="170" rx="6" fill="#F5F5F7" stroke="#86868B"/>
      <text x="100" y="25" fill="#1D1D1F" font-size="14" font-weight="600" text-anchor="middle">Active Warps Pool</text>
      <text x="100" y="43" fill="#6E6E73" font-size="11" text-anchor="middle">(up to 32-64 warps/SM)</text>

      <rect x="10" y="55" width="180" height="28" rx="3" fill="#FF9500"/>
      <text x="100" y="73" fill="#FFFFFF" font-size="11" text-anchor="middle">Warp 0: Ready</text>

      <rect x="10" y="90" width="180" height="28" rx="3" fill="#E5E5EA"/>
      <text x="100" y="108" fill="#6E6E73" font-size="11" text-anchor="middle">Warp 1: Waiting (memory)</text>

      <rect x="10" y="125" width="180" height="28" rx="3" fill="#FF9500"/>
      <text x="100" y="143" fill="#FFFFFF" font-size="11" text-anchor="middle">Warp 2: Ready</text>

      <text x="100" y="163" fill="#6E6E73" font-size="10" text-anchor="middle">...</text>
    </g>

    <!-- CUDA Cores executing SIMT -->
    <g transform="translate(890, 320)">
      <rect x="0" y="0" width="200" height="170" rx="6" fill="#F5F5F7" stroke="#86868B"/>
      <text x="100" y="25" fill="#1D1D1F" font-size="14" font-weight="600" text-anchor="middle">CUDA Cores</text>
      <text x="100" y="43" fill="#6E6E73" font-size="11" text-anchor="middle">SIMT Execution</text>

      <!-- Visual representation of 32 threads -->
      <g transform="translate(10, 55)">
        <rect x="0" y="0" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="20" y="0" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="40" y="0" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="60" y="0" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="80" y="0" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="100" y="0" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="120" y="0" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="140" y="0" width="15" height="15" rx="2" fill="#34C759"/>

        <rect x="0" y="20" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="20" y="20" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="40" y="20" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="60" y="20" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="80" y="20" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="100" y="20" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="120" y="20" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="140" y="20" width="15" height="15" rx="2" fill="#34C759"/>

        <rect x="0" y="40" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="20" y="40" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="40" y="40" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="60" y="40" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="80" y="40" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="100" y="40" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="120" y="40" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="140" y="40" width="15" height="15" rx="2" fill="#34C759"/>

        <rect x="0" y="60" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="20" y="60" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="40" y="60" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="60" y="60" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="80" y="60" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="100" y="60" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="120" y="60" width="15" height="15" rx="2" fill="#34C759"/>
        <rect x="140" y="60" width="15" height="15" rx="2" fill="#34C759"/>

        <text x="90" y="93" fill="#6E6E73" font-size="10" text-anchor="middle">32 threads (1 warp)</text>
        <text x="90" y="107" fill="#6E6E73" font-size="10" text-anchor="middle">Same instruction</text>
      </g>
    </g>

    <!-- SIMT Explanation -->
    <rect x="60" y="560" width="1080" height="200" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="600" y="595" fill="#1D1D1F" font-size="22" font-weight="600" text-anchor="middle">SIMT: Single Instruction, Multiple Threads</text>

    <g transform="translate(100, 620)">
      <!-- Same Instruction -->
      <rect x="0" y="0" width="300" height="120" rx="6" fill="#E8F2FF" stroke="#0071E3"/>
      <text x="150" y="30" fill="#1D1D1F" font-size="16" font-weight="600" text-anchor="middle">Same Instruction</text>
      <text x="20" y="55" fill="#1D1D1F" font-size="13" font-family="Monaco, monospace">float result = a * b + c;</text>

      <text x="150" y="80" fill="#6E6E73" font-size="12" text-anchor="middle">All 32 threads in a warp</text>
      <text x="150" y="98" fill="#6E6E73" font-size="12" text-anchor="middle">execute this at the same time</text>
    </g>

    <text x="360" y="690" fill="#1D1D1F" font-size="24" font-weight="600">→</text>

    <g transform="translate(420, 620)">
      <!-- Different Data -->
      <rect x="0" y="0" width="300" height="120" rx="6" fill="#FFF3E0" stroke="#FF9500"/>
      <text x="150" y="30" fill="#1D1D1F" font-size="16" font-weight="600" text-anchor="middle">Different Data</text>

      <text x="20" y="55" fill="#1D1D1F" font-size="11">Thread 0: a=1.0, b=2.0, c=3.0</text>
      <text x="20" y="73" fill="#1D1D1F" font-size="11">Thread 1: a=4.0, b=5.0, c=6.0</text>
      <text x="20" y="91" fill="#6E6E73" font-size="11">...</text>
      <text x="20" y="109" fill="#1D1D1F" font-size="11">Thread 31: a=X, b=Y, c=Z</text>
    </g>

    <text x="780" y="690" fill="#1D1D1F" font-size="24" font-weight="600">→</text>

    <g transform="translate(840, 620)">
      <!-- Parallel Execution -->
      <rect x="0" y="0" width="300" height="120" rx="6" fill="#E8FFE8" stroke="#34C759"/>
      <text x="150" y="30" fill="#1D1D1F" font-size="16" font-weight="600" text-anchor="middle">Parallel Results</text>

      <text x="20" y="55" fill="#1D1D1F" font-size="11">Thread 0: result = 5.0</text>
      <text x="20" y="73" fill="#1D1D1F" font-size="11">Thread 1: result = 26.0</text>
      <text x="20" y="91" fill="#6E6E73" font-size="11">...</text>
      <text x="20" y="109" fill="#1D1D1F" font-size="11">Thread 31: result = ...</text>

      <text x="150" y="125" fill="#34C759" font-size="11" font-weight="600" text-anchor="middle">All computed simultaneously</text>
    </g>

    <!-- Key Concepts -->
    <rect x="60" y="790" width="520" height="180" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="320" y="825" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="middle">Key Concepts</text>

    <g transform="translate(80, 845)">
      <circle cx="8" cy="8" r="6" fill="#0071E3"/>
      <text x="25" y="13" fill="#1D1D1F" font-size="13" font-weight="600">Thread</text>
      <text x="25" y="30" fill="#6E6E73" font-size="12">Smallest unit of execution. Each has its own registers.</text>

      <circle cx="8" cy="53" r="6" fill="#FF9500"/>
      <text x="25" y="58" fill="#1D1D1F" font-size="13" font-weight="600">Warp</text>
      <text x="25" y="75" fill="#6E6E73" font-size="12">32 threads that execute in lockstep (SIMT). Hardware scheduling unit.</text>

      <circle cx="8" cy="98" r="6" fill="#FF9500"/>
      <text x="25" y="103" fill="#1D1D1F" font-size="13" font-weight="600">Thread Block</text>
      <text x="25" y="120" fill="#6E6E73" font-size="12">Group of threads (e.g., 256). Divided into warps. Scheduled to one SM.</text>

      <circle cx="8" cy="143" r="6" fill="#34C759"/>
      <text x="25" y="148" fill="#1D1D1F" font-size="13" font-weight="600">SM (Streaming Multiprocessor)</text>
      <text x="25" y="165" fill="#6E6E73" font-size="12">Physical execution unit. Executes multiple warps concurrently.</text>
    </g>

    <!-- Performance Implications -->
    <rect x="620" y="790" width="520" height="180" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="880" y="825" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="middle">Performance Implications</text>

    <g transform="translate(640, 845)">
      <circle cx="8" cy="8" r="6" fill="#34C759"/>
      <text x="25" y="13" fill="#1D1D1F" font-size="13" font-weight="600">Warp Divergence</text>
      <text x="25" y="30" fill="#6E6E73" font-size="12">If threads in a warp take different branches (if/else), both paths execute serially.</text>

      <circle cx="8" cy="53" r="6" fill="#34C759"/>
      <text x="25" y="58" fill="#1D1D1F" font-size="13" font-weight="600">Occupancy</text>
      <text x="25" y="75" fill="#6E6E73" font-size="12">More active warps per SM hide latency better. Balance registers/shared memory.</text>

      <circle cx="8" cy="98" r="6" fill="#34C759"/>
      <text x="25" y="103" fill="#1D1D1F" font-size="13" font-weight="600">Coalesced Access</text>
      <text x="25" y="120" fill="#6E6E73" font-size="12">Threads in a warp should access consecutive memory for best bandwidth.</text>

      <circle cx="8" cy="143" r="6" fill="#34C759"/>
      <text x="25" y="148" fill="#1D1D1F" font-size="13" font-weight="600">Block Size</text>
      <text x="25" y="165" fill="#6E6E73" font-size="12">Use multiples of 32 (warp size). Common: 128, 256, 512 threads/block.</text>
    </g>
  </g>
</svg>