<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc" content="&lt;mxfile host=&quot;app.diagrams.net&quot; modified=&quot;2026-09-16T00:00:00.000Z&quot; agent=&quot;GitHub Copilot&quot; version=&quot;24.7.17&quot; type=&quot;device&quot; compressed=&quot;false&quot;&gt;&lt;diagram id=&quot;topology-scheduling&quot; name=&quot;Page-1&quot;&gt;&lt;mxGraphModel dx=&quot;1200&quot; dy=&quot;740&quot; grid=&quot;1&quot; gridSize=&quot;10&quot; page=&quot;1&quot; pageWidth=&quot;1200&quot; pageHeight=&quot;740&quot;&gt;&lt;root&gt;&lt;mxCell id=&quot;0&quot;/&gt;&lt;mxCell id=&quot;1&quot; parent=&quot;0&quot;/&gt;&lt;mxCell id=&quot;2&quot; value=&quot;Topology-Aware GPU Scheduling&quot; style=&quot;text;html=1;fontFamily=Helvetica;fontSize=30;fontStyle=1;fontColor=#1D1D1F;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;50&quot; y=&quot;25&quot; width=&quot;700&quot; height=&quot;45&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;3&quot; value=&quot;WORKLOAD INTENT&quot; style=&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fontFamily=Helvetica;fillColor=#1D1D1F;strokeColor=none;fontColor=#FFFFFF;fontSize=20;fontStyle=1;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;60&quot; y=&quot;130&quot; width=&quot;230&quot; height=&quot;460&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;4&quot; value=&quot;1  GPU FABRIC — Keep TP ranks in one NVLink domain&quot; style=&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fontFamily=Helvetica;fillColor=#FFFFFF;strokeColor=#0071E3;fontSize=18;fontStyle=1;fontColor=#1D1D1F;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;380&quot; y=&quot;125&quot; width=&quot;420&quot; height=&quot;135&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;5&quot; value=&quot;2  NUMA LOCALITY — Align CPU, memory, GPU and NIC&quot; style=&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fontFamily=Helvetica;fillColor=#FFFFFF;strokeColor=#D2D2D7;fontSize=18;fontStyle=1;fontColor=#1D1D1F;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;380&quot; y=&quot;285&quot; width=&quot;420&quot; height=&quot;135&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;6&quot; value=&quot;3  NODE &amp;amp; NETWORK — Keep TP local; map DP to RDMA&quot; style=&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fontFamily=Helvetica;fillColor=#FFFFFF;strokeColor=#D2D2D7;fontSize=18;fontStyle=1;fontColor=#1D1D1F;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;380&quot; y=&quot;445&quot; width=&quot;420&quot; height=&quot;135&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=&quot;7&quot; value=&quot;PLACEMENT&quot; style=&quot;rounded=1;arcSize=8;whiteSpace=wrap;html=1;fontFamily=Helvetica;fillColor=#FFFFFF;strokeColor=#D2D2D7;fontSize=20;fontStyle=1;fontColor=#1D1D1F;&quot; vertex=&quot;1&quot; parent=&quot;1&quot;&gt;&lt;mxGeometry x=&quot;890&quot; y=&quot;130&quot; width=&quot;250&quot; height=&quot;460&quot; as=&quot;geometry&quot;/&gt;&lt;/mxCell&gt;&lt;/root&gt;&lt;/mxGraphModel&gt;&lt;/diagram&gt;&lt;/mxfile&gt;">
  <title id="title">Topology-aware GPU scheduling</title>
  <desc id="desc">A scheduler maps workload intent through GPU fabric, NUMA locality, and node and network constraints to produce a performant placement.</desc>
  <rect width="1200" height="740" fill="#F5F5F7"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <text x="50" y="58" fill="#1D1D1F" font-size="32" font-weight="600">Topology-Aware GPU Scheduling</text>
    <text x="50" y="88" fill="#6E6E73" font-size="16">Enough GPUs is only the first constraint</text>

    <rect x="60" y="130" width="230" height="460" rx="12" fill="#1D1D1F"/>
    <text x="175" y="177" fill="#FFFFFF" font-size="19" font-weight="600" text-anchor="middle">WORKLOAD INTENT</text>
    <line x1="88" y1="200" x2="262" y2="200" stroke="#424245"/>
    <rect x="88" y="232" width="174" height="70" rx="10" fill="#2C2C2E" stroke="#48484A"/>
    <text x="175" y="260" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">TP = 4</text>
    <text x="175" y="283" fill="#AEAEB2" font-size="13" text-anchor="middle">frequent GPU collectives</text>
    <rect x="88" y="323" width="174" height="70" rx="10" fill="#2C2C2E" stroke="#48484A"/>
    <text x="175" y="351" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">DP = 2</text>
    <text x="175" y="374" fill="#AEAEB2" font-size="13" text-anchor="middle">cross-node gradients</text>
    <rect x="88" y="414" width="174" height="70" rx="10" fill="#2C2C2E" stroke="#48484A"/>
    <text x="175" y="442" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">CPU + NIC</text>
    <text x="175" y="465" fill="#AEAEB2" font-size="13" text-anchor="middle">data and RDMA locality</text>
    <text x="175" y="536" fill="#64A8F0" font-size="15" font-weight="600" text-anchor="middle">Gang: all ranks or none</text>

    <path d="M305 360 H350" stroke="#86868B" stroke-width="2"/>
    <polygon points="362,360 348,351 348,369" fill="#86868B"/>

    <rect x="380" y="125" width="420" height="135" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <circle cx="425" cy="169" r="23" fill="#0071E3"/>
    <text x="425" y="176" fill="#FFFFFF" font-size="19" font-weight="600" text-anchor="middle">1</text>
    <text x="465" y="164" fill="#1D1D1F" font-size="20" font-weight="600">GPU FABRIC</text>
    <text x="465" y="190" fill="#6E6E73" font-size="14">Strong constraint for tensor parallelism</text>
    <text x="410" y="229" fill="#1D1D1F" font-size="16" font-weight="600">Keep TP ranks in one NVLink / NVSwitch domain</text>

    <rect x="380" y="285" width="420" height="135" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <circle cx="425" cy="329" r="23" fill="#0071E3"/>
    <text x="425" y="336" fill="#FFFFFF" font-size="19" font-weight="600" text-anchor="middle">2</text>
    <text x="465" y="324" fill="#1D1D1F" font-size="20" font-weight="600">NUMA LOCALITY</text>
    <text x="465" y="350" fill="#6E6E73" font-size="14">Usually a scoring preference</text>
    <text x="410" y="389" fill="#1D1D1F" font-size="16" font-weight="600">Align CPU, memory, GPU and the closest NIC</text>

    <rect x="380" y="445" width="420" height="135" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <circle cx="425" cy="489" r="23" fill="#0071E3"/>
    <text x="425" y="496" fill="#FFFFFF" font-size="19" font-weight="600" text-anchor="middle">3</text>
    <text x="465" y="484" fill="#1D1D1F" font-size="20" font-weight="600">NODE &amp; NETWORK</text>
    <text x="465" y="510" fill="#6E6E73" font-size="14">Map parallel groups to physical links</text>
    <text x="410" y="549" fill="#1D1D1F" font-size="16" font-weight="600">Keep TP local; place DP traffic on RDMA</text>

    <path d="M825 360 H870" stroke="#86868B" stroke-width="2"/>
    <polygon points="882,360 868,351 868,369" fill="#86868B"/>

    <rect x="890" y="130" width="250" height="460" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="1015" y="177" fill="#1D1D1F" font-size="19" font-weight="600" text-anchor="middle">PLACEMENT</text>
    <line x1="918" y1="200" x2="1112" y2="200" stroke="#E5E5EA"/>
    <rect x="920" y="230" width="190" height="135" rx="10" fill="#F5F5F7" stroke="#E5E5EA"/>
    <text x="1015" y="259" fill="#1D1D1F" font-size="15" font-weight="600" text-anchor="middle">NODE A • NVSwitch 0</text>
    <g fill="#0071E3">
      <rect x="940" y="282" width="34" height="34" rx="4"/><rect x="981" y="282" width="34" height="34" rx="4"/>
      <rect x="1022" y="282" width="34" height="34" rx="4"/><rect x="1063" y="282" width="34" height="34" rx="4"/>
    </g>
    <text x="1015" y="340" fill="#6E6E73" font-size="12" text-anchor="middle">TP group: local</text>
    <text x="1015" y="356" fill="#6E6E73" font-size="12" text-anchor="middle">high-speed fabric</text>
    <rect x="920" y="392" width="190" height="115" rx="10" fill="#F5F5F7" stroke="#E5E5EA"/>
    <text x="1015" y="423" fill="#1D1D1F" font-size="15" font-weight="600" text-anchor="middle">NODE B • NVSwitch 0</text>
    <g fill="#0071E3">
      <rect x="940" y="443" width="34" height="34" rx="4"/><rect x="981" y="443" width="34" height="34" rx="4"/>
      <rect x="1022" y="443" width="34" height="34" rx="4"/><rect x="1063" y="443" width="34" height="34" rx="4"/>
    </g>
    <path d="M1015 365 V392" stroke="#0071E3" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="1080" y="382" fill="#0071E3" font-size="12" font-weight="600">RDMA / DP</text>
    <rect x="925" y="530" width="180" height="35" rx="9" fill="#E8F2FF" stroke="#B8D8FA"/>
    <text x="1015" y="553" fill="#0071E3" font-size="13" font-weight="600" text-anchor="middle">FAST AND SCHEDULABLE</text>

    <rect x="150" y="635" width="900" height="55" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="600" y="669" fill="#1D1D1F" font-size="17" font-weight="600" text-anchor="middle">A successful placement can still be a slow placement. Benchmark the assigned GPU set.</text>
  </g>
</svg>