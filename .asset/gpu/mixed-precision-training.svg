<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">Mixed Precision Training Workflow</title>
  <desc id="desc">Complete workflow of mixed precision training using Tensor Cores with FP16 and FP32</desc>
  <rect width="1200" height="920" fill="#F5F5F7"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <text x="50" y="58" fill="#1D1D1F" font-size="32" font-weight="600">Mixed Precision Training Workflow</text>
    <text x="50" y="88" fill="#6E6E73" font-size="16">FP16 computation with FP32 accumulation for speed and stability</text>

    <!-- Left side: Training flow -->
    <!-- Step 0: Initial Weights -->
    <rect x="80" y="130" width="300" height="90" rx="8" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="230" y="158" fill="#1D1D1F" font-size="17" font-weight="600" text-anchor="middle">Step 0: Weight Preparation</text>
    <rect x="100" y="173" width="260" height="38" rx="4" fill="#0071E3"/>
    <text x="230" y="197" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">FP32 Master Weights</text>

    <path d="M 230 230 L 230 260" stroke="#1D1D1F" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <text x="250" y="250" fill="#6E6E73" font-size="11">Copy &amp; Convert</text>

    <!-- Step 1: Convert to FP16 -->
    <rect x="80" y="270" width="300" height="90" rx="8" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="230" y="298" fill="#1D1D1F" font-size="17" font-weight="600" text-anchor="middle">Step 1: FP16 Conversion</text>
    <rect x="100" y="313" width="260" height="38" rx="4" fill="#FF9500"/>
    <text x="230" y="337" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">FP16 Weights (for forward)</text>

    <path d="M 230 370 L 230 400" stroke="#1D1D1F" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

    <!-- Step 2: Forward Pass -->
    <rect x="80" y="410" width="300" height="110" rx="8" fill="#E8F2FF" stroke="#0071E3" stroke-width="2"/>
    <text x="230" y="438" fill="#1D1D1F" font-size="17" font-weight="600" text-anchor="middle">Step 2: Forward Propagation</text>

    <rect x="100" y="453" width="260" height="28" rx="4" fill="#FF9500"/>
    <text x="230" y="472" fill="#FFFFFF" font-size="13" text-anchor="middle">FP16 Activations &amp; Weights</text>

    <text x="230" y="498" fill="#1D1D1F" font-size="12">↓ Tensor Core accelerated</text>

    <rect x="160" y="505" width="140" height="20" rx="4" fill="#FF9500"/>
    <text x="230" y="519" fill="#FFFFFF" font-size="11" text-anchor="middle">FP16 Loss</text>

    <!-- Arrow right -->
    <path d="M 390 470 L 450 470" stroke="#1D1D1F" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

    <!-- Step 3: Loss Scaling -->
    <rect x="460" y="410" width="300" height="110" rx="8" fill="#FFF3E0" stroke="#FF9500" stroke-width="2"/>
    <text x="610" y="438" fill="#1D1D1F" font-size="17" font-weight="600" text-anchor="middle">Step 3: Loss Scaling</text>

    <rect x="480" y="453" width="260" height="23" rx="4" fill="#FF9500"/>
    <text x="610" y="470" fill="#FFFFFF" font-size="13" text-anchor="middle">FP16 Loss</text>

    <text x="610" y="493" fill="#1D1D1F" font-size="18" font-weight="600">× Scale (e.g., 1024)</text>

    <rect x="480" y="503" width="260" height="20" rx="4" fill="#FF3B30"/>
    <text x="610" y="517" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle">Scaled FP16 Loss</text>

    <path d="M 610 530 L 610 560" stroke="#1D1D1F" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

    <!-- Step 4: Backward Pass -->
    <rect x="460" y="570" width="300" height="110" rx="8" fill="#E8F2FF" stroke="#0071E3" stroke-width="2"/>
    <text x="610" y="598" fill="#1D1D1F" font-size="17" font-weight="600" text-anchor="middle">Step 4: Backward Propagation</text>

    <rect x="480" y="613" width="260" height="23" rx="4" fill="#FF3B30"/>
    <text x="610" y="630" fill="#FFFFFF" font-size="13" text-anchor="middle">Scaled FP16 Loss</text>

    <text x="610" y="653" fill="#1D1D1F" font-size="12">↓ Backprop</text>

    <rect x="480" y="660" width="260" height="23" rx="4" fill="#FF3B30"/>
    <text x="610" y="677" fill="#FFFFFF" font-size="12" text-anchor="middle">Scaled FP16 Gradients</text>

    <!-- Arrow left -->
    <path d="M 450 625 L 390 625" stroke="#1D1D1F" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

    <!-- Step 5: Gradient Unscaling -->
    <rect x="80" y="570" width="300" height="110" rx="8" fill="#FFF3E0" stroke="#FF9500" stroke-width="2"/>
    <text x="230" y="598" fill="#1D1D1F" font-size="17" font-weight="600" text-anchor="middle">Step 5: Gradient Unscaling</text>

    <rect x="100" y="613" width="260" height="23" rx="4" fill="#FF3B30"/>
    <text x="230" y="630" fill="#FFFFFF" font-size="13" text-anchor="middle">Scaled FP16 Gradients</text>

    <text x="230" y="653" fill="#1D1D1F" font-size="12">↓ Convert to FP32 &amp; ÷ Scale</text>

    <rect x="100" y="660" width="260" height="23" rx="4" fill="#0071E3"/>
    <text x="230" y="677" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">FP32 Gradients (actual)</text>

    <path d="M 230 690 L 230 720" stroke="#1D1D1F" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

    <!-- Step 6: Weight Update -->
    <rect x="80" y="730" width="300" height="90" rx="8" fill="#E8FFE8" stroke="#34C759" stroke-width="2"/>
    <text x="230" y="758" fill="#1D1D1F" font-size="17" font-weight="600" text-anchor="middle">Step 6: Parameter Update</text>

    <text x="230" y="780" fill="#1D1D1F" font-size="12">FP32 Weights -= lr × FP32 Gradients</text>

    <rect x="100" y="793" width="260" height="23" rx="4" fill="#34C759"/>
    <text x="230" y="810" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">Updated FP32 Master Weights</text>

    <!-- Arrow back to top (cycle) -->
    <path d="M 80 775 L 40 775 L 40 175 L 70 175" stroke="#34C759" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead-green)"/>
    <text x="25" y="480" fill="#34C759" font-size="12" font-weight="600" transform="rotate(-90, 25, 480)">Next Iteration</text>

    <!-- Right side: Benefits and Details -->
    <rect x="800" y="130" width="360" height="350" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="980" y="165" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="middle">Why Mixed Precision?</text>

    <!-- Benefits -->
    <g transform="translate(820, 190)">
      <circle cx="8" cy="8" r="6" fill="#34C759"/>
      <text x="25" y="13" fill="#1D1D1F" font-size="14" font-weight="600">Speed Boost</text>
      <text x="25" y="30" fill="#6E6E73" font-size="12">• Tensor Core acceleration (8-20×)</text>
      <text x="25" y="45" fill="#6E6E73" font-size="12">• FP16 uses 2× less memory bandwidth</text>
      <text x="25" y="60" fill="#6E6E73" font-size="12">• Can fit larger batch sizes</text>

      <circle cx="8" cy="88" r="6" fill="#0071E3"/>
      <text x="25" y="93" fill="#1D1D1F" font-size="14" font-weight="600">Precision Maintained</text>
      <text x="25" y="110" fill="#6E6E73" font-size="12">• FP32 accumulation prevents errors</text>
      <text x="25" y="125" fill="#6E6E73" font-size="12">• Master weights in FP32</text>
      <text x="25" y="140" fill="#6E6E73" font-size="12">• Loss scaling prevents underflow</text>

      <circle cx="8" cy="168" r="6" fill="#FF9500"/>
      <text x="25" y="173" fill="#1D1D1F" font-size="14" font-weight="600">Memory Efficiency</text>
      <text x="25" y="190" fill="#6E6E73" font-size="12">• FP16 tensors: 50% memory savings</text>
      <text x="25" y="205" fill="#6E6E73" font-size="12">• Train larger models on same GPU</text>
      <text x="25" y="220" fill="#6E6E73" font-size="12">• 2-4× larger batch sizes possible</text>

      <circle cx="8" cy="248" r="6" fill="#5E5CE6"/>
      <text x="25" y="253" fill="#1D1D1F" font-size="14" font-weight="600">Automatic in Frameworks</text>
      <text x="25" y="270" fill="#6E6E73" font-size="12">• PyTorch: torch.cuda.amp</text>
      <text x="25" y="285" fill="#6E6E73" font-size="12">• TensorFlow: mixed_precision policy</text>
      <text x="25" y="300" fill="#6E6E73" font-size="12">• Framework handles conversions</text>
    </g>

    <!-- Precision Comparison -->
    <rect x="800" y="500" width="360" height="180" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="980" y="535" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="middle">Precision Comparison</text>

    <g transform="translate(820, 560)">
      <rect x="0" y="0" width="320" height="32" rx="4" fill="#0071E3"/>
      <text x="10" y="21" fill="#FFFFFF" font-size="13" font-weight="600">FP32 (Full Precision)</text>
      <text x="240" y="21" fill="#CCE5FF" font-size="12">32 bits, slower</text>

      <rect x="0" y="40" width="160" height="32" rx="4" fill="#FF9500"/>
      <text x="10" y="61" fill="#FFFFFF" font-size="13" font-weight="600">FP16 (Half)</text>
      <text x="95" y="61" fill="#FFE5CC" font-size="11">16 bits, 2× faster</text>

      <rect x="0" y="80" width="320" height="32" rx="4" fill="#34C759"/>
      <text x="10" y="101" fill="#FFFFFF" font-size="13" font-weight="600">Mixed: FP16 compute + FP32 accumulate</text>

      <text x="160" y="138" fill="#6E6E73" font-size="11" text-anchor="middle">Best of both worlds!</text>
    </g>

    <!-- Code Example -->
    <rect x="800" y="700" width="360" height="190" rx="12" fill="#1D1D1F" stroke="#86868B"/>
    <text x="980" y="730" fill="#FFFFFF" font-size="18" font-weight="600" text-anchor="middle">PyTorch Example</text>

    <text x="820" y="755" fill="#34C759" font-size="11" font-family="Monaco, monospace"># Enable automatic mixed precision</text>
    <text x="820" y="773" fill="#FF9500" font-size="11" font-family="Monaco, monospace">scaler</text>
    <text x="865" y="773" fill="#FFFFFF" font-size="11" font-family="Monaco, monospace">= torch.cuda.amp.GradScaler()</text>

    <text x="820" y="795" fill="#5E5CE6" font-size="11" font-family="Monaco, monospace">with</text>
    <text x="850" y="795" fill="#FFFFFF" font-size="11" font-family="Monaco, monospace">torch.cuda.amp.autocast():</text>

    <text x="835" y="813" fill="#FFFFFF" font-size="11" font-family="Monaco, monospace">output = model(input)</text>
    <text x="835" y="831" fill="#FFFFFF" font-size="11" font-family="Monaco, monospace">loss = criterion(output, target)</text>

    <text x="820" y="853" fill="#FF9500" font-size="11" font-family="Monaco, monospace">scaler</text>
    <text x="865" y="853" fill="#FFFFFF" font-size="11" font-family="Monaco, monospace">.scale(loss).backward()</text>
    <text x="820" y="871" fill="#FF9500" font-size="11" font-family="Monaco, monospace">scaler</text>
    <text x="865" y="871" fill="#FFFFFF" font-size="11" font-family="Monaco, monospace">.step(optimizer)</text>

    <!-- Arrow marker definitions -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#1D1D1F"/>
      </marker>
      <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#34C759"/>
      </marker>
    </defs>
  </g>
</svg>