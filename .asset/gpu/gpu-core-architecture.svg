<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">GPU Core Architecture</title>
  <desc id="desc">Overview of GPU architecture showing CUDA Cores, Tensor Cores, and their organization within Streaming Multiprocessors</desc>
  <rect width="1200" height="850" fill="#F5F5F7"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <text x="50" y="58" fill="#1D1D1F" font-size="32" font-weight="600">GPU Core Architecture</text>
    <text x="50" y="88" fill="#6E6E73" font-size="16">CUDA Core, Tensor Core &amp; Memory Hierarchy</text>

    <!-- Full GPU -->
    <rect x="60" y="130" width="720" height="680" rx="12" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="3"/>
    <text x="420" y="165" fill="#1D1D1F" font-size="24" font-weight="600" text-anchor="middle">GPU (e.g., H100)</text>

    <!-- SM 1 (detailed) -->
    <rect x="90" y="190" width="300" height="460" rx="8" fill="#E8F2FF" stroke="#0071E3" stroke-width="2"/>
    <text x="240" y="220" fill="#1D1D1F" font-size="18" font-weight="600" text-anchor="middle">SM (Streaming Multiprocessor)</text>

    <!-- CUDA Cores in SM -->
    <rect x="110" y="240" width="260" height="130" rx="6" fill="#FFFFFF" stroke="#34C759" stroke-width="2"/>
    <text x="240" y="265" fill="#1D1D1F" font-size="16" font-weight="600" text-anchor="middle">CUDA Cores</text>

    <!-- Grid of CUDA cores -->
    <g transform="translate(130, 280)">
      <rect x="0" y="0" width="28" height="28" rx="3" fill="#34C759"/>
      <rect x="36" y="0" width="28" height="28" rx="3" fill="#34C759"/>
      <rect x="72" y="0" width="28" height="28" rx="3" fill="#34C759"/>
      <rect x="108" y="0" width="28" height="28" rx="3" fill="#34C759"/>
      <rect x="144" y="0" width="28" height="28" rx="3" fill="#34C759"/>
      <rect x="180" y="0" width="28" height="28" rx="3" fill="#34C759"/>

      <rect x="0" y="36" width="28" height="28" rx="3" fill="#34C759"/>
      <rect x="36" y="36" width="28" height="28" rx="3" fill="#34C759"/>
      <rect x="72" y="36" width="28" height="28" rx="3" fill="#34C759"/>
      <rect x="108" y="36" width="28" height="28" rx="3" fill="#34C759"/>
      <rect x="144" y="36" width="28" height="28" rx="3" fill="#34C759"/>
      <rect x="180" y="36" width="28" height="28" rx="3" fill="#34C759"/>

      <text x="104" y="85" fill="#6E6E73" font-size="11" text-anchor="middle">×128 (typical)</text>
    </g>

    <!-- Tensor Cores in SM -->
    <rect x="110" y="385" width="260" height="110" rx="6" fill="#FFFFFF" stroke="#FF9500" stroke-width="2"/>
    <text x="240" y="410" fill="#1D1D1F" font-size="16" font-weight="600" text-anchor="middle">Tensor Cores</text>

    <g transform="translate(130, 430)">
      <rect x="0" y="0" width="48" height="38" rx="4" fill="#FF9500"/>
      <text x="24" y="24" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">TC</text>

      <rect x="56" y="0" width="48" height="38" rx="4" fill="#FF9500"/>
      <text x="80" y="24" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">TC</text>

      <rect x="112" y="0" width="48" height="38" rx="4" fill="#FF9500"/>
      <text x="136" y="24" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">TC</text>

      <rect x="168" y="0" width="48" height="38" rx="4" fill="#FF9500"/>
      <text x="192" y="24" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">TC</text>

      <text x="108" y="58" fill="#6E6E73" font-size="11" text-anchor="middle">×4 per SM (Hopper)</text>
    </g>

    <!-- Shared Memory & Cache -->
    <rect x="110" y="510" width="260" height="120" rx="6" fill="#FFFFFF" stroke="#5E5CE6" stroke-width="2"/>
    <text x="240" y="540" fill="#1D1D1F" font-size="14" font-weight="600" text-anchor="middle">Shared Memory</text>
    <text x="240" y="560" fill="#6E6E73" font-size="12" text-anchor="middle">228 KB (configurable)</text>
    <text x="240" y="590" fill="#1D1D1F" font-size="14" font-weight="600" text-anchor="middle">L1 Cache / Texture Cache</text>
    <text x="240" y="610" fill="#6E6E73" font-size="12" text-anchor="middle">Low latency access</text>

    <!-- SM 2 & 3 (simplified) -->
    <rect x="420" y="190" width="130" height="460" rx="8" fill="#E8F2FF" stroke="#0071E3" stroke-width="2"/>
    <text x="485" y="220" fill="#1D1D1F" font-size="16" font-weight="600" text-anchor="middle">SM</text>
    <text x="485" y="420" fill="#6E6E73" font-size="14" text-anchor="middle">...</text>

    <rect x="580" y="190" width="130" height="460" rx="8" fill="#E8F2FF" stroke="#0071E3" stroke-width="2"/>
    <text x="645" y="220" fill="#1D1D1F" font-size="16" font-weight="600" text-anchor="middle">SM</text>
    <text x="645" y="420" fill="#6E6E73" font-size="14" text-anchor="middle">...</text>

    <text x="730" y="420" fill="#6E6E73" font-size="18" font-weight="600">×132 SMs</text>

    <!-- L2 Cache -->
    <rect x="90" y="670" width="620" height="60" rx="6" fill="#5E5CE6"/>
    <text x="400" y="695" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">L2 Cache</text>
    <text x="400" y="715" fill="#E0DFFF" font-size="13" text-anchor="middle">50 MB (H100) - Shared across all SMs</text>

    <!-- HBM Memory -->
    <rect x="90" y="750" width="620" height="50" rx="6" fill="#1D1D1F"/>
    <text x="400" y="780" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">HBM3 Memory: 80GB @ 3 TB/s</text>

    <!-- Core Types Legend -->
    <rect x="820" y="130" width="330" height="390" rx="8" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="985" y="165" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="middle">Core Types</text>

    <!-- CUDA Core detail -->
    <rect x="840" y="190" width="290" height="90" rx="6" fill="#F5F5F7" stroke="#34C759" stroke-width="2"/>
    <rect x="855" y="205" width="45" height="45" rx="4" fill="#34C759"/>
    <text x="877" y="233" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">CC</text>
    <text x="920" y="218" fill="#1D1D1F" font-size="15" font-weight="600">CUDA Core</text>
    <text x="920" y="240" fill="#6E6E73" font-size="12">• Scalar operations</text>
    <text x="920" y="257" fill="#6E6E73" font-size="12">• FP32, INT32</text>
    <text x="920" y="274" fill="#6E6E73" font-size="12">• General compute</text>

    <!-- Tensor Core detail -->
    <rect x="840" y="295" width="290" height="90" rx="6" fill="#F5F5F7" stroke="#FF9500" stroke-width="2"/>
    <rect x="855" y="310" width="45" height="45" rx="4" fill="#FF9500"/>
    <text x="877" y="338" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">TC</text>
    <text x="920" y="323" fill="#1D1D1F" font-size="15" font-weight="600">Tensor Core</text>
    <text x="920" y="345" fill="#6E6E73" font-size="12">• Matrix ops (4×4×4)</text>
    <text x="920" y="362" fill="#6E6E73" font-size="12">• FP16, TF32, FP8</text>
    <text x="920" y="379" fill="#6E6E73" font-size="12">• Deep learning</text>

    <!-- RT Core (optional) -->
    <rect x="840" y="400" width="290" height="90" rx="6" fill="#F5F5F7" stroke="#5E5CE6" stroke-width="2"/>
    <rect x="855" y="415" width="45" height="45" rx="4" fill="#5E5CE6"/>
    <text x="877" y="443" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">RT</text>
    <text x="920" y="428" fill="#1D1D1F" font-size="15" font-weight="600">RT Core</text>
    <text x="920" y="450" fill="#6E6E73" font-size="12">• Ray tracing</text>
    <text x="920" y="467" fill="#6E6E73" font-size="12">• Graphics workloads</text>
    <text x="920" y="484" fill="#6E6E73" font-size="12">• Turing+</text>

    <!-- Memory Hierarchy -->
    <rect x="820" y="540" width="330" height="270" rx="8" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="985" y="575" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="middle">Memory Hierarchy</text>

    <g transform="translate(850, 605)">
      <text x="0" y="0" fill="#1D1D1F" font-size="14" font-weight="600">Registers</text>
      <text x="210" y="0" fill="#6E6E73" font-size="13">~1 cycle</text>

      <text x="0" y="30" fill="#1D1D1F" font-size="14" font-weight="600">Shared Memory</text>
      <text x="210" y="30" fill="#6E6E73" font-size="13">~20 cycles</text>

      <text x="0" y="60" fill="#1D1D1F" font-size="14" font-weight="600">L1 Cache</text>
      <text x="210" y="60" fill="#6E6E73" font-size="13">~30 cycles</text>

      <text x="0" y="90" fill="#1D1D1F" font-size="14" font-weight="600">L2 Cache</text>
      <text x="210" y="90" fill="#6E6E73" font-size="13">~200 cycles</text>

      <text x="0" y="120" fill="#1D1D1F" font-size="14" font-weight="600">HBM (Global)</text>
      <text x="210" y="120" fill="#6E6E73" font-size="13">~400 cycles</text>

      <line x1="0" y1="15" x2="270" y2="15" stroke="#E5E5EA" stroke-width="1"/>
      <line x1="0" y1="45" x2="270" y2="45" stroke="#E5E5EA" stroke-width="1"/>
      <line x1="0" y1="75" x2="270" y2="75" stroke="#E5E5EA" stroke-width="1"/>
      <line x1="0" y1="105" x2="270" y2="105" stroke="#E5E5EA" stroke-width="1"/>

      <text x="135" y="160" fill="#6E6E73" font-size="11" text-anchor="middle" font-style="italic">Optimize for locality to reduce latency</text>
    </g>
  </g>
</svg>