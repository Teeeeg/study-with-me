<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">GPU sharing methods comparison</title>
  <desc id="desc">Four GPU sharing approaches: Time-Slicing, MPS, MIG, and vGPU with their isolation and resource allocation characteristics.</desc>
  <rect width="1200" height="850" fill="#F5F5F7"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <text x="50" y="58" fill="#1D1D1F" font-size="32" font-weight="600">GPU Sharing Methods</text>
    <text x="50" y="88" fill="#6E6E73" font-size="16">From software time-sharing to hardware partitioning</text>

    <!-- Time-Slicing -->
    <rect x="60" y="130" width="250" height="300" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="185" y="165" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="middle">Time-Slicing</text>
    <text x="185" y="188" fill="#6E6E73" font-size="14" text-anchor="middle">Driver-level context switching</text>

    <rect x="85" y="210" width="200" height="150" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
    <text x="185" y="232" fill="#1D1D1F" font-size="15" font-weight="600" text-anchor="middle">Physical GPU</text>

    <rect x="100" y="250" width="170" height="32" rx="6" fill="#FF9500"/>
    <text x="185" y="272" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">Process A</text>

    <rect x="100" y="290" width="170" height="32" rx="6" fill="#0071E3"/>
    <text x="185" y="312" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">Process B</text>

    <rect x="100" y="330" width="170" height="18" rx="4" fill="#34C759"/>
    <text x="185" y="343" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle">Process C</text>

    <text x="185" y="383" fill="#86868B" font-size="12" text-anchor="middle">⟳ Context Switch</text>

    <rect x="85" y="395" width="200" height="2" fill="#E5E5EA"/>
    <text x="95" y="413" fill="#0071E3" font-size="11" font-weight="600">✓ Simple setup</text>
    <text x="95" y="425" fill="#FF3B30" font-size="11" font-weight="600">✗ No isolation</text>

    <!-- MPS -->
    <rect x="340" y="130" width="250" height="300" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="465" y="165" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="middle">MPS</text>
    <text x="465" y="188" fill="#6E6E73" font-size="14" text-anchor="middle">Multi-Process Service</text>

    <rect x="365" y="210" width="200" height="150" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
    <text x="465" y="232" fill="#1D1D1F" font-size="15" font-weight="600" text-anchor="middle">Physical GPU</text>

    <rect x="380" y="250" width="170" height="60" rx="6" fill="#1D1D1F"/>
    <text x="465" y="275" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">MPS Server</text>
    <text x="465" y="293" fill="#AEAEB2" font-size="11" text-anchor="middle">Shared CUDA Context</text>

    <g>
      <rect x="380" y="318" width="52" height="30" rx="4" fill="#FF9500"/>
      <text x="406" y="337" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">Client A</text>
    </g>
    <g>
      <rect x="439" y="318" width="52" height="30" rx="4" fill="#0071E3"/>
      <text x="465" y="337" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">Client B</text>
    </g>
    <g>
      <rect x="498" y="318" width="52" height="30" rx="4" fill="#34C759"/>
      <text x="524" y="337" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">Client C</text>
    </g>

    <rect x="365" y="395" width="200" height="2" fill="#E5E5EA"/>
    <text x="375" y="413" fill="#0071E3" font-size="11" font-weight="600">✓ Kernel concurrency</text>
    <text x="375" y="425" fill="#FF9500" font-size="11" font-weight="600">△ Soft isolation</text>

    <!-- MIG -->
    <rect x="620" y="130" width="250" height="300" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="745" y="165" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="middle">MIG</text>
    <text x="745" y="188" fill="#6E6E73" font-size="14" text-anchor="middle">Multi-Instance GPU</text>

    <rect x="645" y="210" width="200" height="150" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
    <text x="745" y="232" fill="#1D1D1F" font-size="15" font-weight="600" text-anchor="middle">Physical GPU</text>

    <rect x="660" y="250" width="170" height="40" rx="6" fill="#FF9500" stroke="#FFFFFF" stroke-width="2"/>
    <text x="745" y="267" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">GI 0: 3g.20gb</text>
    <text x="745" y="282" fill="#FFE5CC" font-size="9" text-anchor="middle">SM • Mem • Cache</text>

    <rect x="660" y="297" width="82" height="30" rx="6" fill="#0071E3" stroke="#FFFFFF" stroke-width="2"/>
    <text x="701" y="310" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle">GI 1</text>
    <text x="701" y="322" fill="#CCE5FF" font-size="8" text-anchor="middle">1g.5gb</text>

    <rect x="748" y="297" width="82" height="30" rx="6" fill="#34C759" stroke="#FFFFFF" stroke-width="2"/>
    <text x="789" y="310" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle">GI 2</text>
    <text x="789" y="322" fill="#D5F5DE" font-size="8" text-anchor="middle">1g.5gb</text>

    <rect x="660" y="333" width="170" height="20" rx="4" fill="#E5E5EA"/>
    <text x="745" y="347" fill="#86868B" font-size="10" text-anchor="middle">Unused capacity</text>

    <rect x="645" y="395" width="200" height="2" fill="#E5E5EA"/>
    <text x="655" y="413" fill="#0071E3" font-size="11" font-weight="600">✓ Hardware isolation</text>
    <text x="655" y="425" fill="#FF9500" font-size="11" font-weight="600">△ Fixed partitions</text>

    <!-- vGPU -->
    <rect x="900" y="130" width="250" height="300" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="1025" y="165" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="middle">vGPU</text>
    <text x="1025" y="188" fill="#6E6E73" font-size="14" text-anchor="middle">Virtual GPU</text>

    <rect x="925" y="210" width="200" height="150" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
    <text x="1025" y="232" fill="#1D1D1F" font-size="15" font-weight="600" text-anchor="middle">Physical GPU</text>

    <rect x="940" y="250" width="170" height="25" rx="4" fill="#1D1D1F"/>
    <text x="1025" y="267" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle">Hypervisor / vGPU Manager</text>

    <rect x="940" y="283" width="170" height="32" rx="6" fill="#FF9500"/>
    <text x="1025" y="300" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle">VM 1 • vGPU</text>
    <text x="1025" y="311" fill="#FFE5CC" font-size="8" text-anchor="middle">8GB profile</text>

    <rect x="940" y="321" width="170" height="32" rx="6" fill="#0071E3"/>
    <text x="1025" y="338" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle">VM 2 • vGPU</text>
    <text x="1025" y="349" fill="#CCE5FF" font-size="8" text-anchor="middle">4GB profile</text>

    <rect x="925" y="395" width="200" height="2" fill="#E5E5EA"/>
    <text x="935" y="413" fill="#0071E3" font-size="11" font-weight="600">✓ VM isolation</text>
    <text x="935" y="425" fill="#FF9500" font-size="11" font-weight="600">△ License required</text>

    <!-- Comparison Table -->
    <rect x="60" y="460" width="1080" height="340" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="600" y="495" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="middle">Comparison Matrix</text>

    <!-- Table Headers -->
    <line x1="90" y1="515" x2="1110" y2="515" stroke="#E5E5EA" stroke-width="2"/>
    <text x="210" y="540" fill="#6E6E73" font-size="14" font-weight="600" text-anchor="middle">Isolation Level</text>
    <text x="420" y="540" fill="#6E6E73" font-size="14" font-weight="600" text-anchor="middle">Memory Protection</text>
    <text x="650" y="540" fill="#6E6E73" font-size="14" font-weight="600" text-anchor="middle">QoS Guarantee</text>
    <text x="880" y="540" fill="#6E6E73" font-size="14" font-weight="600" text-anchor="middle">Setup Complexity</text>
    <text x="1040" y="540" fill="#6E6E73" font-size="14" font-weight="600" text-anchor="middle">Best For</text>

    <!-- Time-Slicing Row -->
    <line x1="90" y1="560" x2="1110" y2="560" stroke="#E5E5EA"/>
    <text x="100" y="590" fill="#1D1D1F" font-size="15" font-weight="600">Time-Slicing</text>
    <text x="210" y="590" fill="#FF3B30" font-size="14" text-anchor="middle">None</text>
    <text x="420" y="590" fill="#FF3B30" font-size="14" text-anchor="middle">Shared</text>
    <text x="650" y="590" fill="#FF3B30" font-size="14" text-anchor="middle">No</text>
    <text x="880" y="590" fill="#34C759" font-size="14" text-anchor="middle">Very Low</text>
    <text x="1040" y="590" fill="#1D1D1F" font-size="13" text-anchor="middle">Dev/Test</text>

    <!-- MPS Row -->
    <line x1="90" y1="610" x2="1110" y2="610" stroke="#E5E5EA"/>
    <text x="100" y="640" fill="#1D1D1F" font-size="15" font-weight="600">MPS</text>
    <text x="210" y="640" fill="#FF9500" font-size="14" text-anchor="middle">Process</text>
    <text x="420" y="640" fill="#FF9500" font-size="14" text-anchor="middle">Visible</text>
    <text x="650" y="640" fill="#FF9500" font-size="14" text-anchor="middle">Limited</text>
    <text x="880" y="640" fill="#34C759" font-size="14" text-anchor="middle">Low</text>
    <text x="1040" y="640" fill="#1D1D1F" font-size="13" text-anchor="middle">Inference</text>

    <!-- MIG Row -->
    <line x1="90" y1="660" x2="1110" y2="660" stroke="#E5E5EA"/>
    <text x="100" y="690" fill="#1D1D1F" font-size="15" font-weight="600">MIG</text>
    <text x="210" y="690" fill="#34C759" font-size="14" text-anchor="middle">Hardware</text>
    <text x="420" y="690" fill="#34C759" font-size="14" text-anchor="middle">Isolated</text>
    <text x="650" y="690" fill="#34C759" font-size="14" text-anchor="middle">Strong</text>
    <text x="880" y="690" fill="#FF9500" font-size="14" text-anchor="middle">Medium</text>
    <text x="1040" y="690" fill="#1D1D1F" font-size="13" text-anchor="middle">Multi-tenant</text>

    <!-- vGPU Row -->
    <line x1="90" y1="710" x2="1110" y2="710" stroke="#E5E5EA"/>
    <text x="100" y="740" fill="#1D1D1F" font-size="15" font-weight="600">vGPU</text>
    <text x="210" y="740" fill="#34C759" font-size="14" text-anchor="middle">VM</text>
    <text x="420" y="740" fill="#34C759" font-size="14" text-anchor="middle">Isolated</text>
    <text x="650" y="740" fill="#34C759" font-size="14" text-anchor="middle">Strong</text>
    <text x="880" y="740" fill="#FF3B30" font-size="14" text-anchor="middle">High</text>
    <text x="1040" y="740" fill="#1D1D1F" font-size="13" text-anchor="middle">VDI/Cloud</text>

    <!-- Legend -->
    <rect x="90" y="760" width="1020" height="28" rx="6" fill="#F5F5F7"/>
    <circle cx="110" cy="774" r="5" fill="#34C759"/>
    <text x="125" y="779" fill="#1D1D1F" font-size="12">Strong</text>
    <circle cx="210" cy="774" r="5" fill="#FF9500"/>
    <text x="225" y="779" fill="#1D1D1F" font-size="12">Moderate</text>
    <circle cx="330" cy="774" r="5" fill="#FF3B30"/>
    <text x="345" y="779" fill="#1D1D1F" font-size="12">Weak/None</text>
    <text x="1000" y="779" fill="#6E6E73" font-size="12" text-anchor="end">Choose based on isolation needs and hardware availability</text>
  </g>
</svg>