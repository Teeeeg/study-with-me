<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">NVIDIA GPU Architecture Evolution</title>
  <desc id="desc">Timeline showing the evolution of NVIDIA GPU architectures from Tesla (2006) to Blackwell (2024), highlighting key innovations like CUDA Core, Tensor Core, NVLink, and MIG.</desc>
  <rect width="1200" height="1000" fill="#F5F5F7"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <text x="50" y="58" fill="#1D1D1F" font-size="32" font-weight="600">NVIDIA GPU Architecture Evolution</text>
    <text x="50" y="88" fill="#6E6E73" font-size="16">From general computing to AI acceleration</text>

    <!-- Timeline axis -->
    <line x1="100" y1="150" x2="100" y2="920" stroke="#D2D2D7" stroke-width="3"/>

    <!-- Early Era: 2006-2014 -->
    <rect x="140" y="130" width="1000" height="240" rx="12" fill="#FFF3E0" stroke="#FF9500"/>
    <text x="160" y="160" fill="#FF9500" font-size="18" font-weight="600">Early Computing Era (2006-2014)</text>

    <!-- Tesla 2006 -->
    <circle cx="100" cy="200" r="12" fill="#FF9500"/>
    <rect x="160" y="180" width="450" height="100" rx="8" fill="#FFFFFF" stroke="#E5E5EA"/>
    <text x="180" y="210" fill="#1D1D1F" font-size="20" font-weight="600">Tesla (2006)</text>
    <text x="180" y="235" fill="#6E6E73" font-size="14">• First GPU with CUDA Core</text>
    <text x="180" y="255" fill="#6E6E73" font-size="14">• General-purpose computing on GPU</text>
    <text x="180" y="275" fill="#6E6E73" font-size="14">• Foundation for parallel computing</text>

    <!-- Fermi 2010 -->
    <circle cx="100" cy="320" r="12" fill="#FF9500"/>
    <rect x="640" y="180" width="480" height="100" rx="8" fill="#FFFFFF" stroke="#E5E5EA"/>
    <text x="660" y="210" fill="#1D1D1F" font-size="20" font-weight="600">Fermi (2010)</text>
    <text x="660" y="235" fill="#6E6E73" font-size="14">• Stream Processor → CUDA Core</text>
    <text x="660" y="255" fill="#6E6E73" font-size="14">• 16 SMs, 32 CUDA Cores per SM</text>
    <text x="660" y="275" fill="#6E6E73" font-size="14">• Improved thread scheduling</text>

    <!-- Kepler/Maxwell -->
    <circle cx="100" cy="340" r="12" fill="#FF9500"/>
    <rect x="160" y="300" width="960" height="60" rx="8" fill="#FFFFFF" stroke="#E5E5EA"/>
    <text x="180" y="325" fill="#1D1D1F" font-size="18" font-weight="600">Kepler (2012) &amp; Maxwell (2014)</text>
    <text x="180" y="348" fill="#6E6E73" font-size="14">• Massive increase in CUDA Core count  •  Focus on parallel compute scalability</text>

    <!-- Deep Learning Era: 2016-2024 -->
    <rect x="140" y="390" width="1000" height="520" rx="12" fill="#E8F2FF" stroke="#0071E3"/>
    <text x="160" y="420" fill="#0071E3" font-size="18" font-weight="600">Deep Learning Era (2016-2024)</text>

    <!-- Pascal 2016 -->
    <circle cx="100" cy="470" r="12" fill="#0071E3"/>
    <rect x="160" y="450" width="450" height="120" rx="8" fill="#FFFFFF" stroke="#E5E5EA"/>
    <text x="180" y="480" fill="#1D1D1F" font-size="20" font-weight="600">Pascal (2016)</text>
    <text x="180" y="505" fill="#6E6E73" font-size="14">• Introduction of NVLink</text>
    <text x="180" y="525" fill="#6E6E73" font-size="14">• High-speed GPU-to-GPU interconnect</text>
    <text x="180" y="545" fill="#6E6E73" font-size="14">• Shift toward deep learning</text>
    <rect x="190" y="555" width="120" height="10" rx="3" fill="#34C759"/>
    <text x="320" y="563" fill="#34C759" font-size="11" font-weight="600">NVLink Gen 1</text>

    <!-- Volta 2017 -->
    <circle cx="100" cy="620" r="12" fill="#5E5CE6"/>
    <rect x="640" y="450" width="480" height="140" rx="8" fill="#FFFFFF" stroke="#E5E5EA"/>
    <text x="660" y="480" fill="#1D1D1F" font-size="20" font-weight="600">Volta (2017) - Breakthrough</text>
    <text x="660" y="505" fill="#6E6E73" font-size="14">• First Tensor Core (640 in V100)</text>
    <text x="660" y="525" fill="#6E6E73" font-size="14">• Mixed precision: FP16 input, FP32 accumulate</text>
    <text x="660" y="545" fill="#6E6E73" font-size="14">• 4×4×4 GEMM per Tensor Core per cycle</text>
    <text x="660" y="565" fill="#6E6E73" font-size="14">• 8× AI throughput vs Pascal per SM</text>
    <rect x="670" y="575" width="110" height="10" rx="3" fill="#FF9500"/>
    <text x="790" y="583" fill="#FF9500" font-size="11" font-weight="600">Tensor Core Gen 1</text>

    <!-- Turing 2018 -->
    <circle cx="100" cy="670" r="12" fill="#0071E3"/>
    <rect x="160" y="590" width="450" height="100" rx="8" fill="#FFFFFF" stroke="#E5E5EA"/>
    <text x="180" y="620" fill="#1D1D1F" font-size="20" font-weight="600">Turing (2018)</text>
    <text x="180" y="645" fill="#6E6E73" font-size="14">• Introduction of RT Core (ray tracing)</text>
    <text x="180" y="665" fill="#6E6E73" font-size="14">• Enhanced Tensor Core for inference</text>
    <text x="180" y="685" fill="#6E6E73" font-size="14">• Real-time rendering + AI</text>

    <!-- Ampere 2020 -->
    <circle cx="100" cy="760" r="12" fill="#5E5CE6"/>
    <rect x="640" y="610" width="480" height="140" rx="8" fill="#FFFFFF" stroke="#E5E5EA"/>
    <text x="660" y="640" fill="#1D1D1F" font-size="20" font-weight="600">Ampere (2020) - A100</text>
    <text x="660" y="665" fill="#6E6E73" font-size="14">• Multi-Instance GPU (MIG): 7 isolated instances</text>
    <text x="660" y="685" fill="#6E6E73" font-size="14">• Tensor Core Gen 3: TF32, BF16, FP64</text>
    <text x="660" y="705" fill="#6E6E73" font-size="14">• Sparsity acceleration (2× speedup)</text>
    <text x="660" y="725" fill="#6E6E73" font-size="14">• NVLink 3.0: 600GB/s</text>
    <rect x="670" y="735" width="80" height="10" rx="3" fill="#FF3B30"/>
    <text x="760" y="743" fill="#FF3B30" font-size="11" font-weight="600">MIG Support</text>

    <!-- Hopper 2022 -->
    <circle cx="100" cy="840" r="12" fill="#5E5CE6"/>
    <rect x="160" y="770" width="450" height="120" rx="8" fill="#FFFFFF" stroke="#E5E5EA"/>
    <text x="180" y="800" fill="#1D1D1F" font-size="20" font-weight="600">Hopper (2022) - H100</text>
    <text x="180" y="825" fill="#6E6E73" font-size="14">• Transformer Engine optimization</text>
    <text x="180" y="845" fill="#6E6E73" font-size="14">• Tensor Core Gen 4: FP8 support</text>
    <text x="180" y="865" fill="#6E6E73" font-size="14">• NVLink 4.0: 900GB/s</text>
    <text x="180" y="885" fill="#6E6E73" font-size="14">• NVLink Switch System for large clusters</text>

    <!-- Blackwell 2024 -->
    <circle cx="100" cy="900" r="12" fill="#5E5CE6"/>
    <rect x="640" y="770" width="480" height="120" rx="8" fill="#FFFFFF" stroke="#E5E5EA"/>
    <text x="660" y="800" fill="#1D1D1F" font-size="20" font-weight="600">Blackwell (2024) - Latest</text>
    <text x="660" y="825" fill="#6E6E73" font-size="14">• Next-gen Tensor Core architecture</text>
    <text x="660" y="845" fill="#6E6E73" font-size="14">• Enhanced interconnect technology</text>
    <text x="660" y="865" fill="#6E6E73" font-size="14">• Optimized for large-scale AI models</text>
    <text x="660" y="885" fill="#6E6E73" font-size="14">• Training &amp; inference at scale</text>

    <!-- Key Innovations Legend -->
    <rect x="140" y="940" width="1000" height="45" rx="8" fill="#F5F5F7" stroke="#D2D2D7"/>
    <text x="160" y="965" fill="#1D1D1F" font-size="14" font-weight="600">Key Innovations:</text>

    <rect x="280" y="955" width="12" height="12" rx="2" fill="#34C759"/>
    <text x="300" y="965" fill="#1D1D1F" font-size="12">NVLink</text>

    <rect x="380" y="955" width="12" height="12" rx="2" fill="#FF9500"/>
    <text x="400" y="965" fill="#1D1D1F" font-size="12">Tensor Core</text>

    <rect x="520" y="955" width="12" height="12" rx="2" fill="#5E5CE6"/>
    <text x="540" y="965" fill="#1D1D1F" font-size="12">RT Core</text>

    <rect x="640" y="955" width="12" height="12" rx="2" fill="#FF3B30"/>
    <text x="660" y="965" fill="#1D1D1F" font-size="12">MIG</text>

    <rect x="730" y="955" width="12" height="12" rx="2" fill="#0071E3"/>
    <text x="750" y="965" fill="#1D1D1F" font-size="12">Transformer Engine</text>

    <text x="920" y="965" fill="#6E6E73" font-size="11">Each generation builds on previous innovations</text>
  </g>
</svg>