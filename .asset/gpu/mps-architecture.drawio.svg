<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">MPS architecture and workflow</title>
  <desc id="desc">NVIDIA Multi-Process Service showing context switching vs space multiplexing, performance characteristics, and deployment architecture.</desc>
  <rect width="1200" height="900" fill="#F5F5F7"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <text x="50" y="58" fill="#1D1D1F" font-size="32" font-weight="600">MPS: Multi-Process Service</text>
    <text x="50" y="88" fill="#6E6E73" font-size="16">From context switching to space multiplexing</text>

    <!-- Traditional Model -->
    <rect x="60" y="130" width="540" height="320" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="330" y="165" fill="#1D1D1F" font-size="22" font-weight="600" text-anchor="middle">Traditional CUDA Model</text>
    <text x="330" y="190" fill="#6E6E73" font-size="14" text-anchor="middle">Time-slicing with context switches</text>

    <!-- Process boxes -->
    <rect x="90" y="220" width="140" height="80" rx="8" fill="#FF9500"/>
    <text x="160" y="250" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">Process A</text>
    <text x="160" y="270" fill="#FFE5CC" font-size="12" text-anchor="middle">CUDA Context A</text>
    <rect x="100" y="280" width="120" height="12" rx="4" fill="#FFFFFF"/>
    <text x="160" y="289" fill="#FF9500" font-size="9" font-weight="600" text-anchor="middle">Kernel A1</text>

    <rect x="250" y="220" width="140" height="80" rx="8" fill="#0071E3"/>
    <text x="320" y="250" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">Process B</text>
    <text x="320" y="270" fill="#CCE5FF" font-size="12" text-anchor="middle">CUDA Context B</text>
    <rect x="260" y="280" width="120" height="12" rx="4" fill="#FFFFFF"/>
    <text x="320" y="289" fill="#0071E3" font-size="9" font-weight="600" text-anchor="middle">Kernel B1</text>

    <rect x="410" y="220" width="140" height="80" rx="8" fill="#34C759"/>
    <text x="480" y="250" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">Process C</text>
    <text x="480" y="270" fill="#D5F5DE" font-size="12" text-anchor="middle">CUDA Context C</text>
    <rect x="420" y="280" width="120" height="12" rx="4" fill="#FFFFFF"/>
    <text x="480" y="289" fill="#34C759" font-size="9" font-weight="600" text-anchor="middle">Kernel C1</text>

    <!-- Arrows -->
    <path d="M160 300 L160 330" stroke="#FF9500" stroke-width="3" marker-end="url(#arrowOrange)"/>
    <path d="M320 300 L320 330" stroke="#0071E3" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <path d="M480 300 L480 330" stroke="#34C759" stroke-width="3" marker-end="url(#arrowGreen)"/>

    <!-- GPU representation with timeline -->
    <rect x="90" y="340" width="460" height="90" rx="8" fill="#1D1D1F"/>
    <text x="320" y="365" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">GPU - Time Slicing</text>

    <!-- Timeline -->
    <rect x="110" y="380" width="420" height="35" rx="4" fill="#2C2C2E"/>
    <rect x="115" y="385" width="80" height="25" rx="3" fill="#FF9500"/>
    <text x="155" y="402" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">Ctx A</text>

    <rect x="200" y="385" width="15" height="25" rx="3" fill="#86868B"/>
    <text x="207" y="402" fill="#FFFFFF" font-size="8" font-weight="600" text-anchor="middle">⟳</text>

    <rect x="220" y="385" width="80" height="25" rx="3" fill="#0071E3"/>
    <text x="260" y="402" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">Ctx B</text>

    <rect x="305" y="385" width="15" height="25" rx="3" fill="#86868B"/>
    <text x="312" y="402" fill="#FFFFFF" font-size="8" font-weight="600" text-anchor="middle">⟳</text>

    <rect x="325" y="385" width="80" height="25" rx="3" fill="#34C759"/>
    <text x="365" y="402" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">Ctx C</text>

    <rect x="410" y="385" width="15" height="25" rx="3" fill="#86868B"/>
    <text x="417" y="402" fill="#FFFFFF" font-size="8" font-weight="600" text-anchor="middle">⟳</text>

    <rect x="430" y="385" width="95" height="25" rx="3" fill="#FF9500"/>
    <text x="477" y="402" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">Ctx A...</text>

    <text x="100" y="380" fill="#FF3B30" font-size="11" font-weight="600">✗ Serial execution</text>
    <text x="400" y="380" fill="#FF3B30" font-size="11" font-weight="600">✗ Context switch overhead</text>

    <!-- MPS Model -->
    <rect x="640" y="130" width="510" height="320" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="895" y="165" fill="#1D1D1F" font-size="22" font-weight="600" text-anchor="middle">MPS Model</text>
    <text x="895" y="190" fill="#6E6E73" font-size="14" text-anchor="middle">Space multiplexing with shared context</text>

    <!-- Process boxes with MPS clients -->
    <rect x="670" y="220" width="120" height="60" rx="8" fill="#FF9500"/>
    <text x="730" y="245" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">Process A</text>
    <text x="730" y="262" fill="#FFE5CC" font-size="11" text-anchor="middle">MPS Client</text>
    <rect x="680" y="268" width="100" height="8" rx="3" fill="#FFFFFF"/>
    <text x="730" y="274" fill="#FF9500" font-size="8" font-weight="600" text-anchor="middle">Kernel A1</text>

    <rect x="810" y="220" width="120" height="60" rx="8" fill="#0071E3"/>
    <text x="870" y="245" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">Process B</text>
    <text x="870" y="262" fill="#CCE5FF" font-size="11" text-anchor="middle">MPS Client</text>
    <rect x="820" y="268" width="100" height="8" rx="3" fill="#FFFFFF"/>
    <text x="870" y="274" fill="#0071E3" font-size="8" font-weight="600" text-anchor="middle">Kernel B1</text>

    <rect x="950" y="220" width="120" height="60" rx="8" fill="#34C759"/>
    <text x="1010" y="245" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">Process C</text>
    <text x="1010" y="262" fill="#D5F5DE" font-size="11" text-anchor="middle">MPS Client</text>
    <rect x="960" y="268" width="100" height="8" rx="3" fill="#FFFFFF"/>
    <text x="1010" y="274" fill="#34C759" font-size="8" font-weight="600" text-anchor="middle">Kernel C1</text>

    <!-- Arrows to MPS Server -->
    <path d="M730 280 L730 305" stroke="#FF9500" stroke-width="2" marker-end="url(#arrowOrange)"/>
    <path d="M870 280 L870 305" stroke="#0071E3" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <path d="M1010 280 L1010 305" stroke="#34C759" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- MPS Server -->
    <rect x="670" y="305" width="400" height="45" rx="6" fill="#5E5CE6"/>
    <text x="870" y="333" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">MPS Server (Shared CUDA Context)</text>

    <!-- Arrow to GPU -->
    <path d="M870 350 L870 370" stroke="#5E5CE6" stroke-width="3" marker-end="url(#arrowPurple)"/>

    <!-- GPU with parallel execution -->
    <rect x="670" y="370" width="400" height="60" rx="8" fill="#1D1D1F"/>
    <text x="870" y="393" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">GPU - Space Multiplexing</text>

    <!-- Parallel execution visualization -->
    <g transform="translate(690, 405)">
      <rect x="0" y="0" width="360" height="18" rx="3" fill="#2C2C2E"/>
      <rect x="5" y="3" width="110" height="12" rx="2" fill="#FF9500"/>
      <text x="60" y="12" fill="#FFFFFF" font-size="8" font-weight="600" text-anchor="middle">Kernel A1</text>
      <rect x="125" y="3" width="110" height="12" rx="2" fill="#0071E3"/>
      <text x="180" y="12" fill="#FFFFFF" font-size="8" font-weight="600" text-anchor="middle">Kernel B1</text>
      <rect x="245" y="3" width="110" height="12" rx="2" fill="#34C759"/>
      <text x="300" y="12" fill="#FFFFFF" font-size="8" font-weight="600" text-anchor="middle">Kernel C1</text>
    </g>

    <text x="680" y="403" fill="#34C759" font-size="11" font-weight="600">✓ Concurrent execution</text>
    <text x="930" y="403" fill="#34C759" font-size="11" font-weight="600">✓ No context switches</text>

    <!-- Performance Comparison -->
    <rect x="60" y="480" width="540" height="180" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="330" y="515" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="middle">Performance Impact</text>

    <rect x="90" y="535" width="230" height="110" rx="8" fill="#FFF3E0" stroke="#FF9500"/>
    <text x="205" y="560" fill="#1D1D1F" font-size="16" font-weight="600" text-anchor="middle">Traditional Model</text>
    <text x="110" y="585" fill="#1D1D1F" font-size="13">Kernel launch: <tspan fill="#FF3B30" font-weight="600">10-50 μs</tspan></text>
    <text x="110" y="605" fill="#1D1D1F" font-size="13">Context switch: <tspan fill="#FF3B30" font-weight="600">~10 μs</tspan></text>
    <text x="110" y="625" fill="#1D1D1F" font-size="13">Concurrency: <tspan fill="#FF3B30" font-weight="600">None</tspan></text>

    <rect x="340" y="535" width="230" height="110" rx="8" fill="#E8F2FF" stroke="#0071E3"/>
    <text x="455" y="560" fill="#1D1D1F" font-size="16" font-weight="600" text-anchor="middle">MPS Model</text>
    <text x="360" y="585" fill="#1D1D1F" font-size="13">Kernel launch: <tspan fill="#34C759" font-weight="600">1-5 μs</tspan></text>
    <text x="360" y="605" fill="#1D1D1F" font-size="13">Context switch: <tspan fill="#34C759" font-weight="600">0 μs</tspan></text>
    <text x="360" y="625" fill="#1D1D1F" font-size="13">Concurrency: <tspan fill="#34C759" font-weight="600">Yes (Volta+)</tspan></text>

    <!-- Architecture Comparison -->
    <rect x="640" y="480" width="510" height="180" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="895" y="515" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="middle">Key Characteristics</text>

    <g transform="translate(670, 535)">
      <circle cx="10" cy="7" r="5" fill="#34C759"/>
      <text x="25" y="12" fill="#1D1D1F" font-size="13">Lower latency for small kernels</text>
    </g>
    <g transform="translate(670, 560)">
      <circle cx="10" cy="7" r="5" fill="#34C759"/>
      <text x="25" y="12" fill="#1D1D1F" font-size="13">Better GPU utilization (3-8× for inference)</text>
    </g>
    <g transform="translate(670, 585)">
      <circle cx="10" cy="7" r="5" fill="#FF9500"/>
      <text x="25" y="12" fill="#1D1D1F" font-size="13">Memory visible across all processes</text>
    </g>
    <g transform="translate(670, 610)">
      <circle cx="10" cy="7" r="5" fill="#FF3B30"/>
      <text x="25" y="12" fill="#1D1D1F" font-size="13">No resource quotas or QoS guarantees</text>
    </g>
    <g transform="translate(670, 635)">
      <circle cx="10" cy="7" r="5" fill="#FF3B30"/>
      <text x="25" y="12" fill="#1D1D1F" font-size="13">Error in one process affects all clients</text>
    </g>

    <!-- Deployment Architecture -->
    <rect x="60" y="690" width="1080" height="180" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="600" y="725" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="middle">Kubernetes Deployment</text>

    <!-- Host level -->
    <rect x="90" y="750" width="1020" height="100" rx="8" fill="#F5F5F7" stroke="#E5E5EA"/>
    <text x="110" y="773" fill="#6E6E73" font-size="14" font-weight="600">Node (with GPU)</text>

    <!-- MPS Daemon -->
    <rect x="110" y="785" width="160" height="50" rx="6" fill="#5E5CE6"/>
    <text x="190" y="807" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">MPS Daemon</text>
    <text x="190" y="823" fill="#E0DFFF" font-size="10" text-anchor="middle">DaemonSet</text>

    <!-- Pods -->
    <rect x="300" y="785" width="220" height="50" rx="6" fill="#FF9500"/>
    <text x="410" y="803" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">Pod A (Inference)</text>
    <text x="410" y="818" fill="#FFE5CC" font-size="10" text-anchor="middle">CUDA_MPS_PIPE_DIRECTORY</text>
    <text x="410" y="830" fill="#FFE5CC" font-size="9" text-anchor="middle">→ /tmp/nvidia-mps</text>

    <rect x="550" y="785" width="220" height="50" rx="6" fill="#0071E3"/>
    <text x="660" y="803" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">Pod B (Inference)</text>
    <text x="660" y="818" fill="#CCE5FF" font-size="10" text-anchor="middle">CUDA_MPS_PIPE_DIRECTORY</text>
    <text x="660" y="830" fill="#CCE5FF" font-size="9" text-anchor="middle">→ /tmp/nvidia-mps</text>

    <rect x="800" y="785" width="220" height="50" rx="6" fill="#34C759"/>
    <text x="910" y="803" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">Pod C (Training)</text>
    <text x="910" y="818" fill="#D5F5DE" font-size="10" text-anchor="middle">CUDA_MPS_PIPE_DIRECTORY</text>
    <text x="910" y="830" fill="#D5F5DE" font-size="9" text-anchor="middle">→ /tmp/nvidia-mps</text>

    <!-- Arrows showing connection -->
    <path d="M190 785 L410 785" stroke="#5E5CE6" stroke-width="2" stroke-dasharray="5 3"/>
    <path d="M190 785 L660 785" stroke="#5E5CE6" stroke-width="2" stroke-dasharray="5 3"/>
    <path d="M190 785 L910 785" stroke="#5E5CE6" stroke-width="2" stroke-dasharray="5 3"/>

    <!-- Arrow markers -->
    <defs>
      <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#FF9500"/>
      </marker>
      <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#0071E3"/>
      </marker>
      <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#34C759"/>
      </marker>
      <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#5E5CE6"/>
      </marker>
    </defs>
  </g>
</svg>