<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc">
  <title id="title">Tensor Core Operation</title>
  <desc id="desc">How Tensor Core performs 4x4x4 matrix multiplication and scales up to large GEMM operations</desc>
  <rect width="1200" height="950" fill="#F5F5F7"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <text x="50" y="58" fill="#1D1D1F" font-size="32" font-weight="600">Tensor Core Matrix Multiplication</text>
    <text x="50" y="88" fill="#6E6E73" font-size="16">From hardware 4×4×4 to WMMA 16×16×16 to large-scale GEMM</text>

    <!-- Level 1: Hardware Tensor Core -->
    <rect x="60" y="130" width="360" height="240" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="240" y="165" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="middle">Hardware Level: Single Tensor Core</text>

    <!-- Matrix A -->
    <rect x="90" y="190" width="80" height="80" rx="4" fill="#FF9500"/>
    <text x="130" y="235" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">A</text>
    <text x="130" y="252" fill="#FFE5CC" font-size="12" text-anchor="middle">4×4 FP16</text>

    <!-- Matrix B -->
    <rect x="190" y="190" width="80" height="80" rx="4" fill="#0071E3"/>
    <text x="230" y="235" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">B</text>
    <text x="230" y="252" fill="#CCE5FF" font-size="12" text-anchor="middle">4×4 FP16</text>

    <!-- Plus Matrix C -->
    <text x="285" y="235" fill="#1D1D1F" font-size="20">+</text>

    <rect x="310" y="190" width="80" height="80" rx="4" fill="#34C759"/>
    <text x="350" y="235" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">C</text>
    <text x="350" y="252" fill="#D5F5DE" font-size="12" text-anchor="middle">4×4 FP32</text>

    <!-- Arrow down -->
    <path d="M 240 280 L 240 300" stroke="#1D1D1F" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

    <!-- Result D -->
    <rect x="180" y="310" width="120" height="30" rx="4" fill="#5E5CE6"/>
    <text x="240" y="330" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">D = A×B + C (4×4 FP32)</text>

    <!-- Performance info -->
    <text x="90" y="355" fill="#6E6E73" font-size="12">• 64 FMA operations</text>
    <text x="90" y="372" fill="#6E6E73" font-size="12">• 1 clock cycle</text>

    <!-- Level 2: WMMA API -->
    <rect x="460" y="130" width="360" height="240" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="640" y="165" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="middle">CUDA Programming: WMMA API</text>

    <!-- 16x16 matrices -->
    <rect x="490" y="190" width="100" height="100" rx="4" fill="#FF9500"/>
    <text x="540" y="245" fill="#FFFFFF" font-size="18" font-weight="600" text-anchor="middle">A</text>
    <text x="540" y="265" fill="#FFE5CC" font-size="13" text-anchor="middle">16×16 FP16</text>

    <rect x="610" y="190" width="100" height="100" rx="4" fill="#0071E3"/>
    <text x="660" y="245" fill="#FFFFFF" font-size="18" font-weight="600" text-anchor="middle">B</text>
    <text x="660" y="265" fill="#CCE5FF" font-size="13" text-anchor="middle">16×16 FP16</text>

    <!-- Result -->
    <rect x="540" y="310" width="120" height="30" rx="4" fill="#5E5CE6"/>
    <text x="600" y="330" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">D = 16×16 FP32</text>

    <!-- Warp info -->
    <text x="725" y="220" fill="#6E6E73" font-size="11">1 Warp</text>
    <text x="725" y="235" fill="#6E6E73" font-size="11">(32 threads)</text>
    <text x="725" y="250" fill="#6E6E73" font-size="11">coordinates</text>
    <text x="725" y="265" fill="#6E6E73" font-size="11">multiple</text>
    <text x="725" y="280" fill="#6E6E73" font-size="11">Tensor Cores</text>

    <!-- Level 3: Large Matrix -->
    <rect x="860" y="130" width="280" height="240" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="1000" y="165" fill="#1D1D1F" font-size="20" font-weight="600" text-anchor="middle">Large-Scale GEMM</text>

    <!-- Large matrix representation -->
    <rect x="890" y="190" width="180" height="140" rx="4" fill="#E5E5EA" stroke="#86868B" stroke-width="2"/>

    <!-- Grid pattern -->
    <g stroke="#86868B" stroke-width="1">
      <line x1="935" y1="190" x2="935" y2="330"/>
      <line x1="980" y1="190" x2="980" y2="330"/>
      <line x1="1025" y1="190" x2="1025" y2="330"/>

      <line x1="890" y1="225" x2="1070" y2="225"/>
      <line x1="890" y1="260" x2="1070" y2="260"/>
      <line x1="890" y1="295" x2="1070" y2="295"/>
    </g>

    <text x="980" y="250" fill="#1D1D1F" font-size="16" font-weight="600" text-anchor="middle">2048×2048</text>
    <text x="980" y="270" fill="#6E6E73" font-size="12" text-anchor="middle">Divided into</text>
    <text x="980" y="285" fill="#6E6E73" font-size="12" text-anchor="middle">16×16 tiles</text>

    <!-- Decomposition Diagram -->
    <rect x="60" y="400" width="1080" height="270" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="600" y="440" fill="#1D1D1F" font-size="22" font-weight="600" text-anchor="middle">Matrix Decomposition &amp; Mapping</text>

    <!-- Step 1: Large Matrix -->
    <g transform="translate(120, 470)">
      <rect x="0" y="0" width="140" height="140" rx="4" fill="#E5E5EA" stroke="#1D1D1F" stroke-width="2"/>
      <text x="70" y="75" fill="#1D1D1F" font-size="16" font-weight="600" text-anchor="middle">2048×2048</text>
      <text x="70" y="165" fill="#1D1D1F" font-size="14" text-anchor="middle">Large Matrix</text>
    </g>

    <!-- Arrow -->
    <path d="M 280 540 L 330 540" stroke="#1D1D1F" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="292" y="532" fill="#6E6E73" font-size="11">Divide into</text>

    <!-- Step 2: Tiles -->
    <g transform="translate(350, 480)">
      <rect x="0" y="0" width="70" height="70" rx="3" fill="#0071E3" stroke="#1D1D1F"/>
      <text x="35" y="38" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">Tile</text>
      <text x="35" y="52" fill="#CCE5FF" font-size="10" text-anchor="middle">128×128</text>

      <rect x="80" y="0" width="70" height="70" rx="3" fill="#E5E5EA" stroke="#86868B"/>
      <rect x="0" y="80" width="70" height="70" rx="3" fill="#E5E5EA" stroke="#86868B"/>
      <rect x="80" y="80" width="70" height="70" rx="3" fill="#E5E5EA" stroke="#86868B"/>

      <text x="75" y="175" fill="#1D1D1F" font-size="14" text-anchor="middle">Thread Block</text>
      <text x="75" y="192" fill="#6E6E73" font-size="11" text-anchor="middle">processes 1 tile</text>
    </g>

    <!-- Arrow -->
    <path d="M 530 540 L 580 540" stroke="#1D1D1F" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="542" y="532" fill="#6E6E73" font-size="11">Divide into</text>

    <!-- Step 3: Fragments -->
    <g transform="translate(600, 500)">
      <rect x="0" y="0" width="35" height="35" rx="2" fill="#FF9500" stroke="#1D1D1F"/>
      <text x="17" y="23" fill="#FFFFFF" font-size="10" font-weight="600" text-anchor="middle">16×16</text>

      <rect x="42" y="0" width="35" height="35" rx="2" fill="#E5E5EA" stroke="#86868B"/>
      <rect x="84" y="0" width="35" height="35" rx="2" fill="#E5E5EA" stroke="#86868B"/>

      <rect x="0" y="42" width="35" height="35" rx="2" fill="#E5E5EA" stroke="#86868B"/>
      <rect x="42" y="42" width="35" height="35" rx="2" fill="#E5E5EA" stroke="#86868B"/>
      <rect x="84" y="42" width="35" height="35" rx="2" fill="#E5E5EA" stroke="#86868B"/>

      <text x="60" y="105" fill="#1D1D1F" font-size="14" text-anchor="middle">Fragments</text>
      <text x="60" y="122" fill="#6E6E73" font-size="11" text-anchor="middle">Warp-level</text>
    </g>

    <!-- Arrow -->
    <path d="M 730 540 L 780 540" stroke="#1D1D1F" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="742" y="532" fill="#6E6E73" font-size="11">Map to</text>

    <!-- Step 4: Tensor Core -->
    <g transform="translate(800, 505)">
      <rect x="0" y="0" width="60" height="60" rx="4" fill="#5E5CE6" stroke="#1D1D1F" stroke-width="2"/>
      <text x="30" y="27" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">Tensor</text>
      <text x="30" y="42" fill="#FFFFFF" font-size="12" font-weight="600" text-anchor="middle">Core</text>
      <text x="30" y="55" fill="#E0DFFF" font-size="9" text-anchor="middle">4×4×4</text>

      <text x="30" y="85" fill="#1D1D1F" font-size="14" text-anchor="middle">Hardware</text>
      <text x="30" y="102" fill="#6E6E73" font-size="11" text-anchor="middle">Execution</text>
    </g>

    <!-- Performance Comparison -->
    <rect x="60" y="700" width="1080" height="220" rx="12" fill="#FFFFFF" stroke="#D2D2D7"/>
    <text x="600" y="740" fill="#1D1D1F" font-size="22" font-weight="600" text-anchor="middle">Performance: Tensor Core vs CUDA Core</text>

    <!-- CUDA Core -->
    <rect x="100" y="770" width="480" height="130" rx="8" fill="#F5F5F7" stroke="#34C759" stroke-width="2"/>
    <text x="340" y="800" fill="#1D1D1F" font-size="18" font-weight="600" text-anchor="middle">CUDA Core (Pure FP32)</text>

    <g transform="translate(120, 820)">
      <text x="0" y="0" fill="#1D1D1F" font-size="14">For 4×4×4 matrix multiply:</text>
      <text x="0" y="23" fill="#6E6E73" font-size="13">• 64 FMA operations</text>
      <text x="0" y="43" fill="#6E6E73" font-size="13">• Need 64 CUDA Core cycles</text>
      <text x="0" y="63" fill="#6E6E73" font-size="13">• Or 2+ Warp iterations</text>
    </g>

    <!-- Tensor Core -->
    <rect x="620" y="770" width="480" height="130" rx="8" fill="#F5F5F7" stroke="#FF9500" stroke-width="2"/>
    <text x="860" y="800" fill="#1D1D1F" font-size="18" font-weight="600" text-anchor="middle">Tensor Core (Mixed Precision)</text>

    <g transform="translate(640, 820)">
      <text x="0" y="0" fill="#1D1D1F" font-size="14">For 4×4×4 matrix multiply:</text>
      <text x="0" y="23" fill="#6E6E73" font-size="13">• 64 FMA operations</text>
      <text x="0" y="43" fill="#6E6E73" font-size="13">• Only 1 Tensor Core cycle</text>
      <text x="0" y="63" fill="#6E6E73" font-size="13">• FP16 input, FP32 accumulate</text>
    </g>

    <text x="340" y="915" fill="#FF3B30" font-size="15" font-weight="600" text-anchor="middle">Baseline</text>
    <text x="860" y="915" fill="#34C759" font-size="15" font-weight="600" text-anchor="middle">8-20× faster for DL workloads</text>

    <!-- Arrow marker definition -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#1D1D1F"/>
      </marker>
    </defs>
  </g>
</svg>