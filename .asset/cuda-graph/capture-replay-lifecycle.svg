<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img"
    aria-labelledby="title desc">
    <title id="title">CUDA Graph 的捕获、实例化与重放生命周期</title>
    <desc id="desc">程序先完成 warmup，再捕获由复制和 kernel 构成的工作流，随后实例化可执行图。每次请求把新内容写入地址稳定的输入缓冲区，用一次 graph
        launch 重放，并消费或复制固定输出缓冲区的结果。</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto">
            <path d="M0 0 L10 5 L0 10 Z" fill="#111111" />
        </marker>
        <style>
      text { font-family: Helvetica Neue, Segoe UI, sans-serif; letter-spacing: 0; }
      .title { font-size: 30px; font-weight: 800; fill: #111111; }
      .subtitle { font-size: 16px; fill: #333333; }
      .heading { font-size: 19px; font-weight: 800; fill: #111111; }
      .body { font-size: 16px; fill: #333333; }
      .small { font-size: 14px; fill: #444444; }
      .inverse { font-size: 16px; font-weight: 700; fill: #FFFFFF; }
      .panel { fill: #F4F4F4; stroke: #111111; stroke-width: 3; }
      .warmup { fill: #F2E6D8; stroke: #111111; stroke-width: 2.5; }
      .capture { fill: #DDE0F1; stroke: #111111; stroke-width: 2.5; }
      .exec { fill: #DCEBDF; stroke: #111111; stroke-width: 2.5; }
      .buffer { fill: #F2D9D8; stroke: #111111; stroke-width: 2.5; }
      .node { fill: #FFFFFF; stroke: #111111; stroke-width: 2; }
      .arrow { fill: none; stroke: #111111; stroke-width: 3; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #111111; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
    </defs>
    <rect width="1200" height="690" fill="#FFFFFF" />
    <text x="600" y="45" text-anchor="middle" class="title">先准备一次，再重放很多次</text>
    <text x="600" y="76" text-anchor="middle" class="subtitle">图的执行结构保持稳定；每轮变化的是固定缓冲区中的数据与允许更新的参数</text>

    <rect x="50" y="108" width="1100" height="246" rx="3" class="panel" />
    <text x="76" y="142" class="heading">准备阶段：通常只在初始化或首次命中某个 bucket 时执行</text>
    <rect x="80" y="176" width="230" height="116" rx="3" class="warmup" />
    <text x="195" y="211" text-anchor="middle" class="heading">1. Warmup</text>
    <text x="195" y="244" text-anchor="middle" class="body">完成延迟初始化</text>
    <text x="195" y="270" text-anchor="middle" class="small">准备 kernel / workspace</text>
    <rect x="390" y="176" width="330" height="116" rx="3" class="capture" />
    <text x="555" y="207" text-anchor="middle" class="heading">2. Capture</text>
    <rect x="420" y="229" width="70" height="38" rx="3" class="node" />
    <rect x="520" y="229" width="70" height="38" rx="3" class="node" />
    <rect x="620" y="229" width="70" height="38" rx="3" class="node" />
    <text x="455" y="254" text-anchor="middle" class="small">Copy</text>
    <text x="555" y="254" text-anchor="middle" class="small">Kernel</text>
    <text x="655" y="254" text-anchor="middle" class="small">Kernel</text>
    <path d="M490 248 H515 M590 248 H615" class="arrow" />
    <rect x="800" y="176" width="320" height="116" rx="3" class="exec" />
    <text x="960" y="211" text-anchor="middle" class="heading">3. Instantiate</text>
    <text x="960" y="244" text-anchor="middle" class="body">生成 cudaGraphExec_t</text>
    <text x="960" y="270" text-anchor="middle" class="small">检查并准备可执行图</text>
    <path d="M320 234 H380 M730 234 H790" class="arrow" />

    <rect x="50" y="388" width="1100" height="222" rx="3" class="panel" />
    <text x="76" y="424" class="heading">稳态阶段：对新数据反复重放</text>
    <rect x="80" y="462" width="250" height="94" rx="3" class="buffer" />
    <text x="205" y="494" text-anchor="middle" class="heading">固定输入 buffer</text>
    <text x="205" y="525" text-anchor="middle" class="body">写入本轮的新内容</text>
    <rect x="430" y="462" width="310" height="94" rx="3" class="exec" />
    <text x="585" y="494" text-anchor="middle" class="heading">一次 graph launch</text>
    <text x="585" y="525" text-anchor="middle" class="body">重放整组节点与依赖</text>
    <rect x="840" y="462" width="280" height="94" rx="3" class="buffer" />
    <text x="980" y="494" text-anchor="middle" class="heading">固定输出 buffer</text>
    <text x="980" y="525" text-anchor="middle" class="body">立即消费或另行复制</text>
    <path d="M340 509 H420 M750 509 H830" class="arrow" />
    <path d="M980 566 V581 H205 V566" class="loop" />
    <text x="595" y="598" text-anchor="middle" class="small">下一轮覆盖数据前，必须保证上一轮读写已经安全结束</text>

    <rect x="50" y="635" width="1100" height="38" rx="3" fill="#111111" />
    <text x="600" y="660" text-anchor="middle" class="inverse">拓扑与地址保持稳定，不等于输入数值不能变化</text>
</svg>