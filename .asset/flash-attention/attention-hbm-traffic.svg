<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"
    aria-labelledby="title desc">
    <title id="title">标准 Attention 与 FlashAttention 的 HBM 数据传输对比</title>
    <desc id="desc">上半部分用 HBM 和片上计算两条泳道展示标准 Attention：完整分数矩阵 S 写入 HBM、读回片上，完整权重矩阵 P 再写入 HBM、读回片上，共四次
        N 乘 N 中间矩阵跨层传输。下半部分展示 FlashAttention：Q K V 数据块从 HBM 搬到片上后，局部分数、Online Softmax
        和输出累积均留在片上，只把最终输出写回 HBM，不传输完整 S 和 P。</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto">
            <path d="M0 0 L10 5 L0 10 Z" fill="#111111" />
        </marker>
        <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto">
            <path d="M0 0 L10 5 L0 10 Z" fill="#B42318" />
        </marker>
        <style>
            text { font-family: Helvetica Neue, Segoe UI, sans-serif; letter-spacing: 0; }
            .title { font-size: 30px; font-weight: 800; fill: #111111; }
            .subtitle { font-size: 17px; fill: #333333; }
            .heading { font-size: 21px; font-weight: 800; fill: #111111; }
            .label { font-size: 17px; font-weight: 700; fill: #111111; }
            .body { font-size: 15px; fill: #333333; }
            .small { font-size: 14px; fill: #444444; }
            .hot-text { font-size: 14px; font-weight: 700; fill: #B42318; }
            .panel { fill: #F4F4F4; stroke: #111111; stroke-width: 3; }
            .lane-hbm { fill: #F2D9D8; stroke: #111111; stroke-width: 2.5; }
            .lane-chip { fill: #DCEBDF; stroke: #111111; stroke-width: 2.5; }
            .memory { fill: #FFFFFF; stroke: #111111; stroke-width: 2; }
            .compute { fill: #FFFFFF; stroke: #111111; stroke-width: 2; }
            .state { fill: #DDE0F1; stroke: #111111; stroke-width: 2; }
            .arrow { fill: none; stroke: #111111; stroke-width: 2.5; marker-end: url(#arrow); }
            .hot-arrow { fill: none; stroke: #B42318; stroke-width: 3.5; marker-end:
            url(#arrow-hot); }
            .local-arrow { fill: none; stroke: #111111; stroke-width: 2.5; marker-end: url(#arrow);
            }
        </style>
    </defs>

    <rect width="1200" height="720" fill="#FFFFFF" />
    <text x="600" y="43" text-anchor="middle" class="title">差别不在算不算 S/P，而在 S/P 是否跨越 HBM</text>
    <text x="600" y="73" text-anchor="middle" class="subtitle">红色箭头表示完整 N × N 中间矩阵的显存往返</text>

    <rect x="35" y="103" width="1130" height="253" rx="3" class="panel" />
    <text x="58" y="135" class="heading">标准 Attention：每个算子之间都把完整中间结果落到 HBM</text>

    <rect x="58" y="153" width="1084" height="70" rx="3" class="lane-hbm" />
    <text x="76" y="181" class="label">HBM</text>
    <text x="76" y="203" class="small">大容量</text>
    <rect x="142" y="167" width="112" height="42" rx="3" class="memory" />
    <text x="198" y="193" text-anchor="middle" class="label">Q / K</text>
    <rect x="334" y="167" width="112" height="42" rx="3" class="memory" />
    <text x="390" y="185" text-anchor="middle" class="label">S</text>
    <text x="390" y="202" text-anchor="middle" class="small">N × N</text>
    <rect x="594" y="167" width="112" height="42" rx="3" class="memory" />
    <text x="650" y="185" text-anchor="middle" class="label">P</text>
    <text x="650" y="202" text-anchor="middle" class="small">N × N</text>
    <rect x="770" y="167" width="90" height="42" rx="3" class="memory" />
    <text x="815" y="193" text-anchor="middle" class="label">V</text>
    <rect x="1013" y="167" width="90" height="42" rx="3" class="memory" />
    <text x="1058" y="193" text-anchor="middle" class="label">O</text>

    <rect x="58" y="258" width="1084" height="75" rx="3" class="lane-chip" />
    <text x="76" y="287" class="label">片上</text>
    <text x="76" y="309" class="small">计算快</text>
    <rect x="194" y="273" width="130" height="44" rx="3" class="compute" />
    <text x="259" y="301" text-anchor="middle" class="label">Q × Kᵀ</text>
    <rect x="454" y="273" width="130" height="44" rx="3" class="compute" />
    <text x="519" y="301" text-anchor="middle" class="label">Softmax</text>
    <rect x="864" y="273" width="130" height="44" rx="3" class="compute" />
    <text x="929" y="301" text-anchor="middle" class="label">P × V</text>

    <path d="M198 216 L236 267" class="arrow" />
    <path d="M289 267 L365 216" class="hot-arrow" />
    <text x="313" y="239" text-anchor="middle" class="hot-text">写 S</text>
    <path d="M415 216 L493 267" class="hot-arrow" />
    <text x="464" y="239" text-anchor="middle" class="hot-text">读 S</text>
    <path d="M548 267 L624 216" class="hot-arrow" />
    <text x="575" y="239" text-anchor="middle" class="hot-text">写 P</text>
    <path d="M676 216 L900 267" class="hot-arrow" />
    <text x="765" y="239" text-anchor="middle" class="hot-text">读 P</text>
    <path d="M815 216 L920 267" class="arrow" />
    <path d="M960 267 L1036 216" class="arrow" />
    <text x="1122" y="239" text-anchor="end" class="hot-text">4 次 N × N 跨层传输</text>

    <rect x="35" y="378" width="1130" height="255" rx="3" class="panel" />
    <text x="58" y="410" class="heading">FlashAttention：输入 tile 搬上片后，S/P tile 在片上产生并立即消费</text>

    <rect x="58" y="428" width="1084" height="70" rx="3" class="lane-hbm" />
    <text x="76" y="456" class="label">HBM</text>
    <text x="76" y="478" class="small">大容量</text>
    <rect x="142" y="442" width="166" height="42" rx="3" class="memory" />
    <text x="225" y="468" text-anchor="middle" class="label">Q / K / V tiles</text>
    <text x="600" y="469" text-anchor="middle" class="hot-text">0 次完整 S/P 跨层传输</text>
    <rect x="1013" y="442" width="90" height="42" rx="3" class="memory" />
    <text x="1058" y="468" text-anchor="middle" class="label">O</text>

    <rect x="58" y="533" width="1084" height="78" rx="3" class="lane-chip" />
    <text x="76" y="562" class="label">片上</text>
    <text x="76" y="584" class="small">反复复用</text>
    <rect x="194" y="549" width="150" height="46" rx="3" class="compute" />
    <text x="269" y="577" text-anchor="middle" class="label">局部 S tile</text>
    <rect x="424" y="549" width="170" height="46" rx="3" class="compute" />
    <text x="509" y="577" text-anchor="middle" class="label">Online Softmax</text>
    <rect x="674" y="549" width="180" height="46" rx="3" class="state" />
    <text x="764" y="568" text-anchor="middle" class="label">累计 m、ℓ、u</text>
    <text x="764" y="588" text-anchor="middle" class="small">只保留行状态</text>
    <path d="M350 572 H414" class="local-arrow" />
    <path d="M600 572 H664" class="local-arrow" />
    <path d="M225 491 L249 542" class="arrow" />
    <path d="M854 572 L1037 491" class="arrow" />
    <text x="947" y="536" text-anchor="middle" class="body">最终 O 写回</text>

    <text x="600" y="662" text-anchor="middle" class="body">K/V tile 可能因不同 Q tile 被再次读取；省掉的是完整 S/P
        的四次显存往返</text>
    <text x="600" y="697" text-anchor="middle" class="label">同样计算精确 Attention，改变的是中间数据的存放位置和生命周期</text>
</svg>