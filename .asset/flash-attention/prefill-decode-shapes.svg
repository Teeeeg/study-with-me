<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"
    aria-labelledby="title desc">
    <title id="title">Prefill 与 Decode 的注意力形状</title>
    <desc id="desc">左侧以 The、cat、sat、down 四个示意 token 展示 Prefill 的四行四列因果分数矩阵。右侧处理新 token now，只有一行
        query，却要关注四个历史位置和 now 自身共五个 key。KV Cache 不会被 FlashAttention 删除，Decode 仍要读取可见的历史 K/V。</desc>
    <defs>
        <pattern id="masked" width="9" height="9" patternUnits="userSpaceOnUse">
            <rect width="9" height="9" fill="#EEEEEE" />
            <path d="M-2 2 L2 -2 M0 9 L9 0 M7 11 L11 7" stroke="#CCCCCC" stroke-width="1.5" />
        </pattern>
        <style>
            text { font-family: Helvetica Neue, Segoe UI, sans-serif; letter-spacing: 0; }
            .title { font-size: 30px; font-weight: 800; fill: #111111; }
            .subtitle { font-size: 17px; fill: #333333; }
            .heading { font-size: 21px; font-weight: 800; fill: #111111; }
            .label { font-size: 18px; font-weight: 700; fill: #111111; }
            .body { font-size: 16px; fill: #333333; }
            .small { font-size: 15px; fill: #444444; }
            .panel { fill: #F4F4F4; stroke: #111111; stroke-width: 3; }
        </style>
    </defs>
    <rect width="1200" height="650" fill="#FFFFFF" />
    <text x="600" y="46" text-anchor="middle" class="title">Prefill 是多行对照表，Decode 常是一条长行</text>
    <text x="600" y="77" text-anchor="middle" class="subtitle">逻辑分数形状为 Nq × Nkv；不能把两种负载的收益直接等同</text>

    <rect x="40" y="113" width="538" height="472" rx="3" class="panel" />
    <text x="64" y="150" class="heading">Prefill：一次处理多行 Q</text>
    <text x="64" y="179" class="body">Prompt = The cat sat down</text>
    <text x="322" y="215" text-anchor="middle" class="body">K / V：4 个位置</text>
    <text x="214" y="246" text-anchor="middle" class="label">The</text>
    <text x="286" y="246" text-anchor="middle" class="label">cat</text>
    <text x="358" y="246" text-anchor="middle" class="label">sat</text>
    <text x="430" y="246" text-anchor="middle" class="label">down</text>
    <text x="156" y="295" text-anchor="end" class="label">The</text>
    <text x="156" y="353" text-anchor="end" class="label">cat</text>
    <text x="156" y="411" text-anchor="end" class="label">sat</text>
    <text x="156" y="469" text-anchor="end" class="label">down</text>
    <text x="69" y="354" class="body">Q</text>
    <text x="61" y="380" class="body">4 行</text>
    <rect x="178" y="258" width="288" height="232" fill="#DDE0F1" stroke="#111111"
        stroke-width="2.5" />
    <path d="M250 258 H466 V432 H394 V374 H322 V316 H250 Z" fill="url(#masked)" />
    <path d="M250 258 V490 M322 258 V490 M394 258 V490 M178 316 H466 M178 374 H466 M178 432 H466"
        fill="none" stroke="#111111" stroke-width="1.5" />
    <text x="64" y="529" class="label">多个 Q 复用 K/V，有较多矩阵乘并行</text>
    <text x="64" y="557" class="small">阴影位置被因果掩码排除；不物化完整分数表</text>

    <rect x="622" y="113" width="538" height="472" rx="3" class="panel" />
    <text x="646" y="150" class="heading">Decode：一个新 Q，长 K/V</text>
    <text x="646" y="179" class="body">正在处理已生成的 now</text>
    <text x="896" y="252" text-anchor="middle" class="body">4 个历史位置 + 当前 now</text>
    <path d="M737 279 V270 H1033 V279" fill="none" stroke="#111111" stroke-width="2" />
    <text x="885" y="301" text-anchor="middle" class="small">历史 KV Cache</text>
    <text x="1070" y="301" text-anchor="middle" class="small">新 KV</text>
    <text x="774" y="339" text-anchor="middle" class="label">The</text>
    <text x="848" y="339" text-anchor="middle" class="label">cat</text>
    <text x="922" y="339" text-anchor="middle" class="label">sat</text>
    <text x="996" y="339" text-anchor="middle" class="label">down</text>
    <text x="1070" y="339" text-anchor="middle" class="label">now</text>
    <text x="714" y="389" text-anchor="end" class="label">now</text>
    <text x="677" y="418" text-anchor="middle" class="small">Q：1 行</text>
    <rect x="737" y="353" width="296" height="58" fill="#DDE0F1" />
    <rect x="1033" y="353" width="74" height="58" fill="#DCEBDF" />
    <rect x="737" y="353" width="370" height="58" fill="none" stroke="#111111" stroke-width="2.5" />
    <path d="M811 353 V411 M885 353 V411 M959 353 V411 M1033 353 V411" fill="none" stroke="#111111"
        stroke-width="1.5" />
    <text x="922" y="452" text-anchor="middle" class="body">每一步仍要读取全部可见 K/V</text>
    <text x="646" y="529" class="label">更关注 KV 读取速度与足够的并行任务</text>
    <text x="646" y="557" class="small">普通逐 token Decode；推测解码等可能有多行 Q</text>
    <text x="600" y="625" text-anchor="middle" class="label">FlashAttention 不消除 KV
        Cache，也不自动跳过仍然可见的历史 token</text>
</svg>