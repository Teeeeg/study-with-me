<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"
    aria-labelledby="title desc">
    <title id="title">Hopper 异步流水线：哪些工作可以重叠</title>
    <desc id="desc">同一块内仍需先加载 K/V，再计算 QK 转置，再做 Softmax，最后乘 V。跨块时，TMA 可以在消费者计算块 A 时加载块
        B。一个局部计算窗口中，也可以让 Tensor Cores 计算块 B 的分数，同时让其他执行单元处理已就绪的块 A 的 Softmax。时间段仅为依赖示意，不代表测量值。</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto">
            <path d="M0 0 L10 5 L0 10 Z" fill="#111111" />
        </marker>
        <style>
            text { font-family: Helvetica Neue, Segoe UI, sans-serif; letter-spacing: 0; }
            .title { font-size: 30px; font-weight: 800; fill: #111111; }
            .subtitle { font-size: 17px; fill: #333333; }
            .heading { font-size: 20px; font-weight: 800; fill: #111111; }
            .label { font-size: 18px; font-weight: 700; fill: #111111; }
            .body { font-size: 16px; fill: #333333; }
            .small { font-size: 15px; fill: #444444; }
            .panel { fill: #F4F4F4; stroke: #111111; stroke-width: 3; }
            .memory { fill: #DDE0F1; stroke: #111111; stroke-width: 2.5; }
            .matmul { fill: #F2E6D8; stroke: #111111; stroke-width: 2.5; }
            .softmax { fill: #DCEBDF; stroke: #111111; stroke-width: 2.5; }
            .arrow { fill: none; stroke: #111111; stroke-width: 3; marker-end: url(#arrow); }
        </style>
    </defs>
    <rect width="1200" height="700" fill="#FFFFFF" />
    <text x="600" y="46" text-anchor="middle" class="title">FA3：同一块守依赖，不同块交错执行</text>
    <text x="600" y="77" text-anchor="middle" class="subtitle">异步是给独立工作留出重叠空间，不是让依赖凭空消失</text>

    <text x="42" y="124" class="heading">同一块</text>
    <text x="42" y="151" class="body">依赖顺序不变</text>
    <rect x="234" y="110" width="192" height="58" rx="3" class="memory" />
    <text x="330" y="146" text-anchor="middle" class="label">搬运 K/V A</text>
    <path d="M436 139 H462" class="arrow" />
    <rect x="474" y="110" width="192" height="58" rx="3" class="matmul" />
    <text x="570" y="146" text-anchor="middle" class="label">Q × K_Aᵀ</text>
    <path d="M676 139 H702" class="arrow" />
    <rect x="714" y="110" width="192" height="58" rx="3" class="softmax" />
    <text x="810" y="146" text-anchor="middle" class="label">Softmax A</text>
    <path d="M916 139 H942" class="arrow" />
    <rect x="954" y="110" width="206" height="58" rx="3" class="matmul" />
    <text x="1057" y="146" text-anchor="middle" class="label">权重 A × V_A</text>

    <rect x="40" y="202" width="1120" height="228" rx="3" class="panel" />
    <text x="64" y="237" class="heading">① 搬运与计算重叠：算 A 时，准备 B</text>
    <text x="64" y="292" class="label">TMA / 生产者</text>
    <text x="64" y="358" class="label">计算 / 消费者</text>
    <path d="M454 259 V386 M674 259 V386 M894 259 V386" stroke="#AAAAAA" stroke-width="1.5"
        stroke-dasharray="5 6" />
    <rect x="244" y="264" width="196" height="44" rx="3" class="memory" />
    <text x="342" y="292" text-anchor="middle" class="body">搬运块 A</text>
    <rect x="464" y="264" width="196" height="44" rx="3" class="memory" />
    <text x="562" y="292" text-anchor="middle" class="body">搬运块 B</text>
    <rect x="684" y="264" width="196" height="44" rx="3" class="memory" />
    <text x="782" y="292" text-anchor="middle" class="body">搬运块 C</text>
    <rect x="464" y="330" width="196" height="44" rx="3" class="matmul" />
    <text x="562" y="358" text-anchor="middle" class="body">计算块 A</text>
    <rect x="684" y="330" width="196" height="44" rx="3" class="matmul" />
    <text x="782" y="358" text-anchor="middle" class="body">计算块 B</text>
    <rect x="904" y="330" width="232" height="44" rx="3" class="matmul" />
    <text x="1020" y="358" text-anchor="middle" class="body">计算块 C</text>
    <path d="M244 404 H1104" class="arrow" />
    <text x="1123" y="410" class="small">时间</text>

    <rect x="40" y="458" width="1120" height="180" rx="3" class="panel" />
    <text x="64" y="493" class="heading">② 矩阵乘与 Softmax 重叠：A 的分数已就绪时</text>
    <text x="64" y="538" class="label">Tensor Cores / WGMMA</text>
    <text x="64" y="598" class="label">标量 / 特殊函数单元</text>
    <rect x="360" y="513" width="650" height="42" rx="3" class="matmul" />
    <text x="685" y="540" text-anchor="middle" class="body">计算块 B 的 QKᵀ</text>
    <rect x="360" y="573" width="650" height="42" rx="3" class="softmax" />
    <text x="685" y="600" text-anchor="middle" class="body">处理块 A 的 Online Softmax</text>
    <path d="M1035 517 H1054 V611 H1035" fill="none" stroke="#111111" stroke-width="2.5" />
    <text x="1080" y="562" class="body">重叠</text>
    <text x="1080" y="585" class="body">窗口</text>
    <text x="600" y="678" text-anchor="middle" class="small">
        示意不按耗时比例；仍要等待数据就绪、防止缓冲覆盖，并为累计状态保留正确的更新顺序</text>
</svg>