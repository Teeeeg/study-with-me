<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"
    aria-labelledby="title desc">
    <title id="title">PagedAttention 从逻辑 token 到物理 KV Block 的地址映射</title>
    <desc id="desc">十个连续 token 被切成三个逻辑块，经 block table 分别映射到不连续的物理块 7、19 和 3；token 9 最终定位到物理块 3 的
        slot 1。</desc>
    <defs>
        <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto">
            <path d="M0 0 L10 5 L0 10 Z" fill="#0071E3" />
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto">
            <path d="M0 0 L10 5 L0 10 Z" fill="#167333" />
        </marker>
        <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto">
            <path d="M0 0 L10 5 L0 10 Z" fill="#8A4B00" />
        </marker>
        <style>
      text { font-family: Avenir Next, Segoe UI, sans-serif; letter-spacing: 0; }
      .title { font-size: 30px; font-weight: 700; fill: #172033; }
      .subtitle { font-size: 16px; fill: #526070; }
      .heading { font-size: 19px; font-weight: 700; fill: #24324a; }
      .label { font-size: 15px; font-weight: 700; fill: #334155; }
      .body { font-size: 14px; fill: #334155; }
      .small { font-size: 13px; fill: #6E6E73; }
      .inverse { font-size: 14px; font-weight: 700; fill: #ffffff; }
      .panel { fill: #ffffff; stroke: #D2D2D7; stroke-width: 1.5; }
      .logical0 { fill: #dbeafe; stroke: #4f8fce; stroke-width: 1.5; }
      .logical1 { fill: #dcfce7; stroke: #43a56c; stroke-width: 1.5; }
      .logical2 { fill: #FFF4E5; stroke: #d2a532; stroke-width: 1.5; }
      .empty { fill: #F5F5F7; stroke: #D2D2D7; stroke-width: 1.3; stroke-dasharray: 4 3; }
      .physical { fill: #eef2f7; stroke: #94a3b8; stroke-width: 1.3; }
      .blueArrow { fill: none; stroke: #0071E3; stroke-width: 2.5; marker-end: url(#arrowBlue); }
      .greenArrow { fill: none; stroke: #167333; stroke-width: 2.5; marker-end: url(#arrowGreen); }
      .goldArrow { fill: none; stroke: #8A4B00; stroke-width: 2.5; marker-end: url(#arrowGold); }
    </style>
    </defs>
  <rect width="100%" height="100%" fill="#F5F5F7"/>

    <rect width="1200" height="780" fill="#F5F5F7" />
    <text x="600" y="48" text-anchor="middle" class="title">逻辑连续，物理分散：Block Table 完成地址翻译</text>
    <text x="600" y="78" text-anchor="middle" class="subtitle">示例：block size = 4，请求已有 10 个 token，只分配
        3 个物理 KV blocks</text>

    <rect x="50" y="108" width="1100" height="128" rx="8" class="panel" />
    <text x="78" y="140" class="heading">1 · 连续 token 被切成逻辑块</text>
    <text x="78" y="190" class="label">逻辑序列</text>
    <g transform="translate(210 158)">
        <rect x="0" y="0" width="72" height="48" rx="5" class="logical0" />
        <rect x="72" y="0" width="72" height="48" rx="5" class="logical0" />
        <rect x="144" y="0" width="72" height="48" rx="5" class="logical0" />
        <rect x="216" y="0" width="72" height="48" rx="5" class="logical0" />
        <rect x="310" y="0" width="72" height="48" rx="5" class="logical1" />
        <rect x="382" y="0" width="72" height="48" rx="5" class="logical1" />
        <rect x="454" y="0" width="72" height="48" rx="5" class="logical1" />
        <rect x="526" y="0" width="72" height="48" rx="5" class="logical1" />
        <rect x="620" y="0" width="72" height="48" rx="5" class="logical2" />
        <rect x="692" y="0" width="72" height="48" rx="5" class="logical2" />
        <rect x="764" y="0" width="72" height="48" rx="5" class="empty" />
        <rect x="836" y="0" width="72" height="48" rx="5" class="empty" />
        <text x="36" y="30" text-anchor="middle" class="body">t0</text>
        <text x="108" y="30" text-anchor="middle" class="body">t1</text>
        <text x="180" y="30" text-anchor="middle" class="body">t2</text>
        <text x="252" y="30" text-anchor="middle" class="body">t3</text>
        <text x="346" y="30" text-anchor="middle" class="body">t4</text>
        <text x="418" y="30" text-anchor="middle" class="body">t5</text>
        <text x="490" y="30" text-anchor="middle" class="body">t6</text>
        <text x="562" y="30" text-anchor="middle" class="body">t7</text>
        <text x="656" y="30" text-anchor="middle" class="body">t8</text>
        <text x="728" y="30" text-anchor="middle" class="body">t9</text>
        <text x="800" y="30" text-anchor="middle" class="small">空</text>
        <text x="872" y="30" text-anchor="middle" class="small">空</text>
        <text x="144" y="70" text-anchor="middle" class="small">logical block 0</text>
        <text x="454" y="70" text-anchor="middle" class="small">logical block 1</text>
        <text x="764" y="70" text-anchor="middle" class="small">logical block 2</text>
    </g>

    <rect x="50" y="260" width="1100" height="150" rx="8" class="panel" />
    <text x="78" y="294" class="heading">2 · 每个请求维护自己的 Block Table</text>
    <g transform="translate(250 315)">
        <rect x="0" y="0" width="210" height="62" rx="7" class="logical0" />
        <text x="105" y="25" text-anchor="middle" class="label">logical block 0</text>
        <text x="105" y="48" text-anchor="middle" class="body">physical block 7</text>
        <rect x="245" y="0" width="210" height="62" rx="7" class="logical1" />
        <text x="350" y="25" text-anchor="middle" class="label">logical block 1</text>
        <text x="350" y="48" text-anchor="middle" class="body">physical block 19</text>
        <rect x="490" y="0" width="210" height="62" rx="7" class="logical2" />
        <text x="595" y="25" text-anchor="middle" class="label">logical block 2</text>
        <text x="595" y="48" text-anchor="middle" class="body">physical block 3</text>
    </g>

    <rect x="50" y="438" width="1100" height="190" rx="8" class="panel" />
    <text x="78" y="472" class="heading">3 · 物理块来自同一个池，不必彼此相邻</text>
    <path d="M355 377 C355 430 850 430 850 488" class="blueArrow" />
    <path d="M600 377 C600 438 1054 448 1054 570" class="greenArrow" />
    <path d="M845 377 C845 430 442 430 442 488" class="goldArrow" />
    <g transform="translate(90 492)">
        <rect x="0" y="0" width="92" height="50" rx="5" class="physical" />
        <text x="46" y="31" text-anchor="middle" class="body">#0</text>
        <rect x="102" y="0" width="92" height="50" rx="5" class="physical" />
        <text x="148" y="31" text-anchor="middle" class="body">#1</text>
        <rect x="204" y="0" width="92" height="50" rx="5" class="physical" />
        <text x="250" y="31" text-anchor="middle" class="body">#2</text>
        <rect x="306" y="0" width="92" height="50" rx="5" class="logical2" />
        <text x="352" y="31" text-anchor="middle" class="label">#3</text>
        <rect x="408" y="0" width="92" height="50" rx="5" class="physical" />
        <text x="454" y="31" text-anchor="middle" class="body">#4</text>
        <rect x="510" y="0" width="92" height="50" rx="5" class="physical" />
        <text x="556" y="31" text-anchor="middle" class="body">#5</text>
        <rect x="612" y="0" width="92" height="50" rx="5" class="physical" />
        <text x="658" y="31" text-anchor="middle" class="body">#6</text>
        <rect x="714" y="0" width="92" height="50" rx="5" class="logical0" />
        <text x="760" y="31" text-anchor="middle" class="label">#7</text>
        <rect x="816" y="0" width="92" height="50" rx="5" class="physical" />
        <text x="862" y="31" text-anchor="middle" class="body">#8</text>
        <rect x="918" y="0" width="92" height="50" rx="5" class="physical" />
        <text x="964" y="31" text-anchor="middle" class="body">#9</text>

        <rect x="0" y="82" width="92" height="50" rx="5" class="physical" />
        <text x="46" y="113" text-anchor="middle" class="body">#10</text>
        <rect x="102" y="82" width="92" height="50" rx="5" class="physical" />
        <text x="148" y="113" text-anchor="middle" class="body">#11</text>
        <rect x="204" y="82" width="92" height="50" rx="5" class="physical" />
        <text x="250" y="113" text-anchor="middle" class="body">#12</text>
        <rect x="306" y="82" width="92" height="50" rx="5" class="physical" />
        <text x="352" y="113" text-anchor="middle" class="body">#13</text>
        <rect x="408" y="82" width="92" height="50" rx="5" class="physical" />
        <text x="454" y="113" text-anchor="middle" class="body">#14</text>
        <rect x="510" y="82" width="92" height="50" rx="5" class="physical" />
        <text x="556" y="113" text-anchor="middle" class="body">#15</text>
        <rect x="612" y="82" width="92" height="50" rx="5" class="physical" />
        <text x="658" y="113" text-anchor="middle" class="body">#16</text>
        <rect x="714" y="82" width="92" height="50" rx="5" class="physical" />
        <text x="760" y="113" text-anchor="middle" class="body">#17</text>
        <rect x="816" y="82" width="92" height="50" rx="5" class="physical" />
        <text x="862" y="113" text-anchor="middle" class="body">#18</text>
        <rect x="918" y="82" width="92" height="50" rx="5" class="logical1" />
        <text x="964" y="113" text-anchor="middle" class="label">#19</text>
    </g>

    <rect x="160" y="658" width="880" height="78" rx="7" fill="#EAF3FC" stroke="#EAF3FC" />
    <text x="600" y="685" text-anchor="middle" class="label">定位 token 9</text>
    <text x="600" y="711" text-anchor="middle" class="body">logical block = 9 ÷ 4 = 2 → offset = 9
        mod 4 = 1 → table[2] = 3 → physical block #3 / slot 1</text>
    <style id="editorial-diagram-style">
        text { font-family: Helvetica Neue, Segoe UI, sans-serif; letter-spacing: 0; }
        .title { fill: #111111 !important; font-weight: 800 !important; }
        .subtitle, .small { fill: #333333 !important; }
        .inverse { fill: #111111 !important; }
        rect { rx: 3px; }
        .panel { fill: #F4F4F4 !important; stroke: #111111 !important; stroke-width: 3 !important; }
        .logical0 { fill: #DDE0F1 !important; stroke: #111111 !important; stroke-width: 2.5 !important; }
        .logical1 { fill: #DCEBDF !important; stroke: #111111 !important; stroke-width: 2.5 !important; }
        .logical2 { fill: #F2E6D8 !important; stroke: #111111 !important; stroke-width: 2.5 !important; }
        .physical, .empty { stroke: #111111 !important; stroke-width: 2.5 !important; }
        .blueArrow, .greenArrow, .goldArrow { stroke: #111111 !important; stroke-width: 3 !important; }
        marker path { fill: #111111 !important; }
        [fill="#F5F5F7" i] { fill: #FFFFFF !important; }
    </style>
</svg>