<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img"
    aria-labelledby="title desc">
    <title id="title">Automatic Prefix Caching 的逐块命中过程</title>
    <desc id="desc">请求 A 和 B 的第一个完整 block 相同，因此共享物理 block 12。第二个 block 的最后一个 token 不同，哈希链从此分歧，请求 B
        需要重新计算。未填满的尾块不参与前缀命中。</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto">
            <path d="M0 0 L10 5 L0 10 Z" fill="#111111" />
        </marker>
        <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto">
            <path d="M0 0 L10 5 L0 10 Z" fill="#111111" />
        </marker>
        <style>
    text { font-family: Helvetica Neue, Segoe UI, sans-serif; letter-spacing: 0; }
    .title { font-size: 34px; font-weight: 800; fill: #111111; }
    .subtitle { font-size: 17px; fill: #333333; }
    .heading { font-size: 20px; font-weight: 800; fill: #111111; }
    .label { font-size: 16px; font-weight: 750; fill: #111111; }
    .body { font-size: 15px; fill: #111111; }
    .small { font-size: 13px; fill: #333333; }
    .panel { fill: #F4F4F4; stroke: #111111; stroke-width: 3.5; }
    .shared { fill: #DDE0F1; stroke: #111111; stroke-width: 3; }
    .requestA { fill: #DCEBDF; stroke: #111111; stroke-width: 3; }
    .requestB { fill: #E9D9EB; stroke: #111111; stroke-width: 3; }
    .empty { fill: #FFFFFF; stroke: #666666; stroke-width: 2; stroke-dasharray: 7 5; }
    .stop { fill: #F2D9D8; stroke: #111111; stroke-width: 3; }
    .arrow { fill: none; stroke: #111111; stroke-width: 3.5; marker-end: url(#arrow); }
    .shareArrow { fill: none; stroke: #111111; stroke-width: 4; marker-end: url(#arrowBlue); }
    </style>
    </defs>

    <rect width="1200" height="550" fill="#FFFFFF" />
    <text x="600" y="47" text-anchor="middle" class="title">前缀缓存：从开头逐块匹配，到第一个分歧为止</text>
    <text x="600" y="77" text-anchor="middle" class="subtitle">block_size = 4 · 只有连续命中的完整 block 才能复用</text>

    <rect x="48" y="106" width="1104" height="328" rx="2" class="panel" />
    <text x="72" y="141" class="heading">逐块比较两个请求</text>

    <text x="72" y="198" class="label">请求 A</text>
    <rect x="170" y="164" width="230" height="58" rx="6" class="shared" />
    <text x="285" y="188" text-anchor="middle" class="label">[A B C D]</text>
    <text x="285" y="209" text-anchor="middle" class="small">完整 · hash H₀</text>
    <rect x="425" y="164" width="230" height="58" rx="6" class="requestA" />
    <text x="540" y="188" text-anchor="middle" class="label">[E F G H]</text>
    <text x="540" y="209" text-anchor="middle" class="small">完整 · hash H₁ᴬ</text>
    <rect x="680" y="164" width="230" height="58" rx="6" class="empty" />
    <text x="795" y="188" text-anchor="middle" class="label">[I J _ _]</text>
    <text x="795" y="209" text-anchor="middle" class="small">未填满尾块</text>

    <text x="72" y="282" class="label">请求 B</text>
    <rect x="170" y="248" width="230" height="58" rx="6" class="shared" />
    <text x="285" y="272" text-anchor="middle" class="label">[A B C D]</text>
    <text x="285" y="293" text-anchor="middle" class="small">完整 · hash H₀</text>
    <rect x="425" y="248" width="230" height="58" rx="6" class="requestB" />
    <text x="540" y="272" text-anchor="middle" class="label">[E F G X]</text>
    <text x="540" y="293" text-anchor="middle" class="small">完整 · hash H₁ᴮ</text>
    <rect x="680" y="248" width="230" height="58" rx="6" class="empty" />
    <text x="795" y="282" text-anchor="middle" class="small">后续 token</text>

    <rect x="158" y="151" width="254" height="168" rx="2" fill="none" stroke="#5367C7"
        stroke-width="4" />
    <path d="M285 319 V347" class="shareArrow" />
    <rect x="160" y="347" width="250" height="66" rx="7" class="shared" />
    <text x="285" y="374" text-anchor="middle" class="label">命中：共享物理 block #12</text>
    <text x="285" y="397" text-anchor="middle" class="small">只存一份 · ref_count = 2</text>

    <path d="M540 306 V347" class="arrow" />
    <rect x="425" y="347" width="230" height="66" rx="7" class="stop" />
    <text x="540" y="374" text-anchor="middle" class="label">停止：H₁ᴬ ≠ H₁ᴮ</text>
    <text x="540" y="397" text-anchor="middle" class="small">B 从第二块开始 prefill</text>

    <path d="M795 306 V347" class="arrow" />
    <rect x="680" y="347" width="230" height="66" rx="7" class="empty" />
    <text x="795" y="374" text-anchor="middle" class="label">尾块不参与命中</text>
    <text x="795" y="397" text-anchor="middle" class="small">填满后才可加入缓存索引</text>

    <rect x="930" y="164" width="190" height="142" rx="2" fill="#DDE0F1" stroke="#111111"
        stroke-width="3" />
    <text x="1025" y="195" text-anchor="middle" class="label">链式哈希</text>
    <text x="1025" y="224" text-anchor="middle" class="body">H₀ 相同</text>
    <text x="1025" y="249" text-anchor="middle" class="body">↓</text>
    <text x="1025" y="274" text-anchor="middle" class="body">H₁ 从此分歧</text>
    <text x="1025" y="295" text-anchor="middle" class="small">后续不能重新命中</text>

    <rect x="130" y="463" width="940" height="52" rx="2" fill="#FFFFFF" stroke="#111111"
        stroke-width="2.5" />
    <text x="600" y="495" text-anchor="middle" class="body">判断的不只是“当前块是否相同”，而是“从序列开头到当前块的完整前缀是否相同”</text>
</svg>