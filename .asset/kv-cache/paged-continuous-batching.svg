<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"
    aria-labelledby="title desc">
    <title id="title">Continuous batching 与 PagedAttention 协同</title>
    <desc id="desc">第一个调度步包含请求 A、B、C。A 完成后，其物理块被释放并分配给新请求 D，B 和 C 的缓存无需移动。调度过程依次检查 token budget 和
        block budget，再交给 worker 执行。</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto">
            <path d="M0 0 L10 5 L0 10 Z" fill="#64748B" />
        </marker>
        <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto">
            <path d="M0 0 L10 5 L0 10 Z" fill="#0071E3" />
        </marker>
        <style>
      text { font-family: Avenir Next, Segoe UI, sans-serif; letter-spacing: 0; }
      .title { font-size: 30px; font-weight: 700; fill: #172033; }
      .subtitle { font-size: 16px; fill: #526070; }
      .heading { font-size: 19px; font-weight: 700; fill: #24324A; }
      .label { font-size: 15px; font-weight: 700; fill: #334155; }
      .body { font-size: 14px; fill: #475569; }
      .small { font-size: 13px; fill: #64748B; }
      .inverse { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
      .panel { fill: #FFFFFF; stroke: #D2D2D7; stroke-width: 1.5; }
      .batch { fill: #EEF5FC; stroke: #7AA7D1; stroke-width: 1.5; }
      .requestA { fill: #C94F57; stroke: #A43A42; stroke-width: 1.5; }
      .requestB { fill: #277DA1; stroke: #1C617E; stroke-width: 1.5; }
      .requestC { fill: #4D908E; stroke: #37716F; stroke-width: 1.5; }
      .requestD { fill: #E09F3E; stroke: #B77A23; stroke-width: 1.5; }
      .free { fill: #F1F3F5; stroke: #AAB2BD; stroke-width: 1.3; stroke-dasharray: 5 4; }
      .budget { fill: #FFF4E5; stroke: #D2A532; stroke-width: 1.5; }
      .worker { fill: #E8F7ED; stroke: #43A56C; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #64748B; stroke-width: 2.2; marker-end: url(#arrow); }
      .flow { fill: none; stroke: #0071E3; stroke-width: 2.5; marker-end: url(#arrowBlue); }
      .reuse { fill: none; stroke: #E09F3E; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#arrow); }
    </style>
    </defs>

    <rect width="1200" height="720" fill="#F5F5F7" />
    <text x="600" y="48" text-anchor="middle" class="title">请求换了，已有 KV Cache 不必搬家</text>
    <text x="600" y="78" text-anchor="middle" class="subtitle">Continuous batching
        动态换入请求，PagedAttention 动态回收和复用物理 block</text>

    <rect x="46" y="108" width="500" height="380" rx="8" class="panel" />
    <text x="72" y="142" class="heading">Step t：A、B、C 正在执行</text>

    <rect x="72" y="166" width="448" height="76" rx="7" class="batch" />
    <text x="92" y="191" class="label">本轮 batch</text>
    <rect x="208" y="180" width="82" height="44" rx="6" class="requestA" />
    <rect x="306" y="180" width="82" height="44" rx="6" class="requestB" />
    <rect x="404" y="180" width="82" height="44" rx="6" class="requestC" />
    <text x="249" y="208" text-anchor="middle" class="inverse">A</text>
    <text x="347" y="208" text-anchor="middle" class="inverse">B</text>
    <text x="445" y="208" text-anchor="middle" class="inverse">C</text>

    <text x="72" y="282" class="label">物理 KV block 池</text>
    <text x="72" y="305" class="small">同一请求的 block 可以分散存放</text>
    <g transform="translate(72 324)">
        <rect x="0" y="0" width="62" height="54" rx="5" class="requestB" />
        <rect x="70" y="0" width="62" height="54" rx="5" class="requestA" />
        <rect x="140" y="0" width="62" height="54" rx="5" class="requestC" />
        <rect x="210" y="0" width="62" height="54" rx="5" class="requestB" />
        <rect x="280" y="0" width="62" height="54" rx="5" class="requestA" />
        <rect x="350" y="0" width="62" height="54" rx="5" class="free" />
        <text x="31" y="33" text-anchor="middle" class="inverse">B1</text>
        <text x="101" y="33" text-anchor="middle" class="inverse">A1</text>
        <text x="171" y="33" text-anchor="middle" class="inverse">C1</text>
        <text x="241" y="33" text-anchor="middle" class="inverse">B2</text>
        <text x="311" y="33" text-anchor="middle" class="inverse">A2</text>
        <text x="381" y="33" text-anchor="middle" class="small">空闲</text>
    </g>
    <text x="296" y="418" text-anchor="middle" class="body">本轮结束：A 完成，释放 A1、A2</text>
    <rect x="154" y="438" width="284" height="32" rx="5" fill="#FFF0EF" />
    <text x="296" y="459" text-anchor="middle" class="small">等待队列中的 D 可以在下一轮加入</text>

    <path d="M556 296 H636" class="flow" />
    <text x="596" y="271" text-anchor="middle" class="label">重新调度</text>
    <text x="596" y="321" text-anchor="middle" class="small">移除 A · 加入 D</text>

    <rect x="654" y="108" width="500" height="380" rx="8" class="panel" />
    <text x="680" y="142" class="heading">Step t+1：B、C、D 正在执行</text>

    <rect x="680" y="166" width="448" height="76" rx="7" class="batch" />
    <text x="700" y="191" class="label">新 batch</text>
    <rect x="816" y="180" width="82" height="44" rx="6" class="requestB" />
    <rect x="914" y="180" width="82" height="44" rx="6" class="requestC" />
    <rect x="1012" y="180" width="82" height="44" rx="6" class="requestD" />
    <text x="857" y="208" text-anchor="middle" class="inverse">B</text>
    <text x="955" y="208" text-anchor="middle" class="inverse">C</text>
    <text x="1053" y="208" text-anchor="middle" class="inverse">D</text>

    <text x="680" y="282" class="label">同一个物理 KV block 池</text>
    <text x="680" y="305" class="small">B、C 保持原位；D 复用 A 释放的 block</text>
    <g transform="translate(680 324)">
        <rect x="0" y="0" width="62" height="54" rx="5" class="requestB" />
        <rect x="70" y="0" width="62" height="54" rx="5" class="requestD" />
        <rect x="140" y="0" width="62" height="54" rx="5" class="requestC" />
        <rect x="210" y="0" width="62" height="54" rx="5" class="requestB" />
        <rect x="280" y="0" width="62" height="54" rx="5" class="requestD" />
        <rect x="350" y="0" width="62" height="54" rx="5" class="free" />
        <text x="31" y="33" text-anchor="middle" class="inverse">B1</text>
        <text x="101" y="33" text-anchor="middle" class="inverse">D1</text>
        <text x="171" y="33" text-anchor="middle" class="inverse">C1</text>
        <text x="241" y="33" text-anchor="middle" class="inverse">B2</text>
        <text x="311" y="33" text-anchor="middle" class="inverse">D2</text>
        <text x="381" y="33" text-anchor="middle" class="small">空闲</text>
    </g>
    <path d="M781 384 V422 H991 V384" class="reuse" />
    <text x="886" y="446" text-anchor="middle" class="body">只更新 D 的 block table，无需搬移 B、C</text>

    <rect x="46" y="518" width="1108" height="154" rx="8" class="panel" />
    <text x="72" y="551" class="heading">每轮执行前，两种预算都必须满足</text>

    <rect x="102" y="577" width="246" height="68" rx="7" class="budget" />
    <text x="225" y="604" text-anchor="middle" class="label">1 · Scheduler：token budget</text>
    <text x="225" y="627" text-anchor="middle" class="small">本轮为哪些请求计算多少 token？</text>

    <path d="M348 611 H453" class="arrow" />

    <rect x="453" y="577" width="294" height="68" rx="7" class="budget" />
    <text x="600" y="604" text-anchor="middle" class="label">2 · Cache Manager：block budget</text>
    <text x="600" y="627" text-anchor="middle" class="small">是否有足够的 KV slot 可供写入？</text>

    <path d="M747 611 H852" class="arrow" />

    <rect x="852" y="577" width="246" height="68" rx="7" class="worker" />
    <text x="975" y="604" text-anchor="middle" class="label">3 · Worker 执行</text>
    <text x="975" y="627" text-anchor="middle" class="small">按 block table 读取和写入 KV</text>
    <style id="editorial-diagram-style">
        text { font-family: Helvetica Neue, Segoe UI, sans-serif; letter-spacing: 0; }
        .title { fill: #111111 !important; font-weight: 800 !important; }
        .subtitle, .small { fill: #333333 !important; }
        .inverse { fill: #111111 !important; }
        rect { rx: 3px; }
        .panel { fill: #F4F4F4 !important; stroke: #111111 !important; stroke-width: 3 !important; }
        .batch, .requestB { fill: #DDE0F1 !important; stroke: #111111 !important; stroke-width: 2.5 !important; }
        .requestC, .worker { fill: #DCEBDF !important; stroke: #111111 !important; stroke-width: 2.5 !important; }
        .requestD, .budget { fill: #F2E6D8 !important; stroke: #111111 !important; stroke-width: 2.5 !important; }
        .requestA { fill: #F2D9D8 !important; stroke: #111111 !important; stroke-width: 2.5 !important; }
        .arrow, .flow, .reuse { stroke: #111111 !important; stroke-width: 3 !important; }
        marker path { fill: #111111 !important; }
        [fill="#F5F5F7" i] { fill: #FFFFFF !important; }
    </style>
</svg>