<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"
    aria-labelledby="title desc">
    <title id="title">连续预留与 PagedAttention 按需分配对比</title>
    <desc id="desc">连续分配为两个请求各预留 8192 个 token 位置，造成大量空槽；PagedAttention 只按需分配固定大小
        block，将浪费限制在每条序列的最后一个 block。</desc>
    <defs>
        <pattern id="reservedHatch" width="10" height="10" patternUnits="userSpaceOnUse"
            patternTransform="rotate(45)">
            <rect width="10" height="10" fill="#FFF0EF" />
            <line x1="0" y1="0" x2="0" y2="10" stroke="#FF3B30" stroke-width="3" />
        </pattern>
        <pattern id="freeHatch" width="9" height="9" patternUnits="userSpaceOnUse"
            patternTransform="rotate(45)">
            <rect width="9" height="9" fill="#F5F5F7" />
            <line x1="0" y1="0" x2="0" y2="9" stroke="#D2D2D7" stroke-width="2" />
        </pattern>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto">
            <path d="M0 0 L10 5 L0 10 Z" fill="#6E6E73" />
        </marker>
        <style>
      text { font-family: Avenir Next, Segoe UI, sans-serif; letter-spacing: 0; }
      .title { font-size: 30px; font-weight: 700; fill: #172033; }
      .subtitle { font-size: 16px; fill: #526070; }
      .heading { font-size: 20px; font-weight: 700; fill: #24324a; }
      .label { font-size: 15px; font-weight: 700; fill: #334155; }
      .body { font-size: 14px; fill: #334155; }
      .small { font-size: 13px; fill: #6E6E73; }
      .inverse { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .panel { fill: #ffffff; stroke: #D2D2D7; stroke-width: 1.5; }
      .used { fill: #0071E3; stroke: #0071E3; stroke-width: 1.5; }
      .allocated { fill: #dbeafe; stroke: #4f8fce; stroke-width: 1.5; }
      .tail { fill: #FFF4E5; stroke: #d2a532; stroke-width: 1.5; }
      .free { fill: url(#freeHatch); stroke: #94a3b8; stroke-width: 1.3; }
      .waste { fill: url(#reservedHatch); stroke: #e58b8b; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #6E6E73; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    </defs>
  <rect width="100%" height="100%" fill="#F5F5F7"/>

    <rect width="1200" height="720" fill="#F5F5F7" />
    <text x="600" y="48" text-anchor="middle" class="title">连续预留 vs. PagedAttention：显存浪费在哪里</text>
    <text x="600" y="78" text-anchor="middle" class="subtitle">同样服务两个长度未知的请求，分页把“预留最大长度”改成“用到一个
        block，再申请一个”</text>

    <rect x="50" y="105" width="1100" height="240" rx="8" class="panel" />
    <text x="78" y="140" class="heading">连续预留：每个请求先占满最大上下文 8192 slots</text>

    <text x="78" y="199" class="label">请求 A</text>
    <rect x="190" y="170" width="34" height="48" rx="4" class="used" />
    <rect x="224" y="170" width="876" height="48" rx="4" class="waste" />
    <text x="207" y="161" text-anchor="middle" class="small">300</text>
    <text x="662" y="200" text-anchor="middle" class="body">预留但未使用：7892 slots</text>

    <text x="78" y="274" class="label">请求 B</text>
    <rect x="190" y="245" width="537" height="48" rx="4" class="used" />
    <rect x="727" y="245" width="373" height="48" rx="4" class="waste" />
    <text x="458" y="275" text-anchor="middle" class="inverse">实际使用：5000 slots</text>
    <text x="914" y="275" text-anchor="middle" class="body">空置：3192 slots</text>

    <rect x="385" y="308" width="430" height="25" rx="5" fill="#FFF0EF" stroke="#FF3B30" />
    <text x="600" y="326" text-anchor="middle" class="body">两条请求共锁住 11084 个尚未使用的 token slots</text>

    <rect x="50" y="370" width="1100" height="296" rx="8" class="panel" />
    <text x="78" y="406" class="heading">PagedAttention：固定大小 block 按需增长</text>
    <text x="78" y="430" class="small">蓝色为已写入 block；黄色是当前尾块；未分配 block 仍留在全局 free block queue</text>

    <text x="78" y="488" class="label">请求 A</text>
    <g transform="translate(190 454)">
        <rect x="0" y="0" width="70" height="48" rx="5" class="allocated" />
        <rect x="78" y="0" width="70" height="48" rx="5" class="allocated" />
        <text x="176" y="30" class="body">...</text>
        <rect x="208" y="0" width="70" height="48" rx="5" class="tail" />
        <rect x="208" y="0" width="24" height="48" rx="5" class="used" />
        <text x="139" y="70" text-anchor="middle" class="small">Nₐ = ceil(300 / Bₛ) blocks</text>
    </g>

    <text x="78" y="584" class="label">请求 B</text>
    <g transform="translate(190 550)">
        <rect x="0" y="0" width="70" height="48" rx="5" class="allocated" />
        <rect x="78" y="0" width="70" height="48" rx="5" class="allocated" />
        <rect x="156" y="0" width="70" height="48" rx="5" class="allocated" />
        <text x="246" y="30" class="body">...</text>
        <rect x="278" y="0" width="70" height="48" rx="5" class="tail" />
        <rect x="278" y="0" width="46" height="48" rx="5" class="used" />
        <text x="174" y="70" text-anchor="middle" class="small">Nᵦ = ceil(5000 / Bₛ) blocks</text>
    </g>

    <path d="M570 522 H660" class="arrow" />
    <text x="615" y="510" text-anchor="middle" class="small">其余显存</text>

    <g transform="translate(680 460)">
        <text x="190" y="-12" text-anchor="middle" class="label">全局 Free Block Queue</text>
        <rect x="0" y="0" width="72" height="48" rx="5" class="free" />
        <rect x="82" y="0" width="72" height="48" rx="5" class="free" />
        <rect x="164" y="0" width="72" height="48" rx="5" class="free" />
        <rect x="246" y="0" width="72" height="48" rx="5" class="free" />
        <rect x="328" y="0" width="72" height="48" rx="5" class="free" />
        <rect x="0" y="58" width="72" height="48" rx="5" class="free" />
        <rect x="82" y="58" width="72" height="48" rx="5" class="free" />
        <rect x="164" y="58" width="72" height="48" rx="5" class="free" />
        <rect x="246" y="58" width="72" height="48" rx="5" class="free" />
        <rect x="328" y="58" width="72" height="48" rx="5" class="free" />
    </g>

    <rect x="680" y="590" width="400" height="48" rx="6" fill="#EAF8EE" stroke="#34C759" />
    <text x="880" y="610" text-anchor="middle" class="body">每条序列只可能浪费最后一个 block 的尾部</text>
    <text x="880" y="630" text-anchor="middle" class="small">内部碎片上界：&lt; Bₛ token slots / sequence</text>
</svg>