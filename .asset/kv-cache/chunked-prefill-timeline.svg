<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"
    aria-labelledby="title desc">
    <title id="title">传统 Prefill 与 Chunked Prefill 调度对比</title>
    <desc id="desc">传统 Prefill 长时间独占 GPU 并一次性分配 KV Cache；Chunked Prefill 将 Prompt 分成四块，与其他请求的 Decode
        交替执行，同时逐批增加 KV Cache。</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto">
            <path d="M0 0 L10 5 L0 10 Z" fill="#6E6E73" />
        </marker>
        <style>
      text { font-family: Avenir Next, Segoe UI, sans-serif; letter-spacing: 0; }
      .title { font-size: 30px; font-weight: 700; fill: #172033; }
      .subtitle { font-size: 16px; fill: #526070; }
      .section { font-size: 20px; font-weight: 700; fill: #24324a; }
      .label { font-size: 15px; font-weight: 700; fill: #334155; }
      .body { font-size: 14px; fill: #334155; }
      .small { font-size: 13px; fill: #6E6E73; }
      .inverse { font-size: 14px; font-weight: 700; fill: #ffffff; }
      .axis { stroke: #94a3b8; stroke-width: 2; marker-end: url(#arrow); }
      .guide { stroke: #d6dee9; stroke-width: 1; stroke-dasharray: 5 5; }
      .prefill { fill: #0071E3; }
      .chunk-a { fill: #0071E3; }
      .chunk-b { fill: #4f91c8; }
      .decode { fill: #167333; }
      .idle { fill: #e8edf3; }
      .cache { fill: #e9b949; stroke: #8A4B00; stroke-width: 1; }
      .panel { fill: #ffffff; stroke: #c8d2df; stroke-width: 1.5; }
      .callout { fill: #f7fafc; stroke: #9cabbc; stroke-width: 1.5; }
    </style>
    </defs>
  <rect width="100%" height="100%" fill="#F5F5F7"/>

    <rect width="1200" height="760" fill="#F5F5F7" />
    <text x="600" y="46" text-anchor="middle" class="title">Chunked Prefill：把一段长计算拆进调度时间线</text>
    <text x="600" y="76" text-anchor="middle" class="subtitle">Prompt 总计算量基本不变，但 GPU 占用与 KV Cache
        分配从“一次完成”变为“逐步推进”</text>

    <rect x="55" y="105" width="1090" height="202" rx="8" class="panel" />
    <text x="82" y="137" class="section">传统 Prefill</text>
    <text x="82" y="160" class="small">一个长 Prompt 连续占用计算时段</text>

    <text x="82" y="205" class="label">长请求 A</text>
    <rect x="205" y="180" width="800" height="50" rx="5" class="prefill" />
    <text x="605" y="211" text-anchor="middle" class="inverse">完整 Prefill：token 0–8191</text>
    <rect x="1005" y="180" width="82" height="50" rx="5" class="decode" />
    <text x="1046" y="211" text-anchor="middle" class="inverse">Decode</text>

    <text x="82" y="270" class="label">请求 B/C</text>
    <rect x="205" y="245" width="800" height="50" rx="5" class="idle" />
    <text x="605" y="276" text-anchor="middle" class="body">等待：Decode 被长 Prefill 阻塞</text>
    <line x1="205" y1="297" x2="1100" y2="297" class="axis" />
    <text x="1110" y="302" class="small">时间</text>

    <rect x="55" y="330" width="1090" height="232" rx="8" class="panel" />
    <text x="82" y="362" class="section">Chunked Prefill</text>
    <text x="82" y="385" class="small">同一 Prompt 拆成多个 chunk，调度器可在间隙服务其他请求</text>

    <text x="82" y="430" class="label">长请求 A</text>
    <rect x="205" y="405" width="180" height="50" rx="5" class="chunk-a" />
    <rect x="425" y="405" width="180" height="50" rx="5" class="chunk-b" />
    <rect x="645" y="405" width="180" height="50" rx="5" class="chunk-a" />
    <rect x="865" y="405" width="180" height="50" rx="5" class="chunk-b" />
    <text x="295" y="425" text-anchor="middle" class="inverse">Chunk 1</text>
    <text x="295" y="444" text-anchor="middle" class="inverse">0–2047</text>
    <text x="515" y="425" text-anchor="middle" class="inverse">Chunk 2</text>
    <text x="515" y="444" text-anchor="middle" class="inverse">2048–4095</text>
    <text x="735" y="425" text-anchor="middle" class="inverse">Chunk 3</text>
    <text x="735" y="444" text-anchor="middle" class="inverse">4096–6143</text>
    <text x="955" y="425" text-anchor="middle" class="inverse">Chunk 4</text>
    <text x="955" y="444" text-anchor="middle" class="inverse">6144–8191</text>

    <text x="82" y="505" class="label">请求 B/C</text>
    <rect x="385" y="480" width="40" height="50" rx="4" class="decode" />
    <rect x="605" y="480" width="40" height="50" rx="4" class="decode" />
    <rect x="825" y="480" width="40" height="50" rx="4" class="decode" />
    <rect x="1045" y="480" width="42" height="50" rx="4" class="decode" />
    <text x="405" y="511" text-anchor="middle" class="inverse">D</text>
    <text x="625" y="511" text-anchor="middle" class="inverse">D</text>
    <text x="845" y="511" text-anchor="middle" class="inverse">D</text>
    <text x="1066" y="511" text-anchor="middle" class="inverse">D</text>
    <line x1="205" y1="552" x2="1100" y2="552" class="axis" />
    <text x="1110" y="557" class="small">时间</text>

    <line x1="385" y1="390" x2="385" y2="540" class="guide" />
    <line x1="605" y1="390" x2="605" y2="540" class="guide" />
    <line x1="825" y1="390" x2="825" y2="540" class="guide" />
    <line x1="1045" y1="390" x2="1045" y2="540" class="guide" />

    <rect x="55" y="585" width="1090" height="132" rx="8" class="panel" />
    <text x="82" y="617" class="section">KV Cache 增量分配</text>
    <text x="82" y="642" class="small">block_size = 16，每个 2048-token chunk 新增 128 blocks</text>

    <g transform="translate(420 608)">
        <rect x="0" y="28" width="140" height="42" rx="4" class="cache" />
        <text x="70" y="54" text-anchor="middle" class="label">128 blocks</text>

        <rect x="170" y="28" width="70" height="42" rx="4" class="cache" />
        <rect x="240" y="28" width="70" height="42" rx="4" class="cache" opacity="0.84" />
        <text x="240" y="54" text-anchor="middle" class="label">256</text>

        <rect x="340" y="28" width="47" height="42" rx="4" class="cache" />
        <rect x="387" y="28" width="47" height="42" rx="4" class="cache" opacity="0.84" />
        <rect x="434" y="28" width="47" height="42" rx="4" class="cache" opacity="0.68" />
        <text x="410" y="54" text-anchor="middle" class="label">384</text>

        <rect x="510" y="28" width="35" height="42" rx="3" class="cache" />
        <rect x="545" y="28" width="35" height="42" rx="3" class="cache" opacity="0.84" />
        <rect x="580" y="28" width="35" height="42" rx="3" class="cache" opacity="0.68" />
        <rect x="615" y="28" width="35" height="42" rx="3" class="cache" opacity="0.52" />
        <text x="580" y="54" text-anchor="middle" class="label">512</text>

        <path d="M145 49 H163 M315 49 H333 M485 49 H503" class="axis" />
    </g>

    <rect x="64" y="665" width="320" height="32" rx="5" class="callout" />
    <text x="224" y="686" text-anchor="middle" class="body">一次申请全部 → 每个 chunk 只追加当前所需 blocks</text>
    <style id="editorial-diagram-style">
        text { font-family: Helvetica Neue, Segoe UI, sans-serif; letter-spacing: 0; }
        .title { fill: #111111 !important; font-weight: 800 !important; }
        .subtitle, .small { fill: #333333 !important; }
        .inverse { fill: #111111 !important; }
        rect { rx: 3px; }
        .panel { fill: #F4F4F4 !important; stroke: #111111 !important; stroke-width: 3 !important; }
        .prefill, .chunk-a, .chunk-b { fill: #DDE0F1 !important; stroke: #111111 !important; stroke-width: 2.5 !important; }
        .decode { fill: #DCEBDF !important; stroke: #111111 !important; stroke-width: 2.5 !important; }
        .cache, .callout { fill: #F2E6D8 !important; stroke: #111111 !important; stroke-width: 2.5 !important; }
        .axis, .guide { stroke: #111111 !important; }
        marker path { fill: #111111 !important; }
        [fill="#F5F5F7" i] { fill: #FFFFFF !important; }
    </style>
</svg>