<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">推测解码中目标模型 KV 的提交与回滚</title>
  <desc id="desc">已确认前缀 P 后提出候选 a、b、c、d。目标模型接受 a、b，在 c 处拒绝：保留 P、a、b 的 KV，让 c、d 对应位置失效。替代 token x 已被选出，但其 KV 要等待后续实际前向计算才能生成。色块代表逻辑片段，不代表物理页。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#111111"/></marker>
    <style>
      text { font-family: Helvetica Neue, Segoe UI, sans-serif; letter-spacing: 0; }
      .title { font-size: 30px; font-weight: 800; fill: #111111; }
      .subtitle { font-size: 16px; fill: #333333; }
      .heading { font-size: 19px; font-weight: 800; fill: #111111; }
      .label { font-size: 18px; font-weight: 700; fill: #111111; }
      .body { font-size: 16px; fill: #333333; }
      .small { font-size: 14px; fill: #444444; }
      .inverse { font-size: 16px; font-weight: 700; fill: #FFFFFF; }
      .panel { fill: #F4F4F4; stroke: #111111; stroke-width: 3; }
      .prefix { fill: #DDE0F1; stroke: #111111; stroke-width: 2.5; }
      .candidate { fill: #F2E6D8; stroke: #111111; stroke-width: 2.5; }
      .accepted { fill: #DCEBDF; stroke: #111111; stroke-width: 2.5; }
      .rejected { fill: #F2D9D8; stroke: #111111; stroke-width: 2.5; }
      .pending { fill: #FFFFFF; stroke: #111111; stroke-width: 2.5; stroke-dasharray: 7 5; }
      .arrow { fill: none; stroke: #111111; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <text x="600" y="46" text-anchor="middle" class="title">接受的 KV 留下，拒绝的路径失效</text>
  <text x="600" y="76" text-anchor="middle" class="subtitle">只展示目标模型的缓存；逻辑片段不等于物理 block</text>
  <rect x="50" y="108" width="1100" height="400" rx="3" class="panel"/>
  <text x="80" y="144" class="heading">1. 验证候选：临时 KV 尚未全部确认</text>
  <rect x="100" y="170" width="280" height="64" rx="3" class="prefix"/>
  <text x="240" y="209" text-anchor="middle" class="label">P：已确认前缀</text>
  <rect x="410" y="170" width="140" height="64" rx="3" class="candidate"/>
  <text x="480" y="209" text-anchor="middle" class="label">a</text>
  <rect x="580" y="170" width="140" height="64" rx="3" class="candidate"/>
  <text x="650" y="209" text-anchor="middle" class="label">b</text>
  <rect x="750" y="170" width="140" height="64" rx="3" class="candidate"/>
  <text x="820" y="209" text-anchor="middle" class="label">c</text>
  <rect x="920" y="170" width="140" height="64" rx="3" class="candidate"/>
  <text x="990" y="209" text-anchor="middle" class="label">d</text>
  <path d="M600 246 V292" class="arrow"/>
  <text x="630" y="277" class="body">接受 a、b；在 c 处拒绝</text>
  <text x="80" y="324" class="heading">2. 更新有效范围：只保留已接受路径</text>
  <rect x="100" y="344" width="280" height="64" rx="3" class="prefix"/>
  <text x="240" y="383" text-anchor="middle" class="label">P：继续保留</text>
  <rect x="410" y="344" width="140" height="64" rx="3" class="accepted"/>
  <text x="480" y="383" text-anchor="middle" class="label">a：保留</text>
  <rect x="580" y="344" width="140" height="64" rx="3" class="accepted"/>
  <text x="650" y="383" text-anchor="middle" class="label">b：保留</text>
  <rect x="750" y="344" width="140" height="64" rx="3" class="rejected"/>
  <text x="820" y="383" text-anchor="middle" class="label">c：失效</text>
  <rect x="920" y="344" width="140" height="64" rx="3" class="rejected"/>
  <text x="990" y="383" text-anchor="middle" class="label">d：失效</text>
  <rect x="100" y="434" width="280" height="48" rx="3" class="pending"/>
  <text x="240" y="465" text-anchor="middle" class="label">x：替代 token，KV 待计算</text>
  <text x="410" y="463" class="body">下一轮沿 P、a、b、x 继续，不能复用 c 的 KV。</text>
  <text x="80" y="543" class="small">回滚更新有效长度与映射，不要求清零显存；共享位置仍需遵守引用保护。</text>
  <rect x="50" y="571" width="1100" height="40" rx="3" fill="#111111"/>
  <text x="600" y="597" text-anchor="middle" class="inverse">已经选出一个 token，不等于已经计算并缓存了这个 token 的 K/V</text>
</svg>