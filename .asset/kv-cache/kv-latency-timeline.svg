<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">TTFT 与 ITL：首 token 和后续生成的时间线</title>
  <desc id="desc">请求经过排队、预处理和 Prefill 后输出首 token，随后逐步 Decode。TTFT 覆盖首 token 之前的等待，ITL 衡量相邻输出间隔。前缀命中主要缩短 Prefill，不会消除 Decode 对历史 KV 的读取。图中省略网络传输时间，长度不按比例。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#111111"/></marker>
    <style>
      text { font-family: Helvetica Neue, Segoe UI, sans-serif; letter-spacing: 0; }
      .title { font-size: 30px; font-weight: 800; fill: #111111; }
      .subtitle { font-size: 16px; fill: #333333; }
      .heading { font-size: 19px; font-weight: 800; fill: #111111; }
      .body { font-size: 16px; fill: #333333; }
      .small { font-size: 14px; fill: #444444; }
      .inverse { font-size: 16px; font-weight: 700; fill: #FFFFFF; }
      .panel { fill: #F4F4F4; stroke: #111111; stroke-width: 3; }
      .queue { fill: #F2E6D8; stroke: #111111; stroke-width: 2.5; }
      .prefill { fill: #DDE0F1; stroke: #111111; stroke-width: 2.5; }
      .decode { fill: #DCEBDF; stroke: #111111; stroke-width: 2.5; }
      .edge { fill: none; stroke: #111111; stroke-width: 3; }
    </style>
  </defs>
  <rect width="1200" height="540" fill="#FFFFFF"/>
  <text x="600" y="46" text-anchor="middle" class="title">首 token 的等待，与后续 token 的间隔</text>
  <text x="600" y="76" text-anchor="middle" class="subtitle">前缀复用主要节省 Prefill；Decode 仍要读取历史 KV</text>
  <rect x="50" y="108" width="1100" height="254" rx="3" class="panel"/>
  <text x="80" y="144" class="heading">1. 一条请求的时间线</text>
  <rect x="90" y="180" width="210" height="58" rx="3" class="queue"/>
  <text x="195" y="215" text-anchor="middle" class="body">排队与预处理</text>
  <rect x="300" y="180" width="390" height="58" rx="3" class="prefill"/>
  <text x="495" y="215" text-anchor="middle" class="body">Prefill 未命中的前缀</text>
  <rect x="690" y="180" width="180" height="58" rx="3" class="decode"/>
  <text x="780" y="215" text-anchor="middle" class="body">Decode</text>
  <rect x="870" y="180" width="180" height="58" rx="3" class="decode"/>
  <text x="960" y="215" text-anchor="middle" class="body">Decode</text>
  <path d="M90 248 V260 M690 248 V260 M870 248 V260 M1050 248 V260" class="edge"/>
  <text x="90" y="283" text-anchor="middle" class="small">请求到达</text>
  <text x="690" y="283" text-anchor="middle" class="small">首 token</text>
  <text x="870" y="283" text-anchor="middle" class="small">token 2</text>
  <text x="1050" y="283" text-anchor="middle" class="small">token 3</text>
  <path d="M90 310 V318 H690 V310 M704 310 V318 H870 V310 M884 310 V318 H1050 V310" class="edge"/>
  <text x="390" y="345" text-anchor="middle" class="body">TTFT</text>
  <text x="787" y="345" text-anchor="middle" class="body">ITL</text>
  <text x="967" y="345" text-anchor="middle" class="body">ITL</text>
  <text x="80" y="405" class="heading">2. 测量时分别看</text>
  <text x="80" y="435" class="body">TTFT 看首次等待；ITL 看生成停顿；输出吞吐量看整个服务的产出。</text>
  <text x="80" y="463" class="small">示意长度不按比例；客户端延迟还包括网络传输与缓冲，需要统一测量口径。</text>
  <rect x="50" y="486" width="1100" height="38" rx="3" fill="#111111"/>
  <text x="600" y="511" text-anchor="middle" class="inverse">增加并发可以提高总吞吐，也可能拉长每条请求的等待与输出间隔</text>
</svg>