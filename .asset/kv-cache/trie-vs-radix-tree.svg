<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img"
    aria-labelledby="title desc">
    <title id="title">Trie 与 Radix Tree 的结构对比</title>
    <desc id="desc">同样存储 hello、help 和 world 时，Trie 的每条边只保存一个元素，Radix Tree 则把无分支路径压缩为连续片段，并在公共前缀 hel
        处分支。</desc>
    <defs>
        <style>
      text { font-family: Avenir Next, Segoe UI, sans-serif; letter-spacing: 0; }
      .title { font-size: 30px; font-weight: 700; fill: #172033; }
      .subtitle { font-size: 16px; fill: #526070; }
      .panel-title { font-size: 20px; font-weight: 700; fill: #24324a; }
      .node-text { font-size: 16px; font-weight: 700; fill: #24324a; }
      .body { font-size: 14px; fill: #475569; }
      .metric { font-size: 15px; font-weight: 700; fill: #24324a; }
      .panel { fill: #FFFFFF; stroke: #D2D2D7; stroke-width: 1.5; }
      .root { fill: #EEF2F7; stroke: #94A3B8; stroke-width: 1.5; }
      .trie { fill: #FFF4E5; stroke: #D2A532; stroke-width: 1.5; }
      .shared { fill: #DBEAFE; stroke: #4F8FCE; stroke-width: 2; }
      .leaf { fill: #DCFCE7; stroke: #43A56C; stroke-width: 1.5; }
      .edge { fill: none; stroke: #6E6E73; stroke-width: 2; }
    </style>
    </defs>

    <rect width="1200" height="620" fill="#F5F5F7" />
    <text x="600" y="46" text-anchor="middle" class="title">Trie 与 Radix Tree：相同前缀，更少节点</text>
    <text x="600" y="76" text-anchor="middle" class="subtitle">示例存储 “hello”、 “help” 与 “world”；在
        RadixAttention 中，边标签是连续 token 片段</text>

    <rect x="52" y="108" width="510" height="438" rx="8" class="panel" />
    <text x="307" y="145" text-anchor="middle" class="panel-title">Trie · 每条边一个元素</text>
    <rect x="272" y="168" width="70" height="34" rx="6" class="root" />
    <text x="307" y="191" text-anchor="middle" class="node-text">root</text>

    <path d="M292 202 L210 236 M322 202 L405 236" class="edge" />
    <circle cx="210" cy="251" r="20" class="trie" />
    <text x="210" y="257" text-anchor="middle" class="node-text">h</text>
    <circle cx="405" cy="251" r="20" class="trie" />
    <text x="405" y="257" text-anchor="middle" class="node-text">w</text>
    <path d="M210 271 V300 M405 271 V300" class="edge" />
    <circle cx="210" cy="320" r="20" class="trie" />
    <text x="210" y="326" text-anchor="middle" class="node-text">e</text>
    <circle cx="405" cy="320" r="20" class="trie" />
    <text x="405" y="326" text-anchor="middle" class="node-text">o</text>
    <path d="M210 340 V369 M405 340 V369" class="edge" />
    <circle cx="210" cy="389" r="20" class="trie" />
    <text x="210" y="395" text-anchor="middle" class="node-text">l</text>
    <circle cx="405" cy="389" r="20" class="trie" />
    <text x="405" y="395" text-anchor="middle" class="node-text">r</text>
    <path d="M196 404 L163 433 M224 404 L257 433 M405 409 V438" class="edge" />
    <circle cx="149" cy="448" r="20" class="trie" />
    <text x="149" y="454" text-anchor="middle" class="node-text">l</text>
    <circle cx="271" cy="448" r="20" class="trie" />
    <text x="271" y="454" text-anchor="middle" class="node-text">p</text>
    <circle cx="405" cy="458" r="20" class="trie" />
    <text x="405" y="464" text-anchor="middle" class="node-text">l</text>
    <path d="M149 468 V484 M405 478 V494" class="edge" />
    <circle cx="149" cy="504" r="20" class="trie" />
    <text x="149" y="510" text-anchor="middle" class="node-text">o</text>
    <circle cx="405" cy="514" r="20" class="trie" />
    <text x="405" y="520" text-anchor="middle" class="node-text">d</text>

    <rect x="638" y="108" width="510" height="438" rx="8" class="panel" />
    <text x="893" y="145" text-anchor="middle" class="panel-title">Radix Tree · 压缩无分支路径</text>
    <rect x="858" y="168" width="70" height="34" rx="6" class="root" />
    <text x="893" y="191" text-anchor="middle" class="node-text">root</text>
    <path d="M878 202 L780 258 M908 202 L1006 258" class="edge" />
    <rect x="716" y="258" width="128" height="52" rx="7" class="shared" />
    <text x="780" y="290" text-anchor="middle" class="node-text">“hel”</text>
    <rect x="944" y="258" width="124" height="52" rx="7" class="leaf" />
    <text x="1006" y="290" text-anchor="middle" class="node-text">“world”</text>
    <path d="M780 310 V350 M780 350 L730 390 M780 350 L830 390" class="edge" />
    <rect x="676" y="390" width="108" height="52" rx="7" class="leaf" />
    <text x="730" y="422" text-anchor="middle" class="node-text">“lo”</text>
    <rect x="800" y="390" width="60" height="52" rx="7" class="leaf" />
    <text x="830" y="422" text-anchor="middle" class="node-text">“p”</text>
    <text x="893" y="494" text-anchor="middle" class="metric">公共前缀 “hel” 只存一份</text>
    <text x="893" y="520" text-anchor="middle" class="body">匹配到分歧点，再沿不同后缀继续</text>

    <text x="600" y="586" text-anchor="middle" class="metric">路径压缩降低节点数量；前缀共享让对应 KV Cache 可直接复用</text>
</svg>