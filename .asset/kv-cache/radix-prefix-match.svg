<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"
    aria-labelledby="title desc">
    <title id="title">RadixAttention 最长前缀匹配与 KV Cache 复用</title>
    <desc id="desc">新请求沿 Radix Tree 命中 System Prompt 和 Query A，直接复用对应 KV Cache，仅对 Query C 执行
        Prefill。</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto">
            <path d="M0 0 L10 5 L0 10 Z" fill="#6E6E73" />
        </marker>
        <style>
      text { font-family: Avenir Next, Segoe UI, sans-serif; letter-spacing: 0; }
      .title { font-size: 30px; font-weight: 700; fill: #172033; }
      .subtitle { font-size: 16px; fill: #526070; }
      .heading { font-size: 19px; font-weight: 700; fill: #24324a; }
      .node { font-size: 15px; font-weight: 700; fill: #24324a; }
      .body { font-size: 14px; fill: #475569; }
      .small { font-size: 13px; fill: #6E6E73; }
      .panel { fill: #fff; stroke: #D2D2D7; stroke-width: 1.5; }
      .hit { fill: #dbeafe; stroke: #4f8fce; stroke-width: 2; }
      .branch { fill: #F5F5F7; stroke: #94a3b8; stroke-width: 1.5; }
      .miss { fill: #dcfce7; stroke: #43a56c; stroke-width: 2; }
      .cache { fill: #FFF4E5; stroke: #d2a532; stroke-width: 1.5; }
      .edge { fill: none; stroke: #94a3b8; stroke-width: 2; }
      .hit-edge { fill: none; stroke: #4f8fce; stroke-width: 5; }
      .arrow { fill: none; stroke: #6E6E73; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    </defs>
  <rect width="100%" height="100%" fill="#F5F5F7"/>
    <rect width="1200" height="650" fill="#F5F5F7" />
    <text x="600" y="48" text-anchor="middle" class="title">最长前缀命中：复用到分歧点为止</text>
    <text x="600" y="78" text-anchor="middle" class="subtitle">蓝色路径直接加载已有 KV Cache；绿色后缀才需要执行新的
        Prefill</text>

    <rect x="48" y="112" width="690" height="458" rx="8" class="panel" />
    <text x="78" y="148" class="heading">Radix Tree 中已有的缓存</text>
    <rect x="294" y="170" width="110" height="44" rx="7" class="branch" />
    <text x="349" y="198" text-anchor="middle" class="node">root</text>
    <path d="M349 214 V258" class="hit-edge" />
    <rect x="234" y="258" width="230" height="54" rx="7" class="hit" />
    <text x="349" y="291" text-anchor="middle" class="node">System Prompt</text>
    <path d="M349 312 V350 M349 350 L214 385 M349 350 L484 385" class="edge" />
    <path d="M349 312 V350 L214 385" class="hit-edge" />
    <rect x="129" y="385" width="170" height="54" rx="7" class="hit" />
    <text x="214" y="418" text-anchor="middle" class="node">Query A</text>
    <rect x="399" y="385" width="170" height="54" rx="7" class="branch" />
    <text x="484" y="418" text-anchor="middle" class="node">Query B</text>
    <path d="M214 439 V482" class="hit-edge" />
    <rect x="129" y="482" width="170" height="54" rx="7" class="hit" />
    <text x="214" y="515" text-anchor="middle" class="node">Response A</text>
    <text x="503" y="493" class="body">查询沿蓝色路径逐 token 匹配</text>
    <text x="503" y="519" class="body">到叶端后没有 Query C 分支，停止</text>

    <path d="M756 320 H806" class="arrow" />

    <rect x="826" y="112" width="326" height="458" rx="8" class="panel" />
    <text x="856" y="148" class="heading">新请求的处理</text>
    <text x="856" y="184" class="small">输入序列</text>
    <rect x="856" y="198" width="266" height="48" rx="6" class="hit" />
    <text x="989" y="228" text-anchor="middle" class="node">System + Query A + Response A</text>
    <rect x="856" y="258" width="266" height="48" rx="6" class="miss" />
    <text x="989" y="288" text-anchor="middle" class="node">Query C</text>

    <path d="M989 326 V367" class="arrow" />
    <rect x="856" y="382" width="266" height="58" rx="6" class="cache" />
    <text x="989" y="406" text-anchor="middle" class="node">命中前缀</text>
    <text x="989" y="427" text-anchor="middle" class="small">直接加载已有 KV Cache</text>
    <rect x="856" y="456" width="266" height="58" rx="6" class="miss" />
    <text x="989" y="480" text-anchor="middle" class="node">未命中后缀</text>
    <text x="989" y="501" text-anchor="middle" class="small">仅对 Query C 执行 Prefill</text>

    <rect x="212" y="590" width="776" height="38" rx="6" fill="#EAF3FC" stroke="#EAF3FC" />
    <text x="600" y="614" text-anchor="middle" class="body">计算边界 = 最长公共前缀末端；Prefix Caching 跳过的是重复
        Prefill，不是整个 Prefill 阶段</text>
</svg>