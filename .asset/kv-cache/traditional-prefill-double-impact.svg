<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"
    aria-labelledby="title desc">
    <title id="title">传统 Prefill 对 KV Cache 的双重冲击</title>
    <desc id="desc">一个 32K token 的长 Prompt 到达后，一次性申请 2048 个 KV blocks，造成显存分配峰值；同时完整 Prefill 长时间占用
        GPU，使已有请求的 Decode 排队等待。</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto">
            <path d="M0 0 L10 5 L0 10 Z" fill="#111111" />
        </marker>
        <pattern id="blocks" width="18" height="18" patternUnits="userSpaceOnUse">
            <rect width="18" height="18" fill="#E9D9EB" />
            <path d="M18 0H0V18" fill="none" stroke="#9B759D" stroke-width="1" />
        </pattern>
        <style>
      text { font-family: Helvetica Neue, Segoe UI, sans-serif; letter-spacing: 0; }
      .title { font-size: 32px; font-weight: 800; fill: #111111; }
      .subtitle { font-size: 16px; fill: #333333; }
      .heading { font-size: 22px; font-weight: 800; fill: #111111; }
      .label { font-size: 16px; font-weight: 750; fill: #111111; }
      .body { font-size: 14px; fill: #333333; }
      .small { font-size: 13px; fill: #444444; }
      .panel { fill: #F4F4F4; stroke: #111111; stroke-width: 3; }
      .request { fill: #DDE0F1; stroke: #111111; stroke-width: 2.5; }
      .cache { fill: url(#blocks); stroke: #111111; stroke-width: 2.5; }
      .existing { fill: #DCEBDF; stroke: #111111; stroke-width: 2.5; }
      .danger { fill: #F4D8D4; stroke: #111111; stroke-width: 2.5; }
      .warning { fill: #F2E6D8; stroke: #111111; stroke-width: 2.5; }
      .waiting { fill: #FFFFFF; stroke: #C24E3D; stroke-width: 2.5; stroke-dasharray: 8 5; }
      .arrow { fill: none; stroke: #111111; stroke-width: 3; marker-end: url(#arrow); }
      .danger-arrow { fill: none; stroke: #C24E3D; stroke-width: 3; marker-end: url(#arrow); }
    </style>
    </defs>

    <rect width="1200" height="720" fill="#FFFFFF" />
    <text x="600" y="46" text-anchor="middle" class="title">传统 Prefill 对 KV Cache 的双重冲击</text>
    <text x="600" y="76" text-anchor="middle" class="subtitle">一个 32K Prompt 到达，同时制造显存分配峰值与 Decode
        排队</text>

    <rect x="48" y="106" width="1104" height="104" rx="3" class="request" />
    <text x="80" y="140" class="heading">长请求 A 到达</text>
    <text x="80" y="172" class="label">32,768 tokens</text>
    <text x="258" y="172" class="body">block size = 16 tokens</text>
    <path d="M480 158 H690" class="arrow" />
    <text x="585" y="143" text-anchor="middle" class="small">调度器开始传统 Prefill</text>
    <rect x="716" y="128" width="394" height="60" rx="3" class="warning" />
    <text x="913" y="153" text-anchor="middle" class="label">必须先处理完整 Prompt</text>
    <text x="913" y="176" text-anchor="middle" class="body">不能在中间让出本轮 GPU 执行时段</text>

    <path d="M328 210 V246" class="arrow" />
    <path d="M872 210 V246" class="arrow" />

    <rect x="48" y="250" width="532" height="382" rx="3" class="panel" />
    <text x="76" y="290" class="heading">冲击一：KV blocks 瞬时占用</text>
    <text x="76" y="318" class="body">32,768 ÷ 16 = 2,048 blocks，在 Prefill 开始前一次性申请</text>

    <text x="76" y="367" class="label">申请前</text>
    <rect x="166" y="344" width="368" height="48" rx="3" fill="#FFFFFF" stroke="#111111"
        stroke-width="2.5" />
    <rect x="166" y="344" width="126" height="48" rx="3" class="existing" />
    <text x="229" y="373" text-anchor="middle" class="small">已有请求</text>
    <text x="413" y="373" text-anchor="middle" class="small">空闲 block 池</text>

    <path d="M350 405 V439" class="danger-arrow" />
    <text x="368" y="428" class="small">瞬间申请 2,048 blocks</text>

    <text x="76" y="485" class="label">申请后</text>
    <rect x="166" y="462" width="368" height="48" rx="3" class="cache" />
    <rect x="166" y="462" width="126" height="48" rx="3" class="existing" />
    <rect x="504" y="462" width="30" height="48" rx="2" class="danger" />
    <text x="335" y="492" text-anchor="middle" class="label">请求 A 的 KV Cache</text>

    <rect x="76" y="544" width="458" height="58" rx="3" class="danger" />
    <text x="305" y="568" text-anchor="middle" class="label">空闲 blocks 快速逼近下限</text>
    <text x="305" y="590" text-anchor="middle" class="body">分配失败时可能触发排队或 Preemption</text>

    <rect x="620" y="250" width="532" height="382" rx="3" class="panel" />
    <text x="648" y="290" class="heading">冲击二：其他请求的 Decode 被阻塞</text>
    <text x="648" y="318" class="body">完整 Prefill 连续占用 GPU；在线请求不能按时生成下一个 token</text>

    <text x="648" y="365" class="label">GPU</text>
    <rect x="712" y="340" width="348" height="62" rx="3" class="request" />
    <text x="886" y="366" text-anchor="middle" class="label">请求 A · 完整 Prefill</text>
    <text x="886" y="389" text-anchor="middle" class="small">持续执行 O(S²) 计算</text>

    <text x="648" y="451" class="label">B</text>
    <rect x="712" y="426" width="348" height="50" rx="3" class="waiting" />
    <text x="886" y="457" text-anchor="middle" class="label">Decode 等待</text>
    <text x="648" y="517" class="label">C</text>
    <rect x="712" y="492" width="348" height="50" rx="3" class="waiting" />
    <text x="886" y="523" text-anchor="middle" class="label">Decode 等待</text>

    <path d="M1060 451 H1102" class="danger-arrow" />
    <path d="M1060 517 H1102" class="danger-arrow" />
    <text x="1081" y="438" text-anchor="middle" class="small">延迟</text>

    <rect x="648" y="564" width="458" height="38" rx="3" class="danger" />
    <text x="877" y="588" text-anchor="middle" class="label">TBT 抖动，排队请求的 TTFT 也被拉长</text>

    <rect x="48" y="660" width="1104" height="40" rx="3" class="warning" />
    <text x="600" y="686" text-anchor="middle" class="label">同一次完整 Prefill：左边挤压 KV 容量，右边挤占 GPU 调度时间</text>
</svg>