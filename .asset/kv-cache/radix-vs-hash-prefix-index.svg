<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img"
    aria-labelledby="title desc">
    <title id="title">RadixAttention 与 vLLM APC 的前缀索引对比</title>
    <desc id="desc">左侧 RadixAttention 用 Radix Tree 保存连续 token 片段，分歧点可以落在节点内部；右侧 vLLM
        APC 按完整 block 的链式哈希查表。左侧演示 token 粒度，实际复用仍受页对齐和后端约束；两者都需要保护正在使用的缓存。</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto">
            <path d="M0 0 L10 5 L0 10 Z" fill="#111111" />
        </marker>
        <style>
      text { font-family: Helvetica Neue, Segoe UI, sans-serif; letter-spacing: 0; }
      .title { font-size: 30px; font-weight: 800; fill: #111111; }
      .subtitle { font-size: 16px; fill: #333333; }
      .heading { font-size: 19px; font-weight: 800; fill: #111111; }
      .label { font-size: 15px; font-weight: 750; fill: #111111; }
      .body { font-size: 14px; fill: #333333; }
      .small { font-size: 13px; fill: #444444; }
      .inverse { font-size: 15px; font-weight: 750; fill: #FFFFFF; }
      .panel { fill: #F4F4F4; stroke: #111111; stroke-width: 3; }
      .note { fill: #FFFFFF; stroke: #777777; stroke-width: 2; }
      .root { fill: #FFFFFF; stroke: #111111; stroke-width: 2.5; }
      .shared { fill: #DDE0F1; stroke: #111111; stroke-width: 2.5; }
      .branch-a { fill: #F2E6D8; stroke: #111111; stroke-width: 2.5; }
      .branch-b { fill: #DCEBDF; stroke: #111111; stroke-width: 2.5; }
      .miss { fill: #F2D9D8; stroke: #111111; stroke-width: 2.5; }
      .edge { fill: none; stroke: #111111; stroke-width: 3; }
      .arrow { fill: none; stroke: #111111; stroke-width: 3; marker-end: url(#arrow); }
    </style>
    </defs>

    <rect width="1200" height="660" fill="#FFFFFF" />
    <text x="600" y="46" text-anchor="middle" class="title">同一段共享前缀，两种索引方式</text>
    <text x="600" y="76" text-anchor="middle" class="subtitle">RadixAttention 沿 token 路径匹配，vLLM
        APC 按 block 查哈希表</text>

    <rect x="52" y="108" width="528" height="470" rx="3" class="panel" />
    <text x="316" y="146" text-anchor="middle" class="heading">RadixAttention · token 级路径</text>

    <rect x="276" y="172" width="80" height="34" rx="3" class="root" />
    <text x="316" y="195" text-anchor="middle" class="label">root</text>
    <path d="M316 206 V236" class="edge" />

    <rect x="156" y="236" width="320" height="64" rx="3" class="shared" />
    <text x="316" y="262" text-anchor="middle" class="small">共享前缀节点</text>
    <text x="316" y="286" text-anchor="middle" class="label">[“You”, “ are”, “ helpful”]</text>

    <path d="M266 300 L216 336 M366 300 L436 336" class="edge" />

    <rect x="116" y="336" width="200" height="64" rx="3" class="branch-a" />
    <text x="216" y="362" text-anchor="middle" class="small">请求 A 后缀</text>
    <text x="216" y="386" text-anchor="middle" class="label">[“Explain”, “ KV”]</text>

    <rect x="336" y="336" width="200" height="64" rx="3" class="branch-b" />
    <text x="436" y="362" text-anchor="middle" class="small">请求 B 后缀</text>
    <text x="436" y="386" text-anchor="middle" class="label">[“Define”, “ GQA”]</text>

    <rect x="84" y="424" width="464" height="126" rx="3" class="note" />
    <text x="106" y="452" class="label">分歧点可以落在节点内部</text>
    <text x="106" y="480" class="body">token 粒度下，可拆出 [“You”, “ are”] 共享路径。</text>
    <text x="106" y="504" class="body">树能表达细粒度分歧；实际可复用多少 KV，</text>
    <text x="106" y="528" class="body">仍取决于 page size 与后端的对齐要求。</text>

    <rect x="620" y="108" width="528" height="470" rx="3" class="panel" />
    <text x="884" y="146" text-anchor="middle" class="heading">vLLM APC · block 级哈希</text>

    <rect x="652" y="176" width="140" height="56" rx="3" class="shared" />
    <text x="722" y="199" text-anchor="middle" class="small">Block 0 · 已填满</text>
    <text x="722" y="221" text-anchor="middle" class="label">[A B C D]</text>

    <rect x="808" y="176" width="140" height="56" rx="3" class="shared" />
    <text x="878" y="199" text-anchor="middle" class="small">Block 1 · 已填满</text>
    <text x="878" y="221" text-anchor="middle" class="label">[E F G H]</text>

    <rect x="964" y="176" width="140" height="56" rx="3" class="miss" />
    <text x="1034" y="199" text-anchor="middle" class="small">Block 2 · 未填满</text>
    <text x="1034" y="221" text-anchor="middle" class="label">[I J K _]</text>

    <rect x="667" y="252" width="110" height="36" rx="3" class="root" />
    <text x="722" y="276" text-anchor="middle" class="label">H0</text>
    <rect x="823" y="252" width="110" height="36" rx="3" class="root" />
    <text x="878" y="276" text-anchor="middle" class="label">H1</text>
    <rect x="979" y="252" width="110" height="36" rx="3" class="miss" />
    <text x="1034" y="276" text-anchor="middle" class="label">无哈希</text>

    <path d="M777 270 H819" class="arrow" />
    <path d="M933 270 H975" class="arrow" />

    <text x="884" y="312" text-anchor="middle" class="small">Hi = hash(Hi-1, tokens_i,
        extra)：把前文与当前块一起编码</text>

    <rect x="652" y="330" width="452" height="128" rx="3" class="note" />
    <text x="674" y="358" class="label">Hash Table（block 级）</text>
    <text x="674" y="386" class="body">H0 → 物理 block #7　命中，引用计数 +1</text>
    <text x="674" y="412" class="body">H1 → 物理 block #19　命中，引用计数 +1</text>
    <text x="674" y="438" class="body">Block 2 未填满 → 不产生哈希，无法登记</text>

    <rect x="652" y="474" width="452" height="76" rx="3" class="note" />
    <text x="674" y="502" class="label">匹配到第一个 miss 即停止</text>
    <text x="674" y="528" class="body">尾块要等填满后，才可能被后续请求复用。</text>

    <rect x="52" y="604" width="1096" height="40" rx="3" fill="#111111" />
    <text x="600" y="630" text-anchor="middle" class="inverse">这里比较前缀索引；物理布局、页大小与调度也会影响实际复用效果</text>
</svg>
