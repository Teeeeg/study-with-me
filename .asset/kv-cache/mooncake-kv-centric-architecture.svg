<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img"
    aria-labelledby="title desc">
    <title id="title">一次请求如何穿过 Mooncake</title>
    <desc id="desc">请求先由 Conductor 根据缓存命中、排队和搬运成本选择节点，再经过 Prefill、KV Cache 流式传输和独立 Decode。</desc>

    <defs>
        
        <marker id="arrow-ink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"
            markerUnits="userSpaceOnUse">
            <path d="M0,0 L12,6 L0,12 Z" fill="#1D1D1F" />
        </marker>
        <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"
            markerUnits="userSpaceOnUse">
            <path d="M0,0 L12,6 L0,12 Z" fill="#34C759" />
        </marker>
        <marker id="arrow-coral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"
            markerUnits="userSpaceOnUse">
            <path d="M0,0 L12,6 L0,12 Z" fill="#FF3B30" />
        </marker>
        <style>
      .text { font-family: Avenir Next, Segoe UI, sans-serif; fill: #1D1D1F; }
      .page-title { font-size: 30px; font-weight: 700; }
      .page-subtitle { font-size: 17px; fill: #52717b; }
      .card-title { font-size: 23px; font-weight: 700; }
      .body { font-size: 16px; }
      .body-bold { font-size: 16px; font-weight: 700; }
      .small { font-size: 14px; fill: #52717b; }
      .tiny { font-size: 12px; fill: #52717b; }
      .card { fill: #ffffff; stroke: #d4dfdc; stroke-width: 2; filter: url(#shadow); }
      .flow { fill: none; stroke: #1D1D1F; stroke-width: 3; marker-end: url(#arrow-ink); }
      .cache-read { fill: none; stroke: #34C759; stroke-width: 3; marker-end: url(#arrow-teal); }
      .cache-write { fill: none; stroke: #FF3B30; stroke-width: 3; marker-end: url(#arrow-coral); }
      .metadata { fill: none; stroke: #1D1D1F; stroke-width: 2.5; stroke-dasharray: 7 6; marker-end: url(#arrow-ink); }
    </style>
    </defs>
  <rect width="100%" height="100%" fill="#F5F5F7"/>

    <rect width="1440" height="780" fill="#F5F5F7" />
    <text x="58" y="52" class="text page-title">一次请求如何穿过 Mooncake</text>
    <text x="58" y="81" class="text page-subtitle">先看 KV Cache 在哪里，再决定计算在哪里</text>
    <rect x="1225" y="40" width="157" height="38" fill="#EAF8EE" stroke="#34C759" rx="6" />
    <text x="1250" y="65" class="text body-bold">阅读顺序 1 → 4</text>
    <path d="M58 105 H1382" stroke="#D2D2D7" stroke-width="2" />

    <!-- Step 1: request -->
    <rect x="50" y="142" width="190" height="298" rx="8" class="card" />
    <rect x="50" y="142" width="190" height="9" rx="4" fill="#FF9F0A" />
    <circle cx="79" cy="177" r="18" fill="#FF9F0A" />
    <text x="74" y="183" class="text body-bold">1</text>
    <text x="109" y="184" class="text card-title">请求到达</text>

    <text x="72" y="229" class="text body-bold">长 Prompt</text>
    <rect x="72" y="250" width="25" height="39" rx="4" fill="#34C759" />
    <rect x="102" y="250" width="25" height="39" rx="4" fill="#34C759" />
    <rect x="132" y="250" width="25" height="39" rx="4" fill="#34C759" />
    <rect x="162" y="250" width="25" height="39" rx="4" fill="#FF9F0A" />
    <rect x="192" y="250" width="25" height="39" rx="4" fill="#FF9F0A" />
    <path d="M72 302 H157" stroke="#34C759" stroke-width="2" />
    <text x="77" y="321" class="text tiny">共享前缀</text>
    <path d="M162 302 H217" stroke="#8A4B00" stroke-width="2" />
    <text x="163" y="321" class="text tiny">本轮问题</text>

    <rect x="72" y="350" width="146" height="52" rx="6" fill="#FFF4E5" />
    <text x="90" y="372" class="text small">Tokenize</text>
    <text x="90" y="392" class="text small">计算 Prefix Hash</text>

    <!-- Step 2: conductor -->
    <rect x="300" y="142" width="300" height="298" rx="8" class="card" />
    <rect x="300" y="142" width="300" height="9" rx="4" fill="#1D1D1F" />
    <circle cx="329" cy="177" r="18" fill="#1D1D1F" />
    <text x="324" y="183" font-family="Avenir Next, Segoe UI, sans-serif"
        font-size="16" font-weight="700" fill="#ffffff">2</text>
    <text x="359" y="184" class="text card-title">Conductor 决策</text>
    <text x="323" y="221" class="text small">为每条候选路径估算总延迟</text>

    <rect x="323" y="244" width="78" height="54" rx="6" fill="#EAF8EE" stroke="#34C759" />
    <text x="342" y="266" class="text tiny">缓存</text>
    <text x="337" y="287" class="text body-bold">命中 H</text>
    <rect x="411" y="244" width="78" height="54" rx="6" fill="#F5F5F7" stroke="#D2D2D7" />
    <text x="430" y="266" class="text tiny">节点</text>
    <text x="425" y="287" class="text body-bold">排队 Q</text>
    <rect x="499" y="244" width="78" height="54" rx="6" fill="#FFF4E5" stroke="#FF9F0A" />
    <text x="518" y="266" class="text tiny">网络</text>
    <text x="513" y="287" class="text body-bold">搬运 C</text>

    <rect x="323" y="317" width="254" height="50" rx="6" fill="#1D1D1F" />
    <text x="341" y="338" font-family="Avenir Next, Segoe UI, sans-serif"
        font-size="13" fill="#EAF8EE">选择总延迟最低的路径</text>
    <text x="341" y="358" font-family="Avenir Next, Segoe UI, sans-serif"
        font-size="16" font-weight="700" fill="#ffffff">Prefill P2 + Decode D1</text>

    <rect x="323" y="382" width="254" height="39" rx="6" fill="#FFF0EF" stroke="#FF3B30" />
    <text x="345" y="407" font-family="Avenir Next, Segoe UI, sans-serif"
        font-size="15" font-weight="700" fill="#FF3B30">预计超出 SLO → 提前拒绝</text>

    <!-- Step 3: prefill -->
    <rect x="660" y="142" width="300" height="298" rx="8" class="card" />
    <rect x="660" y="142" width="300" height="9" rx="4" fill="#34C759" />
    <circle cx="689" cy="177" r="18" fill="#34C759" />
    <text x="684" y="183" font-family="Avenir Next, Segoe UI, sans-serif"
        font-size="16" font-weight="700" fill="#ffffff">3</text>
    <text x="719" y="184" class="text card-title">Prefill</text>
    <text x="683" y="221" class="text small">只计算未命中的 Token</text>

    <text x="683" y="254" class="text tiny">直接复用</text>
    <rect x="683" y="266" width="33" height="34" rx="4" fill="#34C759" />
    <rect x="722" y="266" width="33" height="34" rx="4" fill="#34C759" />
    <rect x="761" y="266" width="33" height="34" rx="4" fill="#34C759" />
    <text x="806" y="288" class="text body-bold">+</text>
    <text x="837" y="254" class="text tiny">本次计算</text>
    <rect x="837" y="266" width="43" height="34" rx="4" fill="#FF9F0A" />
    <rect x="886" y="266" width="43" height="34" rx="4" fill="#FF9F0A" />

    <text x="683" y="331" class="text tiny">长 Prompt：CPP 跨节点流水</text>
    <rect x="683" y="343" width="64" height="34" rx="5" fill="#EAF8EE" stroke="#34C759" />
    <text x="704" y="365" class="text body-bold">C1</text>
    <path d="M751 360 H767" class="cache-read" />
    <rect x="773" y="343" width="64" height="34" rx="5" fill="#FFF4E5" stroke="#FF9F0A" />
    <text x="794" y="365" class="text body-bold">C2</text>
    <path d="M841 360 H857" class="cache-read" />
    <rect x="863" y="343" width="64" height="34" rx="5" fill="#FFF0EF" stroke="#FF3B30" />
    <text x="884" y="365" class="text body-bold">C3</text>

    <rect x="683" y="393" width="244" height="28" rx="5" fill="#EAF8EE" />
    <text x="705" y="412" class="text small">计算与 KV 传输重叠</text>

    <!-- Step 4: decode -->
    <rect x="1040" y="142" width="350" height="298" rx="8" class="card" />
    <rect x="1040" y="142" width="350" height="9" rx="4" fill="#FF3B30" />
    <circle cx="1069" cy="177" r="18" fill="#FF3B30" />
    <text x="1064" y="183" font-family="Avenir Next, Segoe UI, sans-serif"
        font-size="16" font-weight="700" fill="#ffffff">4</text>
    <text x="1099" y="184" class="text card-title">Decode</text>
    <text x="1063" y="221" class="text small">完整 KV 到达后加入连续批处理</text>

    <text x="1063" y="254" class="text tiny">完整 KV Cache</text>
    <rect x="1063" y="266" width="39" height="34" rx="4" fill="#34C759" />
    <rect x="1108" y="266" width="39" height="34" rx="4" fill="#34C759" />
    <rect x="1153" y="266" width="39" height="34" rx="4" fill="#34C759" />
    <rect x="1198" y="266" width="49" height="34" rx="4" fill="#FF9F0A" />
    <rect x="1253" y="266" width="49" height="34" rx="4" fill="#FF9F0A" />

    <text x="1063" y="331" class="text tiny">稳定输出 Token</text>
    <rect x="1063" y="345" width="50" height="37" rx="6" fill="#1D1D1F" />
    <text x="1081" y="369" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15" font-weight="700"
        fill="#ffffff">t1</text>
    <path d="M1118 363 H1135" class="flow" />
    <rect x="1141" y="345" width="50" height="37" rx="6" fill="#1D1D1F" />
    <text x="1159" y="369" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15" font-weight="700"
        fill="#ffffff">t2</text>
    <path d="M1196 363 H1213" class="flow" />
    <rect x="1219" y="345" width="50" height="37" rx="6" fill="#1D1D1F" />
    <text x="1237" y="369" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15" font-weight="700"
        fill="#ffffff">t3</text>
    <text x="1282" y="369" class="text body-bold">…</text>

    <rect x="1063" y="398" width="294" height="25" rx="5" fill="#FFF0EF" />
    <text x="1082" y="416" class="text small">不再被其他长 Prefill 阻塞</text>

    <!-- Primary left-to-right flow -->
    <path d="M242 291 H280" stroke="#1D1D1F" stroke-width="3" />
    <path d="M280 283 L294 291 L280 299 Z" fill="#1D1D1F" />
    <text x="249" y="275" class="text tiny">提交</text>
    <path d="M602 291 H640" stroke="#1D1D1F" stroke-width="3" />
    <path d="M640 283 L654 291 L640 299 Z" fill="#1D1D1F" />
    <text x="611" y="275" class="text tiny">选址</text>
    <path d="M962 291 H1018" stroke="#FF3B30" stroke-width="3" />
    <path d="M1018 283 L1034 291 L1018 299 Z" fill="#FF3B30" />
    <text x="971" y="275" font-family="Avenir Next, Segoe UI, sans-serif"
        font-size="12" fill="#FF3B30">流式 KV</text>

    <!-- One shared cache lane -->
    <rect x="300" y="526" width="660" height="112" rx="8" fill="#EAF8EE" stroke="#6E6E73"
        stroke-width="2" />
    <text x="325" y="558" class="text body-bold">共享 KV Cache</text>
    <text x="325" y="584" class="text small">记录前缀块的位置，并保存可复用 KV</text>

    <rect x="592" y="549" width="38" height="39" rx="4" fill="#34C759" />
    <rect x="636" y="549" width="38" height="39" rx="4" fill="#34C759" />
    <rect x="680" y="549" width="38" height="39" rx="4" fill="#34C759" />
    <rect x="724" y="549" width="38" height="39" rx="4" fill="#FF9F0A" />
    <rect x="768" y="549" width="38" height="39" rx="4" fill="#FF9F0A" />
    <text x="592" y="612" class="text tiny">DRAM / SSD · Messenger</text>

    <path d="M432 526 V448" class="metadata" />
    <text x="346" y="497" class="text tiny">位置与命中信息</text>
    <path d="M760 526 V448" class="cache-read" />
    <text x="672" y="497" class="text tiny">读取命中 KV</text>
    <path d="M884 448 V518" class="cache-write" />
    <text x="850" y="497" font-family="Avenir Next, Segoe UI, sans-serif"
        font-size="12" fill="#FF3B30">写回新 KV</text>

    <!-- Takeaway -->
    <rect x="220" y="683" width="1000" height="62" rx="8" fill="#1D1D1F" />
    <text x="720" y="708" text-anchor="middle"
        font-family="Avenir Next, Segoe UI, sans-serif" font-size="15"
        fill="#EAF8EE">核心不是“把请求发给最空闲的 GPU”</text>
    <text x="720" y="732" text-anchor="middle"
        font-family="Avenir Next, Segoe UI, sans-serif" font-size="19"
        font-weight="700" fill="#ffffff">而是选择“缓存复用 + 排队 + 搬运”总延迟最低的路径</text>
    <style id="editorial-diagram-style">
        text { font-family: Helvetica Neue, Segoe UI, sans-serif; letter-spacing: 0; }
        .page-title { fill: #111111 !important; font-weight: 800 !important; }
        .page-subtitle, .small, .tiny { fill: #333333 !important; }
        rect { rx: 3px; }
        .card { fill: #F4F4F4 !important; stroke: #111111 !important; stroke-width: 3 !important; filter: none !important; }
        .flow { stroke: #111111 !important; stroke-width: 3 !important; }
        .cache-read { stroke: #2D8C64 !important; stroke-width: 3 !important; }
        .cache-write { stroke: #A52A2A !important; stroke-width: 3 !important; }
        marker path { fill: #111111; }
        [fill="#F5F5F7" i] { fill: #FFFFFF !important; }
        [fill="#EAF3FC" i], [fill="#DBEAFE" i] { fill: #DDE0F1 !important; }
        [fill="#FFF4E5" i] { fill: #F2E6D8 !important; }
        [fill="#EAF8EE" i], [fill="#DCFCE7" i] { fill: #DCEBDF !important; }
        [fill="#FFF0EF" i] { fill: #F2D9D8 !important; }
    </style>
</svg>