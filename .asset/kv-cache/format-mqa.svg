<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" width="800" height="510">
  <defs>
    
    
    <style>
      text { font-family: Avenir Next, Segoe UI, sans-serif; }
      .mono { font-family: Avenir Next, Segoe UI, sans-serif; }
    </style>
  </defs>

  <!-- Card background -->
  <rect width="100%" height="100%" fill="#F5F5F7"/>
  <rect x="16" y="12" width="768" height="486" rx="8" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1.5"/>

  <!-- ==== Title ==== -->
  <text x="400" y="46" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" fill="#1D1D1F">MQA（多查询注意力）</text>
  <text x="400" y="74" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#6E6E73">32 Q heads → 1 KV head · 多对一共享 · num_kv_heads = 1（GQA 的极端情况）</text>

  <!-- ==== Head visualization ==== -->

  <!-- Q group block (all Q heads in one wide container) -->
  <rect x="120" y="100" width="480" height="66" rx="8" fill="#EAF3FC" stroke="#EAF3FC" stroke-width="1.5"/>
  <text x="360" y="114" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#6E6E73">32 个 Q head — 全部共享同一组 KV</text>

  <!-- Q indicator squares inside group -->
  <g dominant-baseline="central">
    <rect x="160" y="124" width="10" height="10" rx="2" fill="#0071E3"/>
    <rect x="174" y="124" width="10" height="10" rx="2" fill="#0071E3"/>
    <rect x="188" y="124" width="10" height="10" rx="2" fill="#0071E3"/>
    <rect x="202" y="124" width="10" height="10" rx="2" fill="#0071E3"/>
    <rect x="216" y="124" width="10" height="10" rx="2" fill="#0071E3"/>
    <text x="232" y="130" font-size="13" fill="#6E6E73">···</text>
    <rect x="250" y="124" width="10" height="10" rx="2" fill="#0071E3"/>
    <rect x="264" y="124" width="10" height="10" rx="2" fill="#0071E3"/>
    <rect x="278" y="124" width="10" height="10" rx="2" fill="#0071E3"/>

    <!-- Second row of Q indicators -->
    <rect x="230" y="138" width="10" height="10" rx="2" fill="#0071E3"/>
    <rect x="244" y="138" width="10" height="10" rx="2" fill="#0071E3"/>
    <rect x="258" y="138" width="10" height="10" rx="2" fill="#0071E3"/>
    <rect x="272" y="138" width="10" height="10" rx="2" fill="#0071E3"/>
    <rect x="286" y="138" width="10" height="10" rx="2" fill="#0071E3"/>
    <text x="302" y="144" font-size="13" fill="#6E6E73">···</text>
    <rect x="320" y="138" width="10" height="10" rx="2" fill="#0071E3"/>
    <rect x="334" y="138" width="10" height="10" rx="2" fill="#0071E3"/>
    <rect x="348" y="138" width="10" height="10" rx="2" fill="#0071E3"/>

    <!-- Third row: just ellipsis and Q₃₁ -->
    <text x="310" y="156" font-size="12" fill="#6E6E73">···</text>
    <rect x="340" y="152" width="10" height="10" rx="2" fill="#0071E3"/>
    <text x="358" y="158" font-size="10" fill="#6E6E73">Q₃₁</text>
  </g>

  <!-- Arrows converging to center -->
  <line x1="240" y1="166" x2="240" y2="178" stroke="#6E6E73" stroke-width="1"/>
  <line x1="360" y1="166" x2="360" y2="178" stroke="#6E6E73" stroke-width="1"/>
  <line x1="480" y1="166" x2="480" y2="178" stroke="#6E6E73" stroke-width="1"/>
  <!-- Converging lines -->
  <line x1="240" y1="178" x2="356" y2="186" stroke="#6E6E73" stroke-width="1"/>
  <line x1="480" y1="178" x2="364" y2="186" stroke="#6E6E73" stroke-width="1"/>
  <!-- Center arrow -->
  <line x1="360" y1="178" x2="360" y2="186" stroke="#6E6E73" stroke-width="1.2"/>
  <polygon points="356,190 360,196 364,190" fill="#6E6E73"/>

  <!-- Single KV head box (centered) -->
  <rect x="305" y="196" width="110" height="24" rx="5" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/>
  <rect x="305" y="196" width="55" height="24" rx="5" fill="#FF9F0A"/>
  <rect x="358" y="196" width="2" height="24" fill="#FFFFFF"/>
  <rect x="360" y="196" width="55" height="24" rx="5" fill="#34C759"/>
  <rect x="358" y="196" width="2" height="24" fill="#FF9F0A"/>
  <text x="332" y="208" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#FFFFFF">K₀</text>
  <text x="387" y="208" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#FFFFFF">V₀</text>

  <!-- ==== Row labels (left) ==== -->
  <text x="24" y="122" dominant-baseline="central" font-size="12" font-weight="600" fill="#0071E3">Q<tspan font-weight="400" font-size="10" fill="#6E6E73">（不缓存）</tspan></text>
  <text x="24" y="208" dominant-baseline="central" font-size="12" font-weight="600" fill="#FF9F0A">K / V<tspan font-weight="400" font-size="10" fill="#6E6E73">（缓存）</tspan></text>

  <!-- ==== Right-side bracket: many-to-1 ==== -->
  <path d="M 726,106
           Q 734,106 736,114
           L 736,164
           L 742,170
           L 736,176
           L 736,202
           Q 736,212 726,212"
        fill="none" stroke="#6E6E73" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="718" y="158" text-anchor="end" dominant-baseline="central" font-size="12" font-weight="600" fill="#6E6E73">×1 组</text>
  <text x="718" y="174" text-anchor="end" dominant-baseline="central" font-size="10" fill="#6E6E73">32 head : 1 KV</text>

  <!-- ==== Divider ==== -->
  <line x1="60" y1="244" x2="740" y2="244" stroke="#D2D2D7" stroke-width="1"/>

  <!-- ==== Storage calculation ==== -->
  <text x="60" y="268" dominant-baseline="central" font-size="13" font-weight="700" fill="#1D1D1F">每个 token 每层 KV Cache 存储（fp16 / bf16，2 bytes / element）</text>

  <!-- Storage detail bg -->
  <rect x="60" y="282" width="680" height="78" rx="8" fill="#F5F5F7" stroke="#D2D2D7" stroke-width="1"/>

  <!-- K: line -->
  <text x="80" y="308" dominant-baseline="central" font-size="14" font-weight="600" fill="#FF9F0A" class="mono">K:</text>
  <text x="105" y="308" dominant-baseline="central" font-size="14" fill="#1D1D1F">
    <tspan class="mono">1 head</tspan>
    <tspan fill="#6E6E73" font-size="13"> × </tspan>
    <tspan class="mono">128 dim</tspan>
    <tspan fill="#6E6E73" font-size="13"> × </tspan>
    <tspan class="mono">2 B</tspan>
    <tspan fill="#6E6E73" font-size="13"> = </tspan>
    <tspan class="mono" font-weight="600">256 B</tspan>
  </text>

  <!-- V: line -->
  <text x="80" y="336" dominant-baseline="central" font-size="14" font-weight="600" fill="#34C759" class="mono">V:</text>
  <text x="105" y="336" dominant-baseline="central" font-size="14" fill="#1D1D1F">
    <tspan class="mono">1 head</tspan>
    <tspan fill="#6E6E73" font-size="13"> × </tspan>
    <tspan class="mono">128 dim</tspan>
    <tspan fill="#6E6E73" font-size="13"> × </tspan>
    <tspan class="mono">2 B</tspan>
    <tspan fill="#6E6E73" font-size="13"> = </tspan>
    <tspan class="mono" font-weight="600">256 B</tspan>
  </text>

  <!-- ==== Total row ==== -->
  <rect x="60" y="376" width="430" height="34" rx="8" fill="#F5F5F7" stroke="#D2D2D7" stroke-width="1"/>
  <text x="80" y="393" dominant-baseline="central" font-size="13" fill="#1D1D1F">
    <tspan fill="#FF9F0A" font-weight="600">K</tspan>
    <tspan> + </tspan>
    <tspan fill="#34C759" font-weight="600">V</tspan>
    <tspan> = 256 B + 256 B = </tspan>
    <tspan class="mono" font-weight="700">512 B = 0.5 KB / token / layer</tspan>
  </text>

  <!-- Total badge (right) -->
  <rect x="510" y="376" width="230" height="34" rx="8" fill="#F5F5F7" stroke="#D2D2D7" stroke-width="1.5"/>
  <text x="625" y="393" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="#1D1D1F">合计：0.5 KB / token / layer</text>

  <!-- vs comparison badges -->
  <rect x="510" y="420" width="230" height="22" rx="6" fill="#FFF4E5"/>
  <text x="625" y="431" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="600" fill="#8A4B00">仅为 MHA 的 1/64</text>

  <rect x="60" y="420" width="200" height="22" rx="6" fill="#FFF0EF"/>
  <text x="160" y="431" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="600" fill="#FF3B30">代价：注意力质量下降</text>

  <!-- ==== Footer ==== -->
  <text x="400" y="470" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#6E6E73">
    注：假设配置。仅 1 组 KV 意味着所有 Q head 从同一视角观察输入，表达能力受限。PaLM、Falcon 使用过 MQA，现已基本被 GQA 取代。
  </text>
  <style id="editorial-diagram-style">
    text { font-family: Helvetica Neue, Segoe UI, sans-serif; letter-spacing: 0; }
    text[font-weight="700"] { font-weight: 800; }
    rect { rx: 3px; }
    [fill="#F5F5F7" i] { fill: #FFFFFF !important; }
    [fill="#0071E3" i] { fill: #5367C7 !important; }
    [fill="#FF9F0A" i] { fill: #A64CC7 !important; }
    [fill="#34C759" i] { fill: #2D8C64 !important; }
    [fill="#EAF3FC" i] { fill: #DDE0F1 !important; }
    [fill="#FFF4E5" i] { fill: #F2E6D8 !important; }
    [fill="#EAF8EE" i] { fill: #DCEBDF !important; }
    [stroke="#D2D2D7" i], [stroke="#6E6E73" i], [stroke="#0071E3" i], [stroke="#FF9F0A" i], [stroke="#34C759" i] { stroke: #111111 !important; stroke-width: 2.5 !important; }
  </style>
</svg>
